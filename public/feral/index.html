<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dead Zone: Feral — DEADZONE</title>
<meta name="description" content="Dead Zone: Feral is a top-down wave-survival shooter. Cute creatures have gone feral. Hold the barn, buy guns, open the map and survive round after round.">
<meta name="theme-color" content="#0b0715">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dead Zone: Feral">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage"><canvas id="game" width="480" height="270"></canvas></div>

<!-- in-game HUD -->
<div id="hud" class="hidden" aria-live="polite">
  <div id="hudTL">
    <div class="pts"><span class="ico coin"></span><b id="hPts">500</b><span id="hPtsX" class="x2">x2</span></div>
    <div class="hp"><div id="hHpFill"></div><span id="hHp">100</span></div>
    <div id="hPerks"></div>
  </div>
  <div id="hudTop">
    <div id="hRound">ROUND 1</div>
    <div id="hSub"></div>
    <div id="hBoss" class="hidden"><span id="hBossName">Elder Mossmaw</span><div class="bar"><div id="hBossFill"></div></div></div>
    <div id="hPowers"></div>
  </div>
  <div id="hudBR">
    <div id="hWpnRow"><img id="hWpnImg" alt=""><div><div id="hWpnName">Pip Popper</div><div id="hAmmo"><b id="hMag">12</b><span id="hRes"> / 96</span></div></div></div>
    <div id="hSlots"></div>
    <div id="hReload" class="hidden">RELOADING</div>
  </div>
  <div id="prompt" class="hidden"><span class="key" id="pKey">E</span><span id="pText"></span><span id="pCost"></span></div>
  <div id="toast" class="hidden"></div>
  <div id="banner" class="hidden"></div>
  <div id="hudBtns"><button id="bMute" class="mini" aria-label="Mute">&#128266;</button><button id="bPause" class="mini" aria-label="Pause">&#10074;&#10074;</button></div>
  <div id="hint" class="hidden"></div>
</div>

<!-- touch controls -->
<div id="touch" class="hidden">
  <div class="stickBase" id="baseL"></div><div class="stickKnob" id="knobL"></div>
  <div class="stickBase" id="baseR"></div><div class="stickKnob" id="knobR"></div>
  <div id="tBtns">
    <button id="tSwap" class="tbtn small">SWAP</button>
    <button id="tReload" class="tbtn small">RELOAD</button>
    <button id="tUse" class="tbtn">USE</button>
  </div>
</div>

<!-- screens -->
<div id="screens">
  <section id="sMenu" class="screen">
    <div class="logo"><div class="l1">DEAD ZONE</div><div class="l2">FERAL</div></div>
    <div class="tag">The cute ones have gone feral. Hold the barn.</div>
    <div id="mascots"></div>
    <div class="col">
      <button class="btn big" data-act="play" id="bPlay">Play</button>
      <div class="row">
        <button class="btn" data-act="how">How to play</button>
        <button class="btn" data-act="settings">Settings</button>
      </div>
      <div class="row">
        <button class="btn sm" data-act="fullscreen" id="bFs">Full screen</button>
        <button class="btn sm hidden" data-act="install" id="bInstall">Install app</button>
        <a class="btn sm" href="/" id="bHome">All games</a>
      </div>
    </div>
    <div id="hiscore" class="hi"></div>
    <div id="padHint" class="padhint"></div>
  </section>

  <section id="sHow" class="screen">
    <h2>How to play</h2>
    <div class="scroll" id="howBody"></div>
    <button class="btn" data-act="back">Back</button>
  </section>

  <section id="sSettings" class="screen">
    <h2>Settings</h2>
    <div class="scroll">
      <div class="set"><label for="vMaster">Volume</label><input type="range" id="vMaster" min="0" max="100" data-set="master"><output id="oMaster"></output></div>
      <div class="set"><label for="vMusic">Music</label><input type="range" id="vMusic" min="0" max="100" data-set="music"><output id="oMusic"></output></div>
      <div class="set"><label for="vSfx">Sound effects</label><input type="range" id="vSfx" min="0" max="100" data-set="sfx"><output id="oSfx"></output></div>
      <div class="set"><label>Mute everything</label><button class="tog" data-tog="muted"></button></div>
      <div class="set"><label>Aim assist (touch and controller)</label><button class="tog" data-tog="aimAssist"></button></div>
      <div class="set"><label>Auto-fire when the right stick is pushed (touch)</label><button class="tog" data-tog="autoFire"></button></div>
      <div class="set"><label>Left-handed sticks (touch)</label><button class="tog" data-tog="leftHand"></button></div>
      <div class="set"><label>Screen shake</label><button class="tog" data-tog="shake"></button></div>
      <div class="set"><label>Damage numbers</label><button class="tog" data-tog="numbers"></button></div>
      <h3>Controls</h3>
      <div class="controls" id="ctlHelp"></div>
    </div>
    <button class="btn" data-act="back">Back</button>
  </section>

  <section id="sPause" class="screen">
    <h2>Paused</h2>
    <div class="col">
      <button class="btn big" data-act="resume">Resume</button>
      <button class="btn" data-act="settings">Settings</button>
      <button class="btn" data-act="how">How to play</button>
      <button class="btn danger" data-act="quit">Quit to menu</button>
    </div>
  </section>

  <section id="sOver" class="screen">
    <h2 class="red">You fell</h2>
    <div class="stats">
      <div><span>Round reached</span><b id="oRound">0</b></div>
      <div><span>Creatures beaten</span><b id="oKills">0</b></div>
      <div><span>Points</span><b id="oPts">0</b></div>
    </div>
    <div id="oBest" class="hi"></div>
    <div class="col">
      <button class="btn big" data-act="again">Play again</button>
      <button class="btn" data-act="menu">Main menu</button>
    </div>
  </section>

  <section id="sConfirm" class="screen">
    <h2>Quit this run?</h2>
    <div class="row"><button class="btn danger" data-act="quitYes">Quit</button><button class="btn" data-act="quitNo">Keep playing</button></div>
  </section>
</div>

<div id="rotate"><div><div class="ph"></div><p>Turn your phone sideways to play</p></div></div>
<div id="boot"><div class="spin"></div></div>

<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
