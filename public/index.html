<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEADZONE — Choose Your Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }
        h1 {
            font-size: 5rem;
            margin: 0 0 5px;
            text-transform: uppercase;
            letter-spacing: 14px;
            color: #00ffc8;
            text-shadow: 0 0 40px rgba(0,255,200,0.5), 0 0 80px rgba(0,255,200,0.2);
        }
        .subtitle {
            color: #999;
            font-size: 1.4rem;
            margin-bottom: 50px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 960px;
            width: 100%;
            padding: 0 20px;
        }
        .card {
            border: 2px solid #222;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            aspect-ratio: 3 / 4;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: #111;
        }
        .card:hover {
            border-color: #00ffc8;
            box-shadow: 0 0 30px rgba(0,255,200,0.2);
            transform: translateY(-6px);
        }

        /* --- LIVE CARD (image-based) --- */
        .card.live .card-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .card.live .card-info {
            position: relative;
            z-index: 2;
            background: linear-gradient(transparent, rgba(0,0,0,0.9) 50%);
            padding: 40px 10px 16px;
        }
        .card.live {
            border-color: #00ffc8;
            box-shadow: 0 0 15px rgba(0,255,200,0.1);
        }

        /* --- LOCKED CARD --- */
        .card.locked {
            opacity: 0.35;
            cursor: default;
            justify-content: center;
            align-items: center;
            background: #0d0d14;
        }
        .card.locked:hover {
            border-color: #333;
            box-shadow: none;
            transform: none;
        }
        .lock-icon {
            font-size: 1.8rem;
            margin-bottom: 14px;
            opacity: 0.6;
        }

        /* --- TEXT --- */
        .card-title {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            color: #fff;
        }
        .card-status {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .card.live .card-status { color: #00ffc8; }
        .card.locked .card-status { color: #555; }

        @media (max-width: 700px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            h1 { font-size: 2.8rem; letter-spacing: 8px; }
            .subtitle { font-size: 1rem; letter-spacing: 4px; margin-bottom: 30px; }
        }
        @media (max-width: 400px) {
            h1 { font-size: 2rem; letter-spacing: 5px; }
            .subtitle { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <h1>DEADZONE</h1>
    <p class="subtitle">Choose Your Arena</p>
    <div class="grid">

        <div class="card live" onclick="window.location.href='/mech-invasion/'">
            <img class="card-image" src="mech-invasion/assets/card-thumb.jpg" alt="Mech Invasion">
            <div class="card-info">
                <div class="card-title">Mech Invasion</div>
                <div class="card-status">▶ Play Now</div>
            </div>
        </div>

        <div class="card locked">
            <div class="lock-icon">🔒</div>
            <div class="card-title">Western</div>
            <div class="card-status">Coming Soon</div>
        </div>

        <div class="card locked">
            <div class="lock-icon">🔒</div>
            <div class="card-title">Zombies</div>
            <div class="card-status">Coming Soon</div>
        </div>

        <div class="card locked">
            <div class="lock-icon">🔒</div>
            <div class="card-title">Arcade</div>
            <div class="card-status">Coming Soon</div>
        </div>

        <div class="card locked">
            <div class="lock-icon">🔒</div>
            <div class="card-title">Pirates</div>
            <div class="card-status">Coming Soon</div>
        </div>

        <div class="card locked">
            <div class="lock-icon">🔒</div>
            <div class="card-title">Galactic</div>
            <div class="card-status">Coming Soon</div>
        </div>

        <div class="card locked">
            <div class="lock-icon">🔒</div>
            <div class="card-title">Dinosaurs</div>
            <div class="card-status">Coming Soon</div>
        </div>

        <div class="card locked">
            <div class="lock-icon">🔒</div>
            <div class="card-title">Hunter</div>
            <div class="card-status">Coming Soon</div>
        </div>

    </div>
</body>
</html>
