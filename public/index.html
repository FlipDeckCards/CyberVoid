<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEADZONE — Choose Your Arena</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 2.4rem;
    margin: 40px 0 10px;
    text-transform: uppercase;
    letter-spacing: 6px;
    color: #00ffc8;
    text-shadow: 0 0 20px rgba(0,255,200,0.4);
  }
  .subtitle {
    color: #666;
    font-size: 0.85rem;
    margin-bottom: 40px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    max-width: 900px;
    padding: 0 20px;
    width: 100%;
  }
  .card {
    background: #13131a;
    border: 2px solid #222;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: #00ffc8;
    box-shadow: 0 0 30px rgba(0,255,200,0.15);
    transform: translateY(-4px);
  }
  .card.locked {
    opacity: 0.4;
    cursor: default;
  }
  .card.locked:hover {
    border-color: #333;
    box-shadow: none;
    transform: none;
  }
  .card-icon {
    width: 80px;
    height: 80px;
    background: #1a1a25;
    border: 2px solid #333;
    border-radius: 8px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }
  .card.live .card-icon {
    border-color: #00ffc8;
    box-shadow: 0 0 15px rgba(0,255,200,0.2);
  }
  .card-title {
    font-size: 0.95rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .card-status {
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .card.live .card-status { color: #00ffc8; }
  .card.locked .card-status { color: #444; }
  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<h1>DEADZONE</h1>
<p class="subtitle">Choose Your Arena</p>
<div class="grid">
  <div class="card live" onclick="window.location.href='/mech-invasion/'">
    <div class="card-icon">🤖</div>
    <div class="card-title">Mech Invasion</div>
    <div class="card-status">▶ Play Now</div>
  </div>
  <div class="card locked">
    <div class="card-icon">🤠</div>
    <div class="card-title">Western</div>
    <div class="card-status">Coming Soon</div>
  </div>
  <div class="card locked">
    <div class="card-icon">🧟</div>
    <div class="card-title">Zombies</div>
    <div class="card-status">Coming Soon</div>
  </div>
  <div class="card locked">
    <div class="card-icon">👾</div>
    <div class="card-title">Arcade</div>
    <div class="card-status">Coming Soon</div>
  </div>
  <div class="card locked">
    <div class="card-icon">🏴‍☠️</div>
    <div class="card-title">Pirates</div>
    <div class="card-status">Coming Soon</div>
  </div>
  <div class="card locked">
    <div class="card-icon">🚀</div>
    <div class="card-title">Galactic</div>
    <div class="card-status">Coming Soon</div>
  </div>
  <div class="card locked">
    <div class="card-icon">🦖</div>
    <div class="card-title">Dinosaurs</div>
    <div class="card-status">Coming Soon</div>
  </div>
  <div class="card locked">
    <div class="card-icon">🦌</div>
    <div class="card-title">Hunter</div>
    <div class="card-status">Coming Soon</div>
  </div>
</div>
</body>
</html>
