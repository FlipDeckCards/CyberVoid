<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DEADZONE</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="startScreen">
    <h1 class="title">DEAD<span class="accent">ZONE</span></h1>
    <p class="subtitle">SURVIVE THE HORDE</p>
    <div id="leaderboardBox">
      <h2 class="lb-title">TOP OPERATORS</h2>
      <div id="leaderboardList"></div>
    </div>
    <input type="text" id="nameInput" placeholder="Enter callsign..." maxlength="16" />
    <button id="startBtn">JACK IN</button>
  </div>
  <div id="gameOverScreen" style="display:none;">
    <div class="go-title" id="goTitle">TERMINATED</div>
    <div class="go-wave" id="goWave"></div>
    <div class="go-score" id="goScore"></div>
    <div class="go-rank" id="goRank"></div>
    <button id="restartBtn">DEPLOY AGAIN</button>
  </div>
  <canvas id="game"></canvas>
  <script src="/js/game.js"></script>
</body>
</html>
