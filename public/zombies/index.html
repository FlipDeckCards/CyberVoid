    function updateBossHUD() {
        if (!activeBoss || activeBoss.dead) {
            document.getElementById('boss-bar').style.display = 'none';
            return;
        }
        const pct = Math.max(0, activeBoss.health / activeBoss.maxHealth * 100);
        document.getElementById('boss-health-fill').style.width = pct + '%';
    }

    function damageEnemy(enemy, baseDmg, hitPoint) {
        const isCritical = hitPoint.y > (enemy.group.position.y + 1.2);
        const dmg = isCritical ? baseDmg * 2 : baseDmg;

        enemy.health -= dmg;
        enemy.hitFlashTimer = 0.1;
        const hitDist = camera.position.distanceTo(hitPoint);
        playHitImpact(hitDist, isCritical);
        spawnDamageNumber(hitPoint, dmg, isCritical);

        if (enemy.isBoss) {
            updateBossHUD();

            if (enemy.bossWaveNum >= 4 && !enemy.enraged &&
                enemy.health < enemy.maxHealth * 0.25) {
                enemy.enraged = true;
                enemy.speed *= 2.5;
                enemy.slamCooldown = 0;
                showWaveAnnounce('⚠ ENRAGED ⚠');
            }
            else if (enemy.bossWaveNum < 4 && !enemy.enraged &&
                enemy.health < enemy.maxHealth * 0.3) {
                enemy.enraged = true;
                enemy.speed *= 2;
                showWaveAnnounce('⚠ ENRAGED ⚠');
            }
        } else {
            updateHealthBar(enemy);
        }

        if (enemy.health <= 0 && !enemy.dead) {
            killEnemy(enemy);
        }
    }

    function killEnemy(enemy) {
        enemy.dead = true;
        playDeathSound(enemy.type, enemy.group.position);
        kills++;
        score += enemy.points;
        waveEnemiesLeft--;
        updateHUD();

        if (enemy.isBoss) {
            activeBoss = null;
            document.getElementById('boss-bar').style.display = 'none';
            screenShake = 0.5;
            spawnShockwave(enemy.group.position.clone());

            for (let i = 0; i < 3; i++) {
                const dropPos = enemy.group.position.clone();
                dropPos.x += (Math.random() - 0.5) * 3;
                dropPos.z += (Math.random() - 0.5) * 3;
                spawnPowerup(dropPos);
            }

            if (enemy.bossWaveNum >= 3) {
                const boomRadius = 12;
                const boomDamage = 100;
                for (const e of activeEnemies) {
                    if (e.dead || e === enemy) continue;
                    const dist = e.group.position.distanceTo(enemy.group.position);
                    if (dist < boomRadius) {
                        const falloff = 1 - (dist / boomRadius);
                        const chainDmg = boomDamage * falloff;
                        e.health -= chainDmg;
                        e.hitFlashTimer = 0.2;
                        spawnDamageNumber(e.group.position.clone().setY(1.5), chainDmg, false);
                        if (e.health <= 0 && !e.dead) killEnemy(e);
                    }
                }
                spawnShockwave(enemy.group.position.clone());
                screenShake = 0.8;
            }
        } else {
            if (enemy.healthBar) scene.remove(enemy.healthBar.sprite);
        }

        if (enemy.walkAction) enemy.walkAction.stop();
        if (enemy.deadAction) {
            enemy.deadAction.reset();
            enemy.deadAction.play();
        }

        if (!enemy.isBoss && Math.random() < CONFIG.dropChance) {
            spawnPowerup(enemy.group.position.clone());
        }
    }

    function updateEnemies(dt) {
        for (let i = activeEnemies.length - 1; i >= 0; i--) {
            const e = activeEnemies[i];
            e.mixer.update(dt);

            if (e.dead) {
                e.despawnTimer += dt;
                if (e.despawnTimer > CONFIG.despawnTime) {
                    scene.remove(e.group);
                    if (e.healthBar) scene.remove(e.healthBar.sprite);
                    activeEnemies.splice(i, 1);
                }
                continue;
            }

            if (!e.isBoss) updateHealthBar(e);

            const dir = new THREE.Vector3(
                camera.position.x - e.group.position.x,
                0,
                camera.position.z - e.group.position.z
            );
            const dist = dir.length();
            dir.normalize();

            if (dist > 0.5) {
                _currentQuat.copy(e.group.quaternion);
                e.group.lookAt(camera.position.x, e.group.position.y, camera.position.z);
                _targetQuat.copy(e.group.quaternion);
                e.group.quaternion.copy(_currentQuat);
                e.group.quaternion.slerp(_targetQuat, Math.min(1, 5 * dt));
            }

            if (dist > CONFIG.meleeRange) {
                e.group.position.addScaledVector(dir, e.speed * dt);

                if (e.walkAction) {
                    e.walkAction.timeScale = e.speed / ANIM_REFERENCE_SPEED;
                }
                if (dist < GROWL_RANGE) {
                    if (!e.growlCooldown) e.growlCooldown = Math.random() * 2;
                    e.growlCooldown -= dt;
                    if (e.growlCooldown <= 0) {
                        playGrowl(e.type, dist);
                        e.growlCooldown = GROWL_COOLDOWN + Math.random() * 2.0;
                    }
                }
            } else {
                if (e.walkAction) {
                    e.walkAction.timeScale = 0.3;
                }
                if (!e.growlCooldown) e.growlCooldown = 0;
                e.growlCooldown -= dt;
                if (e.growlCooldown <= 0) {
                    playGrowl(e.type, dist);
                    e.growlCooldown = GROWL_COOLDOWN + Math.random() * 1.5;
                }
                hp -= e.damage * dt;
                updateHealthHUD();

                if (e.isBoss && e.bossWaveNum >= 2) {
                    e.slamCooldown -= dt;
                    if (e.slamCooldown <= 0) {
                        const slamDmg = e.enraged ? 20 : 12;
                        hp -= slamDmg;
                        updateHealthHUD();
                        screenShake = 0.3;
                        spawnShockwave(e.group.position.clone());
                        e.slamCooldown = e.enraged ? 1.5 : 3.0;
                    }
                }

                if (e.isBoss && e.enraged && e.bossWaveNum >= 4) {
                    e.redPulseTimer += dt;
                    const pulse = Math.sin(e.redPulseTimer * 8) * 0.5 + 0.5;
                    e.group.traverse(c => {
                        if (c.isMesh && c.material.emissive) {
                            c.material.emissive.setRGB(pulse * 0.8, 0, 0);
                        }
                    });
                }

                if (e.isBoss) screenShake = Math.max(screenShake, 0.05);
                if (hp <= 0) {
                    hp = 0;
                    gameOver();
                }
            }
        }
    }

    // ═══════════════════════════════════════
    // WAVE SYSTEM
    // ═══════════════════════════════════════
    function startWave() {
        wave++;
        betweenWaves = false;

        const totalEnemies = 3 + wave * 2;
        const isBossWave = (wave % 10 === 0);
        waveEnemiesLeft = totalEnemies + (isBossWave ? 1 : 0);

        updateHUD();
        showWaveAnnounce(`WAVE ${wave}`);
        playWaveKlaxon(wave % 10 === 0);

        let spawned = 0;
        const spawnInterval = setInterval(() => {
            if (spawned >= totalEnemies || state !== 'playing') {
                clearInterval(spawnInterval);
                if (isBossWave && state === 'playing') {
                    setTimeout(() => spawnEnemy('boss'), 1500);
                }
                return;
            }
            const type = pickEnemyType();
            spawnEnemy(type);
            spawned++;
        }, 900);
    }

    function pickEnemyType() {
        const r = Math.random();
        if (wave <= 3) {
            return r < 0.80 ? 'shambler' : 'runner';
        } else if (wave <= 7) {
            if (r < 0.40) return 'shambler';
            if (r < 0.65) return 'runner';
            if (r < 0.85) return 'tank';
            return 'brute';
        } else {
            if (r < 0.20) return 'shambler';
            if (r < 0.40) return 'runner';
            if (r < 0.65) return 'tank';
            return 'brute';
        }
    }

    function checkWaveComplete() {
        if (waveEnemiesLeft <= 0 && !betweenWaves && state === 'playing') {
            betweenWaves = true;
            waveTimer = 4;

            ammo[1] += 4;
            ammo[2] += 15;
            updateAmmoHUD();
        }
    }

    // ═══════════════════════════════════════
    // ZOMBIE PROXIMITY INDICATOR
    // ═══════════════════════════════════════
    const threatEls = {
        left:   document.getElementById('threat-left'),
        right:  document.getElementById('threat-right'),
        top:    document.getElementById('threat-top'),
        bottom: document.getElementById('threat-bottom')
    };

    function updateThreatIndicators() {
        let maxL = 0, maxR = 0, maxT = 0, maxB = 0;
        const THREAT_DIST = 15;

        for (const e of activeEnemies) {
            if (e.dead) continue;
            const dir = new THREE.Vector3();
            dir.subVectors(e.group.position, camera.position);
            const dist = dir.length();
            if (dist > THREAT_DIST) continue;

            const intensity = 1 - (dist / THREAT_DIST);

            const forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
            const right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
            const flatDir = new THREE.Vector3(dir.x, 0, dir.z).normalize();

            const dot = forward.dot(flatDir);
            const cross = right.dot(flatDir);

            if (cross < -0.3) maxL = Math.max(maxL, intensity);
            if (cross > 0.3)  maxR = Math.max(maxR, intensity);
            if (dot < -0.2) maxB = Math.max(maxB, intensity);
        }

        threatEls.left.style.opacity = maxL;
        threatEls.right.style.opacity = maxR;
        threatEls.top.style.opacity = maxT;
        threatEls.bottom.style.opacity = maxB;
    }

    // ═══════════════════════════════════════
    // SCREEN SHAKE + HEAD BOB
    // ═══════════════════════════════════════
    function updateScreenShake(dt) {
        const camSmooth = Math.min(1, dt * 25);
        camera.position.x += (playerPos.x - camera.position.x) * camSmooth;
        camera.position.z += (playerPos.z - camera.position.z) * camSmooth;
        camera.position.y = CONFIG.player.height;
        if (isMoving) {
            const bobFreq = isSprinting ? 9 : 5;
const bobAmt = isSprinting ? 0.015 : 0.008;
const swayAmt = isSprinting ? 0.006 : 0.004;
            const bobVal = Math.sin(wpnBobTime * bobFreq);
            camera.position.y += bobVal * bobAmt;
            camera.position.x += Math.cos(wpnBobTime * bobFreq * 0.5) * swayAmt;
            const stepInterval = isSprinting ? 0.18 : 0.32;
            const now = performance.now() / 1000;
            if (bobVal < -0.7 && (now - lastStepTime) > stepInterval) {
                lastStepTime = now;
                playFootstep();
            }
        }
        if (screenShake > 0) {
            screenShake -= dt;
            const intensity = Math.min(screenShake, 0.3) * 0.15;
            camera.position.x += (Math.random() - 0.5) * intensity;
            camera.position.z += (Math.random() - 0.5) * intensity;
        }
    }

    // ═══════════════════════════════════════
    // PLAYER MOVEMENT (WASD + Joystick + Gamepad)
    // ═══════════════════════════════════════
    const _moveForward = new THREE.Vector3();
    const _moveRight = new THREE.Vector3();
    const _yAxis = new THREE.Vector3(0, 1, 0);

    function updateMovement(dt) {
        const moveX = (moveJoyDeltaX || 0);
        const moveY = (moveJoyDeltaY || 0);
        let inputX = moveX;
        let inputY = moveY;

        if (keys['w'] || keys['arrowup'])    inputY += 1;
        if (keys['s'] || keys['arrowdown'])  inputY -= 1;
        if (keys['a'] || keys['arrowleft'])  inputX -= 1;
        if (keys['d'] || keys['arrowright']) inputX += 1;

        const gp = getGamepad();
        if (gp) {
            const dead = 0.15;
            let lx = gp.axes[0] || 0;
            let ly = gp.axes[1] || 0;
            if (Math.abs(lx) < dead) lx = 0;
            if (Math.abs(ly) < dead) ly = 0;
            inputX += lx;
            inputY -= ly;
            isSprinting = gp.buttons[10] ? gp.buttons[10].pressed : false;
        }

        const len = Math.sqrt(inputX * inputX + inputY * inputY);
        if (len > 1) { inputX /= len; inputY /= len; }

        isMoving = len > 0.1;

        if (isADS || !isMoving) isSprinting = false;

        if (!isMoving) return;

        const sprintMult = isSprinting ? SPRINT_MULT : 1.0;
        const adsMult = isADS ? ADS_MOVE_MULT : 1.0;
        const boostMult = speedBoostTimer > 0 ? 1.5 : 1.0;
        const speed = MOVE_SPEED * sprintMult * adsMult * boostMult * dt;

        _moveForward.set(0, 0, -1).applyAxisAngle(_yAxis, yaw);
        _moveRight.set(1, 0, 0).applyAxisAngle(_yAxis, yaw);

        playerPos.x += (_moveForward.x * inputY + _moveRight.x * inputX) * speed;
        playerPos.z += (_moveForward.z * inputY + _moveRight.z * inputX) * speed;

        playerPos.x = Math.max(-ARENA_BOUNDS, Math.min(ARENA_BOUNDS, playerPos.x));
        playerPos.z = Math.max(-ARENA_BOUNDS, Math.min(ARENA_BOUNDS, playerPos.z));
    }

    // ═══════════════════════════════════════
    // AIM ASSIST (gamepad only)
    // ═══════════════════════════════════════
    const _aaDir = new THREE.Vector3();
    const _aaToTarget = new THREE.Vector3();
    const _aaInvQuat = new THREE.Quaternion();

    function getAimAssistTarget() {
        if (gamepadIndex === null) return null;

        let best = null;
        let bestAngle = 0.5;

        _aaDir.set(0, 0, -1).applyEuler(camera.rotation);

        for (const e of activeEnemies) {
            if (e.dead) continue;

            _aaToTarget.set(
                e.group.position.x - camera.position.x,
                (e.group.position.y + 1.3) - camera.position.y,
                e.group.position.z - camera.position.z
            );
            const dist = _aaToTarget.length();
            if (dist > 50 || dist < 1) continue;

            _aaToTarget.normalize();
            const angle = _aaDir.angleTo(_aaToTarget);

            if (angle < bestAngle) {
                bestAngle = angle;

                _aaInvQuat.copy(camera.quaternion).invert();
                const local = _aaToTarget.clone().applyQuaternion(_aaInvQuat);

                best = {
                    yawOffset: Math.atan2(local.x, -local.z),
                    pitchOffset: Math.atan2(local.y, -local.z),
                    angle,
                    dist
                };
            }
        }
        return best;
    }

    function updateGamepad(dt) {
        const gp = getGamepad();
        if (!gp) return;

        const dead = 0.15;
        let rx = gp.axes[2] || 0;
        let ry = gp.axes[3] || 0;
        if (Math.abs(rx) < dead) rx = 0;
        if (Math.abs(ry) < dead) ry = 0;

        const aaTarget = getAimAssistTarget();
        let aimSens = 1.0;

        if (aaTarget) {
            const frictionBase = isADS ? 0.2 : 0.4;
            aimSens = frictionBase + (1 - frictionBase) * (aaTarget.angle / 0.35);

            const stickMag = Math.sqrt(rx * rx + ry * ry);
            if (stickMag > 0.05) {
                const pullBase = isADS ? 4.0 : 2.5;
                const pullStr = pullBase * (1 - aaTarget.angle / 0.35);
                yaw -= aaTarget.yawOffset * pullStr * dt;
                pitch -= aaTarget.pitchOffset * pullStr * 0.3 * dt;
            }
        }

        const adsTurnMult = isADS ? 0.6 : 1.0;

        yaw -= rx * 3.0 * aimSens * adsTurnMult * dt;
        pitch -= ry * 2.0 * aimSens * adsTurnMult * dt;
        pitch = Math.max(-1.2, Math.min(1.2, pitch));

        isADS = gp.buttons[4] ? gp.buttons[4].pressed : false;
        if (isADS) isSprinting = false;

        const r1 = gp.buttons[5] ? gp.buttons[5].pressed : false;
        if (r1) {
            if (!gpFireHeld) {
                gpFireHeld = true;
                fireHeld = true;
                hasFiredThisClick = false;
                shoot();
            }
        } else {
            if (gpFireHeld) {
                gpFireHeld = false;
                fireHeld = false;
                hasFiredThisClick = false;
            }
        }

        const l2 = gp.buttons[6] ? gp.buttons[6].pressed : false;
        if (l2 && !gpLBPrev) {
            swapWeapon((curWeapon + 2) % 3);
        }
        gpLBPrev = l2;

        const r2 = gp.buttons[7] ? gp.buttons[7].pressed : false;
        if (r2 && !gpRBPrev) {
            swapWeapon((curWeapon + 1) % 3);
        }
        gpRBPrev = r2;
    }

        if (e.key === '1') swapWeapon(0);
        if (e.key === '2') swapWeapon(1);
        if (e.key === '3') swapWeapon(2);
        if (e.key === 'q' || e.key === 'Q') {
            swapWeapon((curWeapon + 1) % CONFIG.weapons.length);
        }
    });
    document.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
        if (e.key === 'Shift') isSprinting = false;
    });

    document.querySelectorAll('.weapon-slot').forEach(el => {
        el.addEventListener('click', () => {
            if (state !== 'playing') return;
            swapWeapon(parseInt(el.dataset.weapon));
        });
        el.addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation();
            if (state !== 'playing') return;
            swapWeapon(parseInt(el.dataset.weapon));
        });
    });

    // ═══════════════════════════════════════
    // MOBILE MOVE JOYSTICK
    // ═══════════════════════════════════════
    const joyZone = document.getElementById('move-joystick-zone');
    const joyBase = document.getElementById('move-joystick-base');
    const joyThumb = document.getElementById('move-joystick-thumb');

    joyZone.addEventListener('touchstart', e => {
        e.preventDefault();
        e.stopPropagation();
        if (moveJoyTouchId !== null) return;
        const t = e.changedTouches[0];
        moveJoyTouchId = t.identifier;
        moveJoyOriginX = t.clientX;
        moveJoyOriginY = t.clientY;
        moveJoyDeltaX = 0;
        moveJoyDeltaY = 0;

        joyBase.style.display = 'block';
        joyBase.style.left = (t.clientX - 55) + 'px';
        joyBase.style.top = (t.clientY - 55) + 'px';
        joyThumb.style.transform = 'translate(-50%, -50%)';
    }, { passive: false });

    joyZone.addEventListener('touchmove', e => {
        e.preventDefault();
        e.stopPropagation();
        for (const t of e.changedTouches) {
            if (t.identifier !== moveJoyTouchId) continue;
            let dx = t.clientX - moveJoyOriginX;
            let dy = t.clientY - moveJoyOriginY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > JOYSTICK_MAX_DIST) {
                dx = (dx / dist) * JOYSTICK_MAX_DIST;
                dy = (dy / dist) * JOYSTICK_MAX_DIST;
            }

            moveJoyDeltaX = dx / JOYSTICK_MAX_DIST;
            moveJoyDeltaY = -(dy / JOYSTICK_MAX_DIST);

            joyThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        }
    }, { passive: false });

    joyZone.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === moveJoyTouchId) {
                moveJoyTouchId = null;
                moveJoyDeltaX = 0;
                moveJoyDeltaY = 0;
                joyBase.style.display = 'none';
                joyThumb.style.transform = 'translate(-50%, -50%)';
            }
        }
    }, { passive: true });

    joyZone.addEventListener('touchcancel', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === moveJoyTouchId) {
                moveJoyTouchId = null;
                moveJoyDeltaX = 0;
                moveJoyDeltaY = 0;
                joyBase.style.display = 'none';
                joyThumb.style.transform = 'translate(-50%, -50%)';
            }
        }
    }, { passive: true });

    // ═══════════════════════════════════════
    // GAME LOOP
    // ═══════════════════════════════════════
    function gameLoop() {
        requestAnimationFrame(gameLoop);

        const dt = Math.min(clock.getDelta(), 0.1);

        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        if (state === 'playing') {
            updateGamepad(dt);
            updateMovement(dt);

            if (fireHeld && CONFIG.weapons[curWeapon].auto) shoot();

            updateEnemies(dt);
            updatePowerups(dt);
            updateDamageNumbers(dt);
            updateWeaponSystem(dt);
            updateCasings(dt);
            updateShockwaves(dt);
            updateThreatIndicators();
            updateScreenShake(dt);
            checkWaveComplete();

            if (betweenWaves) {
                waveTimer -= dt;
                if (waveTimer <= 0) startWave();
            }
        }

        renderer.render(scene, camera);
    }
    gameLoop();

    // ═══════════════════════════════════════
    // RESIZE
    // ═══════════════════════════════════════
    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    </script>
</body>
</html>
