    window.addEventListener('gamepaddisconnected', e => {
        if (gamepadIndex === e.gamepad.index) gamepadIndex = null;
        gpFireHeld = false;
        isADS = false;
        console.log('Gamepad disconnected');
    });

    function getGamepad() {
        if (gamepadIndex === null) return null;
        const gamepads = navigator.getGamepads();
        return gamepads[gamepadIndex] || null;
    }

    const _aaDir = new THREE.Vector3();
    const _aaToTarget = new THREE.Vector3();
    const _aaInvQuat = new THREE.Quaternion();

    function getAimAssistTarget() {
        if (gamepadIndex === null) return null;
        let best = null;
        let bestAngle = 0.5;
        _aaDir.set(0, 0, -1).applyEuler(camera.rotation);

        for (const e of activeEnemies) {
            if (e.dead) continue;
            _aaToTarget.set(
                e.group.position.x - camera.position.x,
                (e.group.position.y + 1.3) - camera.position.y,
                e.group.position.z - camera.position.z
            );
            const dist = _aaToTarget.length();
            if (dist > 50 || dist < 1) continue;
            _aaToTarget.normalize();
            const angle = _aaDir.angleTo(_aaToTarget);
            if (angle < bestAngle) {
                bestAngle = angle;
                _aaInvQuat.copy(camera.quaternion).invert();
                const local = _aaToTarget.clone().applyQuaternion(_aaInvQuat);
                best = {
                    yawOffset: Math.atan2(local.x, -local.z),
                    pitchOffset: Math.atan2(local.y, -local.z),
                    angle,
                    dist
                };
            }
        }
        return best;
    }

    function updateGamepad(dt) {
        const gp = getGamepad();
        if (!gp) return;

        const dead = 0.15;
        let rx = gp.axes[2] || 0;
        let ry = gp.axes[3] || 0;
        if (Math.abs(rx) < dead) rx = 0;
        if (Math.abs(ry) < dead) ry = 0;

        const aaTarget = getAimAssistTarget();
        let aimSens = 1.0;

        if (aaTarget) {
            const frictionBase = isADS ? 0.2 : 0.4;
            aimSens = frictionBase + (1 - frictionBase) * (aaTarget.angle / 0.35);
            const stickMag = Math.sqrt(rx * rx + ry * ry);
            if (stickMag > 0.05) {
                const pullBase = isADS ? 4.0 : 2.5;
                const pullStr = pullBase * (1 - aaTarget.angle / 0.35);
                yaw -= aaTarget.yawOffset * pullStr * dt;
                pitch -= aaTarget.pitchOffset * pullStr * 0.3 * dt;
            }
        }

        const adsTurnMult = isADS ? 0.6 : 1.0;
        yaw -= rx * 3.0 * aimSens * adsTurnMult * dt;
        pitch -= ry * 2.0 * aimSens * adsTurnMult * dt;
        pitch = Math.max(-1.2, Math.min(1.2, pitch));

        isADS = gp.buttons[4] ? gp.buttons[4].pressed : false;
        if (isADS) isSprinting = false;

        const r1 = gp.buttons[5] ? gp.buttons[5].pressed : false;
        if (r1) {
            if (!gpFireHeld) {
                gpFireHeld = true;
                fireHeld = true;
                hasFiredThisClick = false;
                shoot();
            }
        } else {
            if (gpFireHeld) {
                gpFireHeld = false;
                fireHeld = false;
                hasFiredThisClick = false;
            }
        }

        const maxWpn = document.getElementById('raygun-slot').style.display !== 'none' ? 4 : 3;

        const l2 = gp.buttons[6] ? gp.buttons[6].pressed : false;
        if (l2 && !gpLBPrev) swapWeapon((curWeapon + maxWpn - 1) % maxWpn);
        gpLBPrev = l2;

        const r2 = gp.buttons[7] ? gp.buttons[7].pressed : false;
        if (r2 && !gpRBPrev) swapWeapon((curWeapon + 1) % maxWpn);
        gpRBPrev = r2;

        if (gp.buttons[2] && gp.buttons[2].pressed) startReload();
    }
        // ═══════════════════════════════════════
    // MENU
    // ═══════════════════════════════════════
    function showMainMenu() {
        state = 'menu';
        fireHeld = false;
        fireTouchId = null;
        pendingFire = false;
        hasFiredThisClick = false;
        activeBoss = null;
        gpFireHeld = false;
        isMoving = false;
        moveJoyDeltaX = 0;
        moveJoyDeltaY = 0;
        isADS = false;
        stopHeartbeat();
        stopBackgroundMusic();
        stopBossMusic();
        isSprinting = false;
        adsAmount = 0;
        isReloading = false;
        reloadTimer = 0;
        isPaused = false;
        document.getElementById('reload-indicator').style.display = 'none';
        document.getElementById('speed-timer').style.display = 'none';

        playerPos.set(0, 0, 0);

        for (const e of activeEnemies) {
            scene.remove(e.group);
            if (e.healthBar) scene.remove(e.healthBar.sprite);
        }
        activeEnemies.length = 0;
        for (const p of activePowerups) scene.remove(p.group);
        activePowerups.length = 0;
        for (const dn of activeDamageNumbers) {
            scene.remove(dn.sprite);
            dn.sprite.material.map.dispose();
            dn.sprite.material.dispose();
        }
        activeDamageNumbers.length = 0;
        for (const c of activeCasings) scene.remove(c.mesh);
        activeCasings.length = 0;
        for (const sw of activeShockwaves) {
            scene.remove(sw.mesh);
            sw.mesh.geometry.dispose();
            sw.mesh.material.dispose();
        }
        activeShockwaves.length = 0;

        document.getElementById('boss-bar').style.display = 'none';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('blocker').style.display = 'flex';
        document.getElementById('login-fields').style.display = 'flex';
        document.getElementById('start-text').textContent = 'TAP TO START';
        document.getElementById('loading-bar').style.display = 'none';
        document.getElementById('move-joystick-zone').style.display = 'none';

        if (document.pointerLockElement) document.exitPointerLock();
        fetchLeaderboard();
    }

    // ═══════════════════════════════════════
    // START / GAME OVER
    // ═══════════════════════════════════════
    async function startGame() {
        const csVal = callsignInput.value.trim();
        const emVal = emailInput.value.trim();

        if (!csVal || csVal.length < 2) {
            document.getElementById('login-status').textContent = 'ENTER A CALLSIGN (2+ CHARS)';
            return;
        }

        const ok = await registerPlayer(csVal, emVal || null);
        if (!ok) return;
        initAudio();
        startBackgroundMusic();

        state = 'playing';
        score = 0; kills = 0; wave = 0;
        hp = CONFIG.player.health;
        curWeapon = 0;

        clipAmmo    = [12, 6, 30, 5];
        reserveAmmo = [Infinity, 20, 60, 0];
        isReloading = false;
        reloadTimer = 0;
        pauseCharges = 1;
        isPaused = false;
        document.getElementById('reload-indicator').style.display = 'none';
        document.getElementById('speed-timer').style.display = 'none';

        pitch = 0; yaw = 0;
        fireHeld = false;
        fireTouchId = null;
        pendingFire = false;
        hasFiredThisClick = false;
        activeBoss = null;
        screenShake = 0;
        speedBoostTimer = 0;
        gpFireHeld = false;
        isMoving = false;
        moveJoyDeltaX = 0;
        moveJoyDeltaY = 0;
        isADS = false;
        isSprinting = false;
        adsAmount = 0;

        playerPos.set(0, 0, 0);

        for (const e of activeEnemies) {
            scene.remove(e.group);
            if (e.healthBar) scene.remove(e.healthBar.sprite);
        }
        activeEnemies.length = 0;

        for (const p of activePowerups) scene.remove(p.group);
        activePowerups.length = 0;

        for (const dn of activeDamageNumbers) {
            scene.remove(dn.sprite);
            dn.sprite.material.map.dispose();
            dn.sprite.material.dispose();
        }
        activeDamageNumbers.length = 0;

        for (const c of activeCasings) scene.remove(c.mesh);
        activeCasings.length = 0;

        for (const sw of activeShockwaves) {
            scene.remove(sw.mesh);
            sw.mesh.geometry.dispose();
            sw.mesh.material.dispose();
        }
        activeShockwaves.length = 0;

        document.getElementById('boss-bar').style.display = 'none';
        document.getElementById('raygun-slot').style.display = 'none';

        wpnLerp = 0;
        wpnState = 'rest';
        recoilKick = 0;
        lastFiredAt = 0;
        pendingSwap = -1;
        equipWeapon(0);

        document.getElementById('blocker').style.display = 'none';
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('hud').style.display = 'block';

        if (isMobile) {
            document.getElementById('move-joystick-zone').style.display = 'block';
        }

        updateHUD();
        updateHealthHUD();
        updateWeaponHUD();

        if (!isMobile) {
            renderer.domElement.requestPointerLock();
        }

        startWave();
    }

    function gameOver() {
        state = 'gameover';
        fireHeld = false;
        fireTouchId = null;
        pendingFire = false;
        hasFiredThisClick = false;
        activeBoss = null;
        gpFireHeld = false;
        isMoving = false;
        isADS = false;
        stopHeartbeat();
        playDeathSting();
        stopBackgroundMusic();
        stopBossMusic();
        isSprinting = false;
        adsAmount = 0;
        isReloading = false;
        reloadTimer = 0;
        isPaused = false;
        document.getElementById('reload-indicator').style.display = 'none';
        document.getElementById('speed-timer').style.display = 'none';
        document.getElementById('boss-bar').style.display = 'none';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('move-joystick-zone').style.display = 'none';
        document.getElementById('final-stats').innerHTML =
            `WAVE ${wave}<br>SCORE: ${score}<br>KILLS: ${kills}`;

        if (document.pointerLockElement) document.exitPointerLock();
        submitScore(score, wave, kills);
    }

    // ═══════════════════════════════════════
    // INPUT EVENTS
    // ═══════════════════════════════════════
    document.getElementById('blocker').addEventListener('click', () => {
        if (state === 'menu') startGame();
    });
    document.getElementById('blocker').addEventListener('touchend', e => {
        e.preventDefault();
        if (state === 'menu') startGame();
    });

    document.getElementById('btn-redeploy').addEventListener('click', e => {
        e.stopPropagation();
        if (state === 'gameover') startGame();
    });
    document.getElementById('btn-redeploy').addEventListener('touchend', e => {
        e.preventDefault();
        e.stopPropagation();
        if (state === 'gameover') startGame();
    });

    document.getElementById('btn-main-menu').addEventListener('click', e => {
        e.stopPropagation();
        if (state === 'gameover') showMainMenu();
    });
    document.getElementById('btn-main-menu').addEventListener('touchend', e => {
        e.preventDefault();
        e.stopPropagation();
        if (state === 'gameover') showMainMenu();
    });

    document.getElementById('back-to-deadzone').addEventListener('click', e => { e.stopPropagation(); });
    document.getElementById('back-to-deadzone').addEventListener('touchend', e => { e.stopPropagation(); });

    renderer.domElement.addEventListener('mousedown', e => {
        if (e.button === 0) {
            fireHeld = true;
            hasFiredThisClick = false;
            shoot();
        }
    });
    renderer.domElement.addEventListener('mouseup', e => {
        if (e.button === 0) {
            fireHeld = false;
            hasFiredThisClick = false;
        }
    });

    renderer.domElement.addEventListener('mousedown', e => {
        if (e.button === 2 && state === 'playing') {
            isADS = true;
            isSprinting = false;
        }
    });
    renderer.domElement.addEventListener('mouseup', e => {
        if (e.button === 2) isADS = false;
    });
    renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

    renderer.domElement.addEventListener('touchstart', e => {
        if (state !== 'playing') return;
        for (const t of e.changedTouches) {
            if (t.identifier !== aimTouchId) {
                fireTouchId = t.identifier;
                fireHeld = true;
                hasFiredThisClick = false;
                shoot();
            }
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === fireTouchId) {
                fireHeld = false;
                fireTouchId = null;
                hasFiredThisClick = false;
            }
        }
    }, { passive: true });

    document.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;

        if (e.key === 'Shift') {
            if (!isADS) isSprinting = true;
        }

        if (state !== 'playing') return;
        if (e.key === '1') swapWeapon(0);
        if (e.key === '2') swapWeapon(1);
        if (e.key === '3') swapWeapon(2);
        if (e.key === '4') {
            if (document.getElementById('raygun-slot').style.display !== 'none') {
                swapWeapon(3);
            }
        }
        if (e.key === 'q' || e.key === 'Q') {
            let next = (curWeapon + 1) % CONFIG.weapons.length;
            if (next === 3 && document.getElementById('raygun-slot').style.display === 'none') {
                next = 0;
            }
            swapWeapon(next);
        }
        if (e.key === 'r' || e.key === 'R') startReload();

        if (e.key === 'p' || e.key === 'P') activatePause();
    });

    document.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
        if (e.key === 'Shift') isSprinting = false;
    });

    document.querySelectorAll('.weapon-slot').forEach(el => {
        el.addEventListener('click', () => {
            if (state !== 'playing') return;
            swapWeapon(parseInt(el.dataset.weapon));
        });
        el.addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation();
            if (state !== 'playing') return;
            swapWeapon(parseInt(el.dataset.weapon));
        });
    });

    // ═══════════════════════════════════════
    // MOBILE JOYSTICK
    // ═══════════════════════════════════════
    const joyZone = document.getElementById('move-joystick-zone');
    const joyBase = document.getElementById('move-joystick-base');
    const joyThumb = document.getElementById('move-joystick-thumb');

    joyZone.addEventListener('touchstart', e => {
        e.preventDefault();
        e.stopPropagation();
        if (moveJoyTouchId !== null) return;
        const t = e.changedTouches[0];
        moveJoyTouchId = t.identifier;
        moveJoyOriginX = t.clientX;
        moveJoyOriginY = t.clientY;
        moveJoyDeltaX = 0;
        moveJoyDeltaY = 0;

        joyBase.style.display = 'block';
        joyBase.style.left = (t.clientX - 55) + 'px';
        joyBase.style.top = (t.clientY - 55) + 'px';
        joyThumb.style.transform = 'translate(-50%, -50%)';
    }, { passive: false });

    joyZone.addEventListener('touchmove', e => {
        e.preventDefault();
        e.stopPropagation();
        for (const t of e.changedTouches) {
            if (t.identifier !== moveJoyTouchId) continue;
            let dx = t.clientX - moveJoyOriginX;
            let dy = t.clientY - moveJoyOriginY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > JOYSTICK_MAX_DIST) {
                dx = (dx / dist) * JOYSTICK_MAX_DIST;
                dy = (dy / dist) * JOYSTICK_MAX_DIST;
            }

            moveJoyDeltaX = dx / JOYSTICK_MAX_DIST;
            moveJoyDeltaY = -(dy / JOYSTICK_MAX_DIST);

            joyThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        }
    }, { passive: false });

    joyZone.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === moveJoyTouchId) {
                moveJoyTouchId = null;
                moveJoyDeltaX = 0;
                moveJoyDeltaY = 0;
                joyBase.style.display = 'none';
                joyThumb.style.transform = 'translate(-50%, -50%)';
            }
        }
    }, { passive: true });

    joyZone.addEventListener('touchcancel', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === moveJoyTouchId) {
                moveJoyTouchId = null;
                moveJoyDeltaX = 0;
                moveJoyDeltaY = 0;
                joyBase.style.display = 'none';
                joyThumb.style.transform = 'translate(-50%, -50%)';
            }
        }
    }, { passive: true });

    // ═══════════════════════════════════════
    // GAME LOOP
    // ═══════════════════════════════════════
    function gameLoop() {
        requestAnimationFrame(gameLoop);

        const dt = Math.min(clock.getDelta(), 0.1);

        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        if (state === 'playing') {
            updateGamepad(dt);
            updateMovement(dt);

            if (fireHeld && CONFIG.weapons[curWeapon].auto && !isReloading && !isPaused) shoot();

            updatePause(dt);

            if (!isPaused) {
                updateEnemies(dt);
                updatePowerups(dt);
                updateDamageNumbers(dt);
                updateWeaponSystem(dt);
                updateCasings(dt);
                updateShockwaves(dt);
                updateThreatIndicators();
                updateScreenShake(dt);
                checkWaveComplete();

                if (betweenWaves) {
                    waveTimer -= dt;
                    if (waveTimer <= 0) startWave();
                }
            }
        }

        renderer.render(scene, camera);
    }
    gameLoop();

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
    </script>
