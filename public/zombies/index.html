<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEADZONE — Zombies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }

        #blocker {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #blocker h1 {
            font-size: 4rem; color: #39FF14;
            text-transform: uppercase; letter-spacing: 12px;
            text-shadow: 0 0 40px rgba(57,255,20,0.5);
            margin-bottom: 10px;
        }
        #blocker .mode {
            font-size: 1.4rem; color: #ff4444;
            letter-spacing: 6px; text-transform: uppercase;
            margin-bottom: 20px;
        }

        #login-fields {
            display: flex; flex-direction: column; align-items: center;
            gap: 10px; margin-bottom: 20px; width: 280px;
        }
        #login-fields input {
            width: 100%; padding: 10px 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid #333; border-radius: 4px;
            color: #39FF14; font-family: 'Courier New', monospace;
            font-size: 0.85rem; letter-spacing: 2px;
            outline: none; text-align: center;
        }
        #login-fields input::placeholder {
            color: #555; letter-spacing: 2px;
        }
        #login-fields input:focus {
            border-color: #39FF14;
            background: rgba(57,255,20,0.05);
        }
        #login-status {
            color: #666; font-size: 0.7rem; letter-spacing: 2px;
            min-height: 16px; text-align: center;
        }

        #menu-leaderboard {
            width: 300px; max-height: 240px; margin-bottom: 20px;
            overflow-y: auto;
        }
        #menu-leaderboard h3 {
            color: #ff4444; font-size: 0.75rem;
            letter-spacing: 4px; text-transform: uppercase;
            text-align: center; margin-bottom: 8px;
        }
        .lb-row {
            display: flex; justify-content: space-between;
            padding: 4px 8px; font-size: 0.7rem;
            letter-spacing: 1px; border-bottom: 1px solid #1a1a1a;
        }
        .lb-row .lb-rank { color: #555; width: 30px; }
        .lb-row .lb-name { color: #39FF14; flex: 1; }
        .lb-row .lb-score { color: #888; }
        .lb-row .lb-wave { color: #39FF14; font-size: 0.65rem; width: 50px; text-align: center; }
        .lb-row.lb-you .lb-name { color: #ffdd00; }
        #menu-leaderboard::-webkit-scrollbar { width: 4px; }
        #menu-leaderboard::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        #blocker .start-text {
            font-size: 1rem; color: #888;
            letter-spacing: 4px; text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }
        #loading-bar {
            width: 200px; height: 4px; background: #222;
            border-radius: 2px; margin-top: 20px; overflow: hidden;
        }
        #loading-fill {
            width: 0%; height: 100%; background: #39FF14;
            transition: width 0.3s;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
            font-family: 'Courier New', monospace;
            display: none;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #ch-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(0,150,255,1);
    box-shadow: 0 0 4px rgba(0,150,255,0.4), 0 0 8px rgba(0,150,255,0.2);
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        #ch-cross-h, #ch-cross-v { position: absolute; background: rgba(255,255,255,0.85); display: none; }
        #ch-cross-h { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
        #ch-cross-v { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
        #ch-ring {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.6);
            display: none;
        }
        /* Horseshoe for rifle */
        #ch-horseshoe {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        #ch-horseshoe svg { display: block; }

        .hud-top {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 20px; color: #39FF14; font-size: 0.85rem;
            letter-spacing: 2px;
        }
        #health-bar-bg {
            position: absolute; bottom: 60px; left: 20px;
            width: 200px; height: 8px; background: #333;
            border-radius: 4px; overflow: hidden;
        }
        #health-bar {
            width: 100%; height: 100%; background: #39FF14;
            transition: width 0.3s;
        }
        #health-label {
            position: absolute; bottom: 72px; left: 20px;
            color: #39FF14; font-size: 0.7rem; letter-spacing: 2px;
        }
        #ammo-display {
            position: absolute; bottom: 60px; left: 240px;
            color: #39FF14; font-size: 1.4rem;
        }
        /* Removed #ammo-label to clean up the HUD */

        #reload-indicator {
            position: absolute; bottom: 44px; left: 240px;
            color: #ffaa00; font-size: 0.6rem; letter-spacing: 3px;
            display: none;
            animation: pulse 0.5s ease-in-out infinite;
        }

        #speed-timer {
            position: absolute; bottom: 100px; left: 50%;
            transform: translateX(-50%);
            color: #4488ff; font-size: 0.9rem;
            letter-spacing: 3px; text-transform: uppercase;
            text-shadow: 0 0 12px rgba(68,136,255,0.6);
            display: none;
        }

        /* ── WEAPON BAR: bold + slightly bigger text, no slot numbers ── */
        #weapon-bar {
            position: absolute; bottom: 15px; right: 20px;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: auto;
        }
        .weapon-slot {
            padding: 6px 14px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #333;
            border-radius: 4px;
            color: #666;
            font-size: 0.72rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            text-align: right;
            transition: all 0.15s;
        }
        .weapon-slot[data-weapon="0"] { --glow: rgba(0,150,255,0.5); --border: #0096ff; --text: #0096ff; }
        .weapon-slot[data-weapon="1"] { --glow: rgba(255,100,0,0.5); --border: #ff6400; --text: #ff6400; }
        .weapon-slot[data-weapon="2"] { --glow: rgba(50,255,50,0.5); --border: #32ff32; --text: #32ff32; }
        .weapon-slot[data-weapon="3"] { --glow: rgba(160,80,255,0.5); --border: #a050ff; --text: #a050ff; }
        .weapon-slot.active {
            border-color: var(--border);
            color: var(--text);
            background: var(--glow);
            box-shadow: 0 0 10px var(--glow), inset 0 0 8px rgba(255,255,255,0.05);
        }

        #wave-announce {
            position: fixed; top: 20%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 3rem; color: #ff4444;
            letter-spacing: 8px; text-transform: uppercase;
            text-shadow: 0 0 40px rgba(255,68,68,0.5);
            z-index: 60; display: none; pointer-events: none;
        }

        #boss-bar {
            position: absolute; top: 45px; left: 50%;
            transform: translateX(-50%); width: 300px;
            display: none; pointer-events: none;
        }
        #boss-name {
            color: #ff4444; font-size: 0.7rem; text-align: center;
            letter-spacing: 3px; margin-bottom: 4px;
        }
        #boss-bar-bg {
            width: 100%; height: 8px; background: #333;
            border-radius: 4px; overflow: hidden;
        }
        #boss-health-fill {
            width: 100%; height: 100%; background: #ff4444;
            transition: width 0.3s;
        }

        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100;
            font-family: 'Courier New', monospace;
        }
        #game-over h1 {
            font-size: 3rem; color: #ff4444;
            letter-spacing: 8px; margin-bottom: 20px;
        }
        #game-over .stats {
            color: #888; font-size: 1rem;
            letter-spacing: 3px; margin-bottom: 30px;
            text-align: center; line-height: 2;
        }
        #game-over-buttons {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
        }
        .go-btn {
            padding: 12px 32px; border: 1px solid #39FF14;
            background: rgba(57,255,20,0.08); border-radius: 4px;
            color: #39FF14; font-family: 'Courier New', monospace;
            font-size: 0.9rem; letter-spacing: 4px; text-transform: uppercase;
            cursor: pointer; transition: background 0.2s;
        }
        .go-btn:hover { background: rgba(57,255,20,0.15); }
        .go-btn.secondary {
            border-color: #555; color: #888;
            background: rgba(255,255,255,0.03);
        }
        .go-btn.secondary:hover { background: rgba(255,255,255,0.08); }

        .threat-edge {
            position: absolute; background: #ff4444; opacity: 0;
            transition: opacity 0.1s; pointer-events: none;
            box-shadow: 0 0 20px rgba(255,68,68,0.7);
            border-radius: 2px;
        }
        #threat-left   { top: 25%; left: 0; width: 3px; height: 50%; }
        #threat-right  { top: 25%; right: 0; width: 3px; height: 50%; }
        #threat-top    { top: 0; left: 25%; width: 50%; height: 3px; }
        #threat-bottom { bottom: 70px; left: 25%; width: 50%; height: 3px; }

        #move-joystick-zone {
            position: fixed;
            bottom: 0; left: 0;
            width: 45%; height: 55%;
            z-index: 55;
            pointer-events: auto;
            display: none;
        }
        #move-joystick-base {
            position: absolute;
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 2px solid rgba(57, 255, 20, 0.25);
            background: rgba(57, 255, 20, 0.04);
            display: none;
            pointer-events: none;
        }
        #move-joystick-thumb {
            position: absolute;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(57, 255, 20, 0.35);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            #blocker h1 { font-size: 2.5rem; letter-spacing: 8px; }
            #blocker .mode { font-size: 1rem; }
            #login-fields { width: 240px; }
            #menu-leaderboard { width: 260px; }
            #health-bar-bg { width: 120px; }
            #ammo-display { left: 160px; }
            #reload-indicator { left: 160px; }
            #wave-announce { font-size: 3rem; }
            #boss-bar { width: 200px; }
        }
    </style>
</head>
<body>
    <div id="blocker">
        <h1>DEADZONE</h1>
        <div class="mode">Zombies</div>
        <a href="/" id="back-to-deadzone" style="color:#FF4444; font-size:0.7rem; text-decoration:none; letter-spacing:3px; text-transform:uppercase; margin-top:5px; margin-bottom:10px;">← ALL ARENAS</a>
        <div id="login-fields" style="display:none;">
            <input type="text" id="callsign-input" placeholder="CALLSIGN" maxlength="20" autocomplete="off" />
            <input type="email" id="email-input" placeholder="EMAIL (SYNC ACROSS DEVICES)" autocomplete="email" />
            <div id="login-status"></div>
        </div>
        <div id="menu-leaderboard" style="display:none;">
            <h3>⚡ TOP SCORES ⚡</h3>
            <div id="lb-rows"></div>
        </div>
        <div class="start-text" id="start-text">Loading...</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>

    <div id="hud">
        <div id="crosshair">
            <div id="ch-dot"></div>
            <div id="ch-cross-h"></div>
            <div id="ch-cross-v"></div>
            <div id="ch-ring"></div>
            <div id="ch-horseshoe">
                <svg width="32" height="32" viewBox="0 0 32 32">
                    <!-- Horseshoe: open arc at bottom -->
                    <path d="M 4 18 A 12 12 0 1 1 28 18" fill="none" stroke="#ff8800" stroke-width="2" stroke-linecap="round"/>
                    <!-- Red dot in center -->
                    <circle cx="16" cy="16" r="2.5" fill="#ff2222"/>
                </svg>
            </div>
        </div>
        <div class="hud-top">
            <div id="wave-display">WAVE 1</div>
            <div id="score-display">0</div>
            <div id="kills-display">KILLS: 0</div>
        </div>
        <div id="boss-bar">
            <div id="boss-name">TITAN</div>
            <div id="boss-bar-bg"><div id="boss-health-fill"></div></div>
        </div>
        <div id="health-label">HEALTH</div>
        <div id="health-bar-bg"><div id="health-bar"></div></div>
        <div id="ammo-display">∞</div>
        <div id="reload-indicator">RELOADING</div>
        <div id="speed-timer"></div>
        <div id="weapon-bar">
            <div class="weapon-slot active" data-weapon="0">PISTOL</div>
            <div class="weapon-slot" data-weapon="1">SHOTGUN</div>
            <div class="weapon-slot" data-weapon="2">RIFLE</div>
            <div class="weapon-slot" data-weapon="3" id="raygun-slot" style="display:none;">PARTICLE GUN</div>
        </div>
        <div class="threat-edge" id="threat-left"></div>
        <div class="threat-edge" id="threat-right"></div>
        <div class="threat-edge" id="threat-top"></div>
        <div class="threat-edge" id="threat-bottom"></div>
    </div>

    <div id="move-joystick-zone">
        <div id="move-joystick-base">
            <div id="move-joystick-thumb"></div>
        </div>
    </div>

    <div id="wave-announce"></div>

    <div id="game-over">
        <h1>DEAD</h1>
        <div class="stats" id="final-stats"></div>
        <div id="game-over-buttons">
            <div class="go-btn" id="btn-redeploy">REDEPLOY</div>
            <div class="go-btn secondary" id="btn-main-menu">MAIN MENU</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

    // ═══════════════════════════════════════
    // CALLSIGN / EMAIL / LEADERBOARD API
    // ═══════════════════════════════════════
    let playerCallsign = localStorage.getItem('dz_callsign') || '';
    let playerEmail = localStorage.getItem('dz_email') || '';

    async function fetchLeaderboard() {
        try {
            const r = await fetch('/api/leaderboard');
            const rows = await r.json();
            const container = document.getElementById('lb-rows');
            container.innerHTML = '';
            rows.forEach((row, i) => {
                const isYou = row.callsign === playerCallsign;
                const div = document.createElement('div');
                div.className = 'lb-row' + (isYou ? ' lb-you' : '');
                div.innerHTML = `<span class="lb-rank">${i + 1}.</span><span class="lb-name">${row.callsign}</span><span class="lb-wave">R${row.wave || 0}</span><span class="lb-score">${row.score}</span>`;
                container.appendChild(div);
            });
            document.getElementById('menu-leaderboard').style.display = 'block';
        } catch (e) { console.warn('Leaderboard fetch failed:', e); }
    }

    async function registerPlayer(callsign, email) {
        try {
            const body = { callsign };
            if (email) body.email = email;
            const r = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await r.json();
            if (data.error) {
                document.getElementById('login-status').textContent = data.error;
                return false;
            }
            localStorage.setItem('dz_callsign', callsign);
            if (email) localStorage.setItem('dz_email', email);
            playerCallsign = callsign;
            playerEmail = email || '';
            document.getElementById('login-status').textContent = data.linked ? 'LINKED ✓' : 'READY';
            return true;
        } catch (e) {
            document.getElementById('login-status').textContent = 'OFFLINE — PLAYING LOCAL';
            localStorage.setItem('dz_callsign', callsign);
            playerCallsign = callsign;
            return true;
        }
    }

    async function lookupCallsign(email) {
        try {
            const r = await fetch(`/api/callsign?email=${encodeURIComponent(email)}`);
            const data = await r.json();
            return data.callsign || null;
        } catch (e) { return null; }
    }

    async function submitScore(scoreVal, waveVal, killsVal) {
        if (!playerCallsign) return;
        try {
            await fetch('/api/score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ callsign: playerCallsign, score: scoreVal, wave: waveVal, kills: killsVal })
            });
        } catch (e) { console.warn('Score submit failed'); }
    }

    const callsignInput = document.getElementById('callsign-input');
    const emailInput = document.getElementById('email-input');
    callsignInput.value = playerCallsign;
    emailInput.value = playerEmail;

    if (playerEmail && !playerCallsign) {
        lookupCallsign(playerEmail).then(cs => {
            if (cs) {
                playerCallsign = cs;
                callsignInput.value = cs;
                localStorage.setItem('dz_callsign', cs);
                document.getElementById('login-status').textContent = 'CALLSIGN RECOVERED ✓';
            }
        });
    }

    callsignInput.addEventListener('click', e => e.stopPropagation());
    callsignInput.addEventListener('touchend', e => e.stopPropagation());
    emailInput.addEventListener('click', e => e.stopPropagation());
    emailInput.addEventListener('touchend', e => e.stopPropagation());

    // ═══════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════
    const CONFIG = {
        player: { height: 1.6, health: 100 },
        weapons: [
            { name: 'Pistol',        damage: 25,   rate: 0.3,  spread: 0,    pellets: 1, auto: false, clipSize: 12, reloadTime: 1.2 },
            { name: 'Shotgun',       damage: 15,   rate: 0.8,  spread: 0.08, pellets: 6, auto: false, clipSize: 6,  reloadTime: 2.0, falloffStart: 10, falloffEnd: 25 },
            { name: 'Rifle',          damage: 35,   rate: 0.12, spread: 0.02, pellets: 1, auto: true,  clipSize: 30, reloadTime: 1.8 },
            { name: 'Particle Gun',  damage: 9999, rate: 0.5,  spread: 0,    pellets: 1, auto: false, clipSize: 5,  reloadTime: 2.5, pierce: 3 },
        ],
        enemies: {
            shambler: { speed: 1.8, health: 100, damage: 10, points: 10,  scale: 1.2 },
            runner:   { speed: 3.2, health: 60,  damage: 8,  points: 25,  scale: 1.2 },
            brute:    { speed: 1.5, health: 180, damage: 25, points: 50,  scale: 1.5 },
            tank:     { speed: 1.75, health: 250, damage: 20, points: 40, scale: 1.4 },
            boss:     { speed: 1.5, health: 1000, damage: 30, points: 500, scale: 4.0 }
        },
        spawnRadius: 60,
        meleeRange: 2.0,
        despawnTime: 3,
        dropChance: 0.3
    };

    // ═══════════════════════════════════════
    // GAME STATE
    // ═══════════════════════════════════════
    let state = 'loading';
    let score = 0, kills = 0, wave = 0;
    let hp = CONFIG.player.health;
    let curWeapon = 0;
        

    let clipAmmo    = [12, 6, 30, 5];
    let reserveAmmo = [Infinity, 20, 60, 0];
    const maxClip   = [12, 6, 30, 5];
    const maxReserve = [Infinity, 40, 90, 25];
    let isReloading = false;
    let reloadTimer = 0;
    let reloadDuration = 0;

    let lastShotTime = 0;
    let waveEnemiesLeft = 0;
    let waveTimer = 0;
    let betweenWaves = false;
    let fireHeld = false;
    let fireTouchId = null;
    let pendingFire = false;
    let hasFiredThisClick = false;
    let activeBoss = null;
    let screenShake = 0;
    let speedBoostTimer = 0;

    let isSprinting = false;
    let isADS = false;
    let adsAmount = 0;
    const BASE_FOV = 70;
    const ADS_FOV = 45;
    const SPRINT_FOV = 78;
    const ADS_LERP_SPEED = 12;
    const SPRINT_MULT = 1.7;
    const ADS_MOVE_MULT = 0.5;
    const ADS_SPREAD_MULT = 0.35;

    const playerPos = new THREE.Vector3(0, 0, 0);
    const MOVE_SPEED = 5.0;
    const ARENA_BOUNDS = 39.0;
    const keys = {};
    let isMoving = false;

    let moveJoyTouchId = null;
    let moveJoyOriginX = 0, moveJoyOriginY = 0;
    let moveJoyDeltaX = 0, moveJoyDeltaY = 0;
    const JOYSTICK_MAX_DIST = 45;

    let gamepadIndex = null;
    let gpFireHeld = false;
    let gpLBPrev = false, gpRBPrev = false;

    const ANIM_REFERENCE_SPEED = 2.0;
    const _currentQuat = new THREE.Quaternion();
    const _targetQuat = new THREE.Quaternion();

    const activeEnemies = [];
    const activePowerups = [];
    const activeDamageNumbers = [];
    const activeShockwaves = [];
    const clock = new THREE.Clock();

    // ═══════════════════════════════════════
    // PAUSE SYSTEM — starts with 1 charge
    // ═══════════════════════════════════════
    let pauseCharges = 1; // ← START WITH 1
    let isPaused = false;
    let pauseTimer = 0;
    const PAUSE_CHARGE_INTERVAL = 20;
    const PAUSE_DURATION = 3;

    // ═══════════════════════════════════════
    // SFX AUDIO SYSTEM
    // ═══════════════════════════════════════
    const SFX_BASE = '';
    function playHitImpact() {}  // was 'https://CyberVoid.com/Public/Zombies/sfx/'
    
    const sfxFiles = {
        backgroundSound: 'background_sound.mp3',
        pistolShot: 'pistol_shot.mp3',
        rifleShot: 'rifle_shot.mp3',
        shotgunShot: 'shotgun_shot.mp3',
        particleShot: 'particle_shot.mp3',
        playerDeath: 'player_death.mp3',
        nextWave: 'next_wave.mp3',
        loadingIn: 'loading_in.mp3',

    // ─── Footsteps (keep procedural for now) ───
    let audioCtx = null;
    let lastStepTime = 0;
    let stepToggle = false;
    
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        loadAllAudio();
    }
    
    function playFootstep() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        stepToggle = !stepToggle;
        const basePitch = stepToggle ? 65 : 55;
        const pitch = basePitch + Math.random() * 15;
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(isSprinting ? 0.18 : 0.10, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.12);

        const bufSize = audioCtx.sampleRate * 0.04;
        const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuf;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(isSprinting ? 0.06 : 0.03, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 800;
        noise.connect(filter).connect(noiseGain).connect(audioCtx.destination);
        noise.start(now); noise.stop(now + 0.06);
    }
    
    // ─── Other procedural sounds (reload, dry fire, weapon swap) ───
    function playDryFire() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800 + Math.random() * 200, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.025);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; filter.frequency.value = 600;
        osc.connect(filter).connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.05);
    }
    
    function playWeaponDown() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const click = audioCtx.createOscillator();
        click.type = 'square';
        click.frequency.setValueAtTime(1200, now);
        click.frequency.exponentialRampToValueAtTime(400, now + 0.02);
        const clickGain = audioCtx.createGain();
        clickGain.gain.setValueAtTime(0.06, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        const clickFilter = audioCtx.createBiquadFilter();
        clickFilter.type = 'highpass'; clickFilter.frequency.value = 800;
        click.connect(clickFilter).connect(clickGain).connect(audioCtx.destination);
        click.start(now); click.stop(now + 0.04);
    }
    
    function playWeaponUp(weaponIndex) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const rack1 = audioCtx.createOscillator();
        rack1.type = 'sawtooth';
        rack1.frequency.setValueAtTime(600 + Math.random() * 100, now);
        rack1.frequency.exponentialRampToValueAtTime(250, now + 0.03);
        const rack1Gain = audioCtx.createGain();
        rack1Gain.gain.setValueAtTime(0.05, now);
        rack1Gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        rack1.connect(rack1Gain).connect(audioCtx.destination);
        rack1.start(now); rack1.stop(now + 0.05);

        const rack2 = audioCtx.createOscillator();
        rack2.type = 'square';
        const lockFreq = weaponIndex === 1 ? 500 : weaponIndex === 2 ? 900 : 700;
        rack2.frequency.setValueAtTime(lockFreq, now + 0.05);
        rack2.frequency.exponentialRampToValueAtTime(300, now + 0.07);
        const rack2Gain = audioCtx.createGain();
        rack2Gain.gain.setValueAtTime(0.07, now + 0.05);
        rack2Gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        rack2.connect(rack2Gain).connect(audioCtx.destination);
        rack2.start(now); rack2.stop(now + 0.09);
    }
    
    // ─── Heartbeat (low health) ───
    let heartbeatActive = false;
    let heartbeatInterval = null;
    
    function startHeartbeat() {
        if (heartbeatActive) return;
        heartbeatActive = true;
        function beat() {
            if (!audioCtx || !heartbeatActive) return;
            const now = audioCtx.currentTime;
            const hpPct = hp / CONFIG.player.health;
            const urgency = 1 - (hpPct / 0.3);
            const vol = 0.08 + urgency * 0.10;
            for (let i = 0; i < 2; i++) {
                const t = now + i * 0.12;
                const freq = i === 0 ? 45 : 35;
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, t);
                osc.frequency.exponentialRampToValueAtTime(20, t + 0.1);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(i === 0 ? vol : vol * 0.7, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.11);
            }
        }
        beat();
        heartbeatInterval = setInterval(() => {
            if (!heartbeatActive) return;
            const rate = hp / CONFIG.player.health < 0.15 ? 500 : 750;
            clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(beat, rate);
        }, 750);
    }
    
    function stopHeartbeat() {
        heartbeatActive = false;
        if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
    }

    function equipWeapon(index) {
        const name = WEAPON_NAMES[index];
        const model = weaponGLBs[name];
        if (!model) return;

        while (weaponHolder.children.length > 1) {
            const child = weaponHolder.children[0];
            if (child === mFlashSprite) {
                if (weaponHolder.children.length > 1)
                    weaponHolder.remove(weaponHolder.children[1]);
                else break;
            } else {
                weaponHolder.remove(child);
            }
        }

        const wpn = model.clone();
        const cfg = FP[name];
        wpn.scale.setScalar(cfg.scale);
        wpn.rotation.y = cfg.rotY;

        const box = new THREE.Box3().setFromObject(wpn);
        const center = box.getCenter(new THREE.Vector3());
        wpn.position.sub(center);

        weaponHolder.add(wpn);
        weaponHolder.position.copy(REST_POS);
        weaponHolder.rotation.set(REST_ROT_BASE.x, REST_ROT_BASE.y, REST_ROT_BASE.z);
    }

     function swapWeapon(newIndex) {

            reloadTimer = 0;

   function startReload() {
        if (isReloading) return;
        if (clipAmmo[curWeapon] >= maxClip[curWeapon]) return;
        if (reserveAmmo[curWeapon] <= 0 && reserveAmmo[curWeapon] !== Infinity) return;

        isReloading = true;
        reloadDuration = CONFIG.weapons[curWeapon].reloadTime;
        reloadTimer = reloadDuration;
        playReloadSound(curWeapon);
        document.getElementById('reload-indicator').style.display = 'block';
    }
    function updateReload(dt) {
        if (!isReloading) return;
        reloadTimer -= dt;
        if (reloadTimer <= 0) {
            isReloading = false;
            document.getElementById('reload-indicator').style.display = 'none';

            const needed = maxClip[curWeapon] - clipAmmo[curWeapon];
            if (reserveAmmo[curWeapon] === Infinity) {
                clipAmmo[curWeapon] = maxClip[curWeapon];
            } else {
                const take = Math.min(needed, reserveAmmo[curWeapon]);
                clipAmmo[curWeapon] += take;
                reserveAmmo[curWeapon] -= take;
            }
            updateAmmoHUD();
            updateWeaponHUD();
            playWeaponUp(curWeapon);
        }
    }

    function executeShot() {
        playGunshot(curWeapon);
        lastFiredAt = performance.now() / 1000;
        recoilKick = RECOIL_AMT;

        const mPos = MUZZLE_OFFSETS[curWeapon];
        mFlashSprite.position.set(mPos.x, mPos.y, mPos.z);
        mFlashSprite.visible = true;
        mFlashSprite.material.rotation = Math.random() * Math.PI * 2;
        mFlashSprite.material.color.set(curWeapon === 3 ? 0xaa44ff : 0xffffff);
        const FLASH_SIZES = [0.20, 0.32, 0.22, 0.28];
        const flashSize = FLASH_SIZES[curWeapon] + Math.random() * 0.08;
        mFlashSprite.scale.set(flashSize, flashSize, flashSize);
        mFlashVis = 0.06;

        spawnCasing();
    }

    function spawnCasing() {
        const yOff = CASING_Y_OFFSET[WEAPON_NAMES[curWeapon]];
        if (yOff === -999) return;

        const casing = new THREE.Mesh(casingGeo, casingMat);
        const worldPos = new THREE.Vector3();
        weaponHolder.getWorldPosition(worldPos);
        casing.position.copy(worldPos);
        casing.position.y += yOff;

        scene.add(casing);

        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const up = new THREE.Vector3(0, 1, 0);
        const vel = new THREE.Vector3();
        vel.addScaledVector(right, 1.5 + Math.random());
        vel.addScaledVector(up, 1.5 + Math.random() * 1.5);
        vel.z += (Math.random() - 0.5) * 0.3;

        activeCasings.push({
            mesh: casing, velocity: vel,
            spin: new THREE.Vector3(Math.random() * 12, Math.random() * 12, Math.random() * 12),
            age: 0
        });
    }

    function updateWeaponSystem(dt) {
        const SWAP_SPEED = 10;

        switch (wpnState) {
            case 'rest': break;
            case 'swapDown':
                wpnLerp = Math.max(-0.5, wpnLerp - SWAP_SPEED * dt);
                if (wpnLerp <= -0.5) {
                    curWeapon = pendingSwap;
                    pendingSwap = -1;
                    equipWeapon(curWeapon);
                    updateWeaponHUD();
                    wpnState = 'swapUp';
                    playWeaponUp(curWeapon);
                }
                break;
            case 'swapUp':
                wpnLerp = Math.min(0, wpnLerp + SWAP_SPEED * dt);
                if (wpnLerp >= 0) {
                    wpnLerp = 0;
                    wpnState = 'rest';
                }
                break;
        }

        if (mFlashVis > 0) {
            mFlashVis -= dt;
            if (mFlashVis <= 0) {
                mFlashVis = 0;
                mFlashSprite.visible = false;
            }
        }

        recoilKick = Math.max(0, recoilKick - RECOIL_RECOVER * dt);

        const adsTarget = isADS ? 1 : 0;
        adsAmount += (adsTarget - adsAmount) * Math.min(1, ADS_LERP_SPEED * dt);

        const baseFov = isSprinting ? SPRINT_FOV : BASE_FOV;
        const targetFOV = baseFov + (ADS_FOV - baseFov) * adsAmount;
        camera.fov += (targetFOV - camera.fov) * Math.min(1, 10 * dt);
        camera.updateProjectionMatrix();

        const bobMoveAmp = isMoving ? 0.004 : 0.001;
        const bobAmp = bobMoveAmp * (1 - adsAmount * 0.7);
        wpnBobTime += dt * (isMoving ? 3 : 1);
        const bobX = Math.sin(wpnBobTime * 1.5) * bobAmp;
        const bobY = Math.sin(wpnBobTime * 2.0) * bobAmp;

        const t = adsAmount;
        let px = REST_POS.x + (AIM_POS.x - REST_POS.x) * t + bobX;
        let py = REST_POS.y + (AIM_POS.y - REST_POS.y) * t + bobY + recoilKick * 0.5;
        let pz = REST_POS.z + (AIM_POS.z - REST_POS.z) * t + recoilKick;

        if (wpnState === 'swapDown' || wpnState === 'swapUp') {
            py += wpnLerp * 0.6;
        }

        weaponHolder.position.set(px, py, pz);

        const rx = REST_ROT_BASE.x + (AIM_ROT_BASE.x - REST_ROT_BASE.x) * t - recoilKick * 2;
        const ry = REST_ROT_BASE.y + (AIM_ROT_BASE.y - REST_ROT_BASE.y) * t;
        const rz = REST_ROT_BASE.z + (AIM_ROT_BASE.z - REST_ROT_BASE.z) * t;
        weaponHolder.rotation.set(rx, ry, rz);

        updateCrosshairADS(adsAmount);
        updateReload(dt);

        const speedEl = document.getElementById('speed-timer');
        if (speedBoostTimer > 0) {
            speedEl.style.display = 'block';
            speedEl.textContent = `⚡ SPEED ${speedBoostTimer.toFixed(1)}s`;
        } else {
            speedEl.style.display = 'none';
        }
    }

    function updateCasings(dt) {
        for (let i = activeCasings.length - 1; i >= 0; i--) {
            const c = activeCasings[i];
            c.age += dt;
            c.velocity.y -= 9.8 * dt;
            c.mesh.position.addScaledVector(c.velocity, dt);
            c.mesh.rotation.x += c.spin.x * dt;
            c.mesh.rotation.z += c.spin.z * dt;

            if (c.mesh.position.y < 0.02) {
                c.mesh.position.y = 0.02;
                c.velocity.y *= -0.3;
                c.velocity.x *= 0.5;
                c.velocity.z *= 0.5;
            }

            if (c.age >= 1.2) {
                scene.remove(c.mesh);
                activeCasings.splice(i, 1);
            }
        }
    }

            dn.age += dt;

            dn.sprite.material.opacity = 1 - (dn.age / dn.life);

                dn.sprite.material.dispose();
                activeDamageNumbers.splice(i, 1);
            }
        }
    }

    // SHOOTING
    // ═══════════════════════════════════════
    const raycaster = new THREE.Raycaster();
    raycaster.far = 80;

    function shoot() {
        if (state !== 'playing' || isPaused) return;
        if (isReloading) return;

        const now = performance.now() / 1000;
        const w = CONFIG.weapons[curWeapon];
        if (now - lastShotTime < w.rate) return;

        if (clipAmmo[curWeapon] <= 0) {
            if (reserveAmmo[curWeapon] > 0 || reserveAmmo[curWeapon] === Infinity) {
                startReload();
            } else {
                playDryFire();
            }
            return;
        }

        lastShotTime = now;
        clipAmmo[curWeapon]--;
        updateAmmoHUD();
        updateWeaponHUD();

        recoilKick = RECOIL_AMT;
        executeShot();

        const dir = new THREE.Vector3(0, 0, -1);
        dir.applyEuler(camera.rotation);

        for (let p = 0; p < w.pellets; p++) {
            const d = dir.clone();
            if (w.spread > 0) {
                const spreadMult = adsAmount > 0.5 ? ADS_SPREAD_MULT : 1.0;
                d.x += (Math.random() - 0.5) * w.spread * spreadMult;
                d.y += (Math.random() - 0.5) * w.spread * spreadMult;
                d.normalize();
            }
            raycaster.set(camera.position, d);

            const meshes = [];
            activeEnemies.forEach(e => {
                if (e.dead) return;
                e.group.traverse(c => { if (c.isMesh) meshes.push(c); });
            });

            const hits = raycaster.intersectObjects(meshes, false);
            if (hits.length > 0) {
                const maxPierce = w.pierce || 1;
                let pierced = 0;
                const hitEnemies = new Set();

                for (const hit of hits) {
                    if (pierced >= maxPierce) break;
                    const hitObj = hit.object;

                    for (const enemy of activeEnemies) {
                        if (enemy.dead || hitEnemies.has(enemy)) continue;
                        let found = false;
                        enemy.group.traverse(c => { if (c === hitObj) found = true; });
                        if (found) {
                            let effectiveDamage = w.damage;
                            if (w.falloffStart !== undefined && w.falloffEnd !== undefined) {
                                const hitDist = camera.position.distanceTo(hit.point);
                                if (hitDist > w.falloffStart) {
                                    const falloff = 1 - Math.min(1, (hitDist - w.falloffStart) / (w.falloffEnd - w.falloffStart));
                                    effectiveDamage = w.damage * Math.max(0.1, falloff);
                                }
                            }
                            damageEnemy(enemy, effectiveDamage, hit.point);
                            hitEnemies.add(enemy);
                            pierced++;
                            break;
                        }
                    }
                }
            }
        }

        if (clipAmmo[curWeapon] <= 0 && (reserveAmmo[curWeapon] > 0 || reserveAmmo[curWeapon] === Infinity)) {
            setTimeout(() => { if (state === 'playing' && !isReloading) startReload(); }, 300);
        }
    }

    function collectPowerup(pu, index) {
        playPickupChime(pu.type);

        const waveBonus = 1 + (wave - 1) * 0.05;

        switch (pu.type) {
            case 'health':
                hp = Math.min(hp + 25, CONFIG.player.health);
                updateHealthHUD();
                break;
            case 'pistol_ammo':
                score += Math.round(50 * waveBonus);
                updateHUD();
                break;
            case 'rifle_ammo':
                reserveAmmo[2] = Math.min(reserveAmmo[2] + Math.round(15 * waveBonus), maxReserve[2]);
                updateAmmoHUD();
                break;
            case 'shotgun_ammo':
                reserveAmmo[1] = Math.min(reserveAmmo[1] + Math.round(6 * waveBonus), maxReserve[1]);
                updateAmmoHUD();
                break;
            case 'nuke':
                for (const e of activeEnemies) {
                    if (!e.dead && e.type !== 'boss') {
                        killEnemy(e);
                    }
                }
                screenShake = 0.4;
                spawnShockwave(camera.position.clone());
                break;
            case 'speed':
                speedBoostTimer = 8;
                break;
            case 'max_ammo':
                reserveAmmo[1] = maxReserve[1];
                reserveAmmo[2] = maxReserve[2];
                for (let i = 0; i < maxClip.length; i++) {
                    clipAmmo[i] = maxClip[i];
                }
                if (isReloading) {
                    isReloading = false;
                    reloadTimer = 0;
                    document.getElementById('reload-indicator').style.display = 'none';
                }
                updateAmmoHUD();
                break;
            case 'raygun_ammo':
                reserveAmmo[3] = Math.min(reserveAmmo[3] + 10, maxReserve[3]);
                clipAmmo[3] = maxClip[3];
                document.getElementById('raygun-slot').style.display = '';
                updateAmmoHUD();
                break;
        }
        scene.remove(pu.group);
        activePowerups.splice(index, 1);
    }

    function spawnPowerup(pos) {
        const puType = pickPowerupType();
        const group = puType.create();
        group.position.copy(pos);
        group.position.y = 0.3;
        group.scale.setScalar(2.0);
        scene.add(group);
        activePowerups.push({ group, type: puType.id, life: 15 });
    }

    function updatePowerups(dt) {
        if (speedBoostTimer > 0) speedBoostTimer -= dt;

        for (let i = activePowerups.length - 1; i >= 0; i--) {
            const p = activePowerups[i];
            p.life -= dt;
            p.group.rotation.y += dt * 2;
            p.group.position.y = 0.3 + Math.sin(performance.now() / 1000 * 2 + i) * 0.08;

            const dist = camera.position.distanceTo(p.group.position);
            if (dist < 1.5) {
                collectPowerup(p, i);
                continue;
            }
            if (p.life <= 3) {
                p.group.visible = Math.sin(p.life * 10) > 0;
            }

            if (p.life <= 0) {
                scene.remove(p.group);
                activePowerups.splice(i, 1);
            }
        }
    }

    function spawnShockwave(pos) {
        const geo = new THREE.RingGeometry(0.5, 1.5, 32);
        const mat = new THREE.MeshBasicMaterial({
            color: 0x39FF14, transparent: true, opacity: 0.8, side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(geo, mat);
        ring.position.copy(pos);
        ring.position.y = 0.5;
        ring.rotation.x = -Math.PI / 2;
        scene.add(ring);
        activeShockwaves.push({ mesh: ring, age: 0 });
    }

    function updateShockwaves(dt) {
        for (let i = activeShockwaves.length - 1; i >= 0; i--) {
            const sw = activeShockwaves[i];
            sw.age += dt;
            const s = 1 + sw.age * 40;
            sw.mesh.scale.set(s, s, s);
            sw.mesh.material.opacity = Math.max(0, 0.8 - sw.age * 2);
            if (sw.age > 0.5) {
                scene.remove(sw.mesh);
                sw.mesh.geometry.dispose();
                sw.mesh.material.dispose();
                activeShockwaves.splice(i, 1);
            }
        }
    }

    // ═══════════════════════════════════════
    // ENEMIES
    // ═══════════════════════════════════════
    function spawnEnemy(type) {
        const modelKey = type === 'boss' ? 'boss' : type;
        if (!models[modelKey]) return;

        const cfg = CONFIG.enemies[type];
        const sourceModel = models[modelKey];
        const group = skeletonClone(sourceModel);
        group.traverse((child) => {
            if (child.isMesh) child.material = child.material.clone();
        });
        group.scale.setScalar(cfg.scale);

        const angle = Math.random() * Math.PI * 2;
        group.position.set(
            Math.cos(angle) * CONFIG.spawnRadius,
            0,
            Math.sin(angle) * CONFIG.spawnRadius
        );

        const mixer = new THREE.AnimationMixer(group);
        const clips = anims[modelKey] || [];
        let walkClip = null, runClip = null, deathClip = null;
        for (const clip of clips) {
            const n = clip.name.toLowerCase();
            if (n.includes('dead') || n.includes('death') || n.includes('die') || n.includes('dying') || n.includes('shot') || n.includes('fall')) {
                deathClip = clip;
            } else if (n.includes('run')) {
                runClip = clip;
            } else if (n.includes('walk')) {
                walkClip = clip;
            }
        }
        if (!walkClip && clips.length > 0) walkClip = clips[0];
        if (!deathClip && clips.length > 2) deathClip = clips[2];

        const walkAction = mixer.clipAction(walkClip || clips[0]);
        walkAction.play();

        let deadAction = null;
        if (deathClip) {
            deadAction = mixer.clipAction(deathClip);
            deadAction.loop = THREE.LoopOnce;
            deadAction.clampWhenFinished = true;
        }

        const hitRadius = type === 'boss' ? 1.3 : 0.9;
        const hitHeight = type === 'boss' ? 3.2 : 2.5;
        const hitbox = new THREE.Mesh(
            new THREE.CylinderGeometry(hitRadius, hitRadius, hitHeight, 8),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        hitbox.position.y = hitHeight / 2;
        group.add(hitbox);

        scene.add(group);

        let hb = null;
        if (type !== 'boss') {
            hb = createHealthBar(type);
            scene.add(hb.sprite);
        }

        const waveScale = 1 + (wave - 1) * 0.15;
        const scaledHealth = Math.round(cfg.health * waveScale);
        const bossWaveNum = Math.floor(wave / 10);

        let baseSpeed = cfg.speed;
        if (type === 'runner') {
            const speedScale = Math.min(1.4, 1 + (wave - 1) * 0.02);
            baseSpeed = cfg.speed * speedScale;
        } else {
            const speedScale = Math.min(2.0, 1 + (wave - 1) * 0.08);
            baseSpeed = cfg.speed * speedScale;
        }

        const enemy = {
            type, group, mixer,
            walkAction, runClip, deathClip,
            deadAction,
            health: scaledHealth,
            maxHealth: scaledHealth,
            speed: baseSpeed,
            baseSpeed,
            damage: cfg.damage,
            points: cfg.points,
            dead: false,
            despawnTimer: 0,
            hitFlashTimer: 0,
            healthBar: hb,
            isBoss: type === 'boss',
            bossWaveNum,
            enraged: false,
            slamCooldown: 0,
            redPulseTimer: 0,
            lastLane: Math.floor(Math.random() * 3)
        };

        activeEnemies.push(enemy);

        if (type === 'boss') {
            activeBoss = enemy;
            showWaveAnnounce('⚠ TITAN ⚠');
            startBossMusic();
            const bossBar = document.getElementById('boss-bar');
            bossBar.style.display = 'block';
            updateBossHUD();

            const entourageCount = 2;
            for (let ei = 0; ei < entourageCount; ei++) {
                setTimeout(() => {
                    if (state === 'playing') spawnEnemy('shambler');
                }, 800 + ei * 400);
            }
            waveEnemiesLeft += entourageCount;
        }
    }

    function updateBossHUD() {
        if (!activeBoss || activeBoss.dead) {
            document.getElementById('boss-bar').style.display = 'none';
            return;
        }
        const pct = Math.max(0, activeBoss.health / activeBoss.maxHealth * 100);
        document.getElementById('boss-health-fill').style.width = pct + '%';
    }

    function damageEnemy(enemy, baseDmg, hitPoint) {
        const isCritical = hitPoint.y > (enemy.group.position.y + 1.2);
        const dmg = isCritical ? baseDmg * 2 : baseDmg;

        enemy.health -= dmg;
        enemy.hitFlashTimer = 0.1;
        const hitDist = camera.position.distanceTo(hitPoint);
        playHitImpact(hitDist, isCritical);
        spawnDamageNumber(hitPoint, dmg, isCritical);

        if (enemy.isBoss) {
            updateBossHUD();

            if (enemy.bossWaveNum >= 4 && !enemy.enraged &&
                enemy.health < enemy.maxHealth * 0.25) {
                enemy.enraged = true;
                enemy.speed = enemy.baseSpeed * 2.5;
                enemy.slamCooldown = 0;
                showWaveAnnounce('⚠ ENRAGED ⚠');
            }
            else if (enemy.bossWaveNum < 4 && !enemy.enraged &&
                enemy.health < enemy.maxHealth * 0.3) {
                enemy.enraged = true;
                enemy.speed = enemy.baseSpeed * 2;
                showWaveAnnounce('⚠ ENRAGED ⚠');
            }
        } else {
            updateHealthBar(enemy);
        }

        if (enemy.health <= 0 && !enemy.dead) {
            killEnemy(enemy);
        }
    }

    function killEnemy(enemy) {
        enemy.dead = true;
        playDeathSound(enemy.type, enemy.group.position);
        kills++;
        score += enemy.points;
        waveEnemiesLeft--;
        updateHUD();

        if (enemy.isBoss) {
            activeBoss = null;
            stopBossMusic();
            document.getElementById('boss-bar').style.display = 'none';
            screenShake = 0.5;
            spawnShockwave(enemy.group.position.clone());

            for (let i = 0; i < 3; i++) {
                const dropPos = enemy.group.position.clone();
                dropPos.x += (Math.random() - 0.5) * 3;
                dropPos.z += (Math.random() - 0.5) * 3;
                spawnPowerup(dropPos);
            }

            if (enemy.bossWaveNum >= 3) {
                const boomRadius = 12;
                const boomDamage = 100;
                for (const e of activeEnemies) {
                    if (e.dead || e === enemy) continue;
                    const dist = e.group.position.distanceTo(enemy.group.position);
                    if (dist < boomRadius) {
                        const falloff = 1 - (dist / boomRadius);
                        const chainDmg = boomDamage * falloff;
                        e.health -= chainDmg;
                        e.hitFlashTimer = 0.2;
                        spawnDamageNumber(e.group.position.clone().setY(1.5), chainDmg, false);
                        if (e.health <= 0 && !e.dead) killEnemy(e);
                    }
                }
                spawnShockwave(enemy.group.position.clone());
                screenShake = 0.8;
            }
        } else {
            if (enemy.healthBar) scene.remove(enemy.healthBar.sprite);
        }

        if (enemy.deadAction) {
            if (enemy.mixer) enemy.mixer.stopAllAction();
            enemy.deadAction.reset();
            enemy.deadAction.setLoop(THREE.LoopOnce, 1);
            enemy.deadAction.clampWhenFinished = true;
            const clipDur = enemy.deadAction.getClip().duration;
            enemy.deadAction.setEffectiveTimeScale(clipDur < 1.5 ? 0.3 : 1);
            enemy.deadAction.setEffectiveWeight(1);
            enemy.deadAction.play();
        } else {
            if (enemy.mixer) enemy.mixer.stopAllAction();
            enemy.tumbleX = (Math.random() - 0.5) * 10;
            enemy.tumbleZ = (Math.random() - 0.5) * 10;
            enemy.dropSpeed = 0;
        }

        if (!enemy.isBoss && Math.random() < CONFIG.dropChance) {
            spawnPowerup(enemy.group.position.clone());
        }
    }

    function updateEnemies(dt) {
        for (let i = activeEnemies.length - 1; i >= 0; i--) {
            const e = activeEnemies[i];

            if (e.dead) {
                e.despawnTimer += dt;
                if (e.mixer) e.mixer.update(dt);

                if (e.despawnTimer > CONFIG.despawnTime) {
                    scene.remove(e.group);
                    if (e.healthBar) scene.remove(e.healthBar.sprite);
                    activeEnemies.splice(i, 1);
                }
                continue;
            }

            e.mixer.update(dt);

            if (e.type === 'runner' && e.runClip && wave >= 8) {
                if (e.walkAction && e.walkAction.isRunning() && e.walkAction.getClip() !== e.runClip) {
                    e.walkAction.fadeOut(0.2);
                    const newAction = e.mixer.clipAction(e.runClip);
                    newAction.reset().fadeIn(0.2).play();
                    e.walkAction = newAction;
                }
            }

            if (!e.isBoss) updateHealthBar(e);

            const dir = new THREE.Vector3(
                camera.position.x - e.group.position.x,
                0,
                camera.position.z - e.group.position.z
            );
            const dist = dir.length();
            dir.normalize();

            if (dist > 0.5) {
                _currentQuat.copy(e.group.quaternion);
                e.group.lookAt(camera.position.x, e.group.position.y, camera.position.z);
                _targetQuat.copy(e.group.quaternion);
                e.group.quaternion.copy(_currentQuat);
                e.group.quaternion.slerp(_targetQuat, Math.min(1, 5 * dt));
            }

            if (dist > CONFIG.meleeRange) {
                const laneSpread = 2.5;
                const myLane = Math.floor((e.group.position.x + ARENA_BOUNDS) / (ARENA_BOUNDS * 2 / 3));
                for (const other of activeEnemies) {
                    if (other === e || other.dead) continue;
                    const otherLane = Math.floor((other.group.position.x + ARENA_BOUNDS) / (ARENA_BOUNDS * 2 / 3));
                    if (myLane === otherLane) {
                        const awayX = e.group.position.x - other.group.position.x;
                        if (Math.abs(awayX) < laneSpread && Math.abs(awayX) > 0.1) {
                            dir.x += (awayX / Math.abs(awayX)) * 0.4;
                            dir.normalize();
                        }
                    }
                }

                e.group.position.addScaledVector(dir, e.speed * dt);

                if (e.walkAction) {
                    let tScale = e.speed / ANIM_REFERENCE_SPEED;
                    if (e.type === 'tank') tScale *= 0.45;
                    e.walkAction.timeScale = tScale;
                }
                if (dist < 12) {
                    if (!e.growlCooldown) e.growlCooldown = Math.random() * 2;
                    e.growlCooldown -= dt;
                    if (e.growlCooldown <= 0) {
                        playGrowl(e.type, dist);
                        e.growlCooldown = 2.5 + Math.random() * 2.0;
                    }
                }
            } else {
                if (e.walkAction) e.walkAction.timeScale = 0.3;
                if (!e.growlCooldown) e.growlCooldown = 0;
                e.growlCooldown -= dt;
                if (e.growlCooldown <= 0) {
                    playGrowl(e.type, dist);
                    e.growlCooldown = 2.5 + Math.random() * 1.5;
                }
                hp -= e.damage * dt;
                updateHealthHUD();

                if (e.isBoss && e.bossWaveNum >= 2) {
                    e.slamCooldown -= dt;
                    if (e.slamCooldown <= 0) {
                        const slamDmg = e.enraged ? 20 : 12;
                        hp -= slamDmg;
                        updateHealthHUD();
                        screenShake = 0.3;
                        spawnShockwave(e.group.position.clone());
                        e.slamCooldown = e.enraged ? 1.5 : 3.0;
                    }
                }

                if (e.isBoss && e.enraged && e.bossWaveNum >= 4) {
                    e.redPulseTimer += dt;
                    const pulse = Math.sin(e.redPulseTimer * 8) * 0.5 + 0.5;
                    e.group.traverse(c => {
                        if (c.isMesh && c.material.emissive) {
                            c.material.emissive.setRGB(pulse * 0.8, 0, 0);
                        }
                    });
                }

                if (e.isBoss) screenShake = Math.max(screenShake, 0.05);
                if (hp <= 0) {
                    hp = 0;
                    gameOver();
                }
            }
        }
    }

    // ═══════════════════════════════════════
    // WAVE SYSTEM
    // ═══════════════════════════════════════
      function startWave() {
        wave++;
        betweenWaves = false;

        const totalEnemies = 3 + wave * 2;
        const isBossWave = (wave % 10 === 0);
        waveEnemiesLeft = totalEnemies + (isBossWave ? 1 : 0);

        if (wave > 0 && wave % PAUSE_CHARGE_INTERVAL === 0 && pauseCharges < 1) {
            pauseCharges = 1;
        }

        updateHUD();
        showWaveAnnounce(`WAVE ${wave}`);
        playWaveKlaxon(wave % 10 === 0);

        let spawned = 0;
        const spawnInterval = setInterval(() => {
            if (spawned >= totalEnemies || state !== 'playing') {
                clearInterval(spawnInterval);
                if (isBossWave && state === 'playing') {
                    setTimeout(() => spawnEnemy('boss'), 1500);
                }
                return;
            }
            const type = pickEnemyType();
            spawnEnemy(type);
            spawned++;
        }, 900);
    }

    function pickEnemyType() {
        const r = Math.random();
        if (wave <= 3) {
            return r < 0.80 ? 'shambler' : 'runner';
        } else if (wave <= 7) {
            if (r < 0.40) return 'shambler';
            if (r < 0.65) return 'runner';
            if (r < 0.85) return 'tank';
            return 'brute';
        } else {
            if (r < 0.20) return 'shambler';
            if (r < 0.40) return 'runner';
            if (r < 0.65) return 'tank';
            return 'brute';
        }
    }

    function checkWaveComplete() {
        if (waveEnemiesLeft <= 0 && !betweenWaves && state === 'playing') {
            betweenWaves = true;
            waveTimer = 4;

            reserveAmmo[1] += 4;
            reserveAmmo[2] += 15;
            if (reserveAmmo[1] > maxReserve[1]) reserveAmmo[1] = maxReserve[1];
            if (reserveAmmo[2] > maxReserve[2]) reserveAmmo[2] = maxReserve[2];
            updateAmmoHUD();
        }
    }

    // ═══════════════════════════════════════
    // PAUSE SYSTEM
    // ═══════════════════════════════════════
    function activatePause() {
        if (pauseCharges <= 0 || isPaused) return;
        pauseCharges = 0;
        isPaused = true;
        pauseTimer = PAUSE_DURATION;
        showWaveAnnounce('⏸ PAUSED');
        for (const e of activeEnemies) {
            if (e.mixer) {
                e._prevTimeScale = e.mixer.timeScale;
                e.mixer.timeScale = 0;
            }
        }
    }

    function updatePause(dt) {
        if (!isPaused) return;
        pauseTimer -= dt;
        if (pauseTimer <= 0) {
            isPaused = false;
            for (const e of activeEnemies) {
                if (e.mixer && e._prevTimeScale !== undefined) {
                    e.mixer.timeScale = e._prevTimeScale;
                    delete e._prevTimeScale;
                }
            }
            showWaveAnnounce('▶ RESUMED');
        }
    }

    // ═══════════════════════════════════════
    // THREAT INDICATORS
    // ═══════════════════════════════════════
    const threatEls = {
        left:   document.getElementById('threat-left'),
        right:  document.getElementById('threat-right'),
        top:    document.getElementById('threat-top'),
        bottom: document.getElementById('threat-bottom')
    };

    function updateThreatIndicators() {
        let maxL = 0, maxR = 0, maxT = 0, maxB = 0;
        const THREAT_DIST = 15;

        for (const e of activeEnemies) {
            if (e.dead) continue;
            const dir = new THREE.Vector3();
            dir.subVectors(e.group.position, camera.position);
            const dist = dir.length();
            if (dist > THREAT_DIST) continue;

            const intensity = 1 - (dist / THREAT_DIST);

            const forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
            const right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
            const flatDir = new THREE.Vector3(dir.x, 0, dir.z).normalize();

            const dot = forward.dot(flatDir);
            const cross = right.dot(flatDir);

            if (cross < -0.3) maxL = Math.max(maxL, intensity);
            if (cross > 0.3)  maxR = Math.max(maxR, intensity);
            if (dot < -0.2) maxB = Math.max(maxB, intensity);
        }

        threatEls.left.style.opacity = maxL;
        threatEls.right.style.opacity = maxR;
        threatEls.top.style.opacity = maxT;
        threatEls.bottom.style.opacity = maxB;
    }

    // ═══════════════════════════════════════
    // HUD UPDATES
    // ═══════════════════════════════════════
    function updateHUD() {
        document.getElementById('wave-display').textContent = `WAVE ${wave}`;
        document.getElementById('score-display').textContent = score;
        document.getElementById('kills-display').textContent = `KILLS: ${kills}`;
    }

    function updateHealthHUD() {
        const pct = Math.max(0, hp / CONFIG.player.health * 100);
        const bar = document.getElementById('health-bar');
        bar.style.width = pct + '%';
        if (pct < 30) bar.style.background = '#ff4444';
        else if (pct < 60) bar.style.background = '#ffaa00';
        else bar.style.background = '#39FF14';
        if (pct < 30 && state === 'playing') { startHeartbeat(); } else { stopHeartbeat(); }
    }

    function updateAmmoHUD() {
        const clip = clipAmmo[curWeapon];
        const reserve = reserveAmmo[curWeapon];
        if (reserve === Infinity) {
            document.getElementById('ammo-display').textContent = `${clip} / ∞`;
        } else {
            document.getElementById('ammo-display').textContent = `${clip} / ${reserve}`;
        }
    }

  function updateWeaponHUD() {
    const names = ['PISTOL', 'SHOTGUN', 'RIFLE', 'PARTICLE GUN'];
    document.querySelectorAll('.weapon-slot').forEach((el, i) => {
        el.classList.toggle('active', i === curWeapon);
        const reserve = reserveAmmo[i];
        const clip = clipAmmo[i];
        const total = reserve === Infinity ? '∞' : clip + reserve;
        el.textContent = `${names[i]} ${total}`;
    });
    updateAmmoHUD();
}

    function showWaveAnnounce(text) {
        const el = document.getElementById('wave-announce');
        el.textContent = text;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    function updateScreenShake(dt) {
        const camSmooth = Math.min(1, dt * 25);
        camera.position.x += (playerPos.x - camera.position.x) * camSmooth;
        camera.position.z += (playerPos.z - camera.position.z) * camSmooth;
        camera.position.y = CONFIG.player.height;
        if (isMoving) {
            const bobFreq = isSprinting ? 9 : 5;
            const bobAmt = isSprinting ? 0.015 : 0.008;
            const swayAmt = isSprinting ? 0.006 : 0.004;
            const bobVal = Math.sin(wpnBobTime * bobFreq);
            camera.position.y += bobVal * bobAmt;
            camera.position.x += Math.cos(wpnBobTime * bobFreq * 0.5) * swayAmt;
            const stepInterval = isSprinting ? 0.18 : 0.32;
            const now = performance.now() / 1000;
            if (bobVal < -0.7 && (now - lastStepTime) > stepInterval) {
                lastStepTime = now;
                playFootstep();
            }
        }
        if (screenShake > 0) {
            screenShake -= dt;
            const intensity = Math.min(screenShake, 0.3) * 0.15;
            camera.position.x += (Math.random() - 0.5) * intensity;
            camera.position.z += (Math.random() - 0.5) * intensity;
        }
    }

    // ═══════════════════════════════════════
    // PLAYER MOVEMENT
    // ═══════════════════════════════════════
    const _moveForward = new THREE.Vector3();
    const _moveRight = new THREE.Vector3();
    const _yAxis = new THREE.Vector3(0, 1, 0);

    function updateMovement(dt) {
        let inputX = moveJoyDeltaX || 0;
        let inputY = moveJoyDeltaY || 0;

        if (keys['w'] || keys['arrowup'])    inputY += 1;
        if (keys['s'] || keys['arrowdown'])  inputY -= 1;
        if (keys['a'] || keys['arrowleft'])  inputX -= 1;
        if (keys['d'] || keys['arrowright']) inputX += 1;

        const gp = getGamepad();
        if (gp) {
            const dead = 0.15;
            let lx = gp.axes[0] || 0;
            let ly = gp.axes[1] || 0;
            if (Math.abs(lx) < dead) lx = 0;
            if (Math.abs(ly) < dead) ly = 0;
            inputX += lx;
            inputY -= ly;
            isSprinting = gp.buttons[10] ? gp.buttons[10].pressed : false;
        }

        const len = Math.sqrt(inputX * inputX + inputY * inputY);
        if (len > 1) { inputX /= len; inputY /= len; }

        isMoving = len > 0.1;
        if (isADS || !isMoving) isSprinting = false;
        if (!isMoving) return;

        const sprintMult = isSprinting ? SPRINT_MULT : 1.0;
        const adsMult = isADS ? ADS_MOVE_MULT : 1.0;
        const boostMult = speedBoostTimer > 0 ? 1.5 : 1.0;
        const speed = MOVE_SPEED * sprintMult * adsMult * boostMult * dt;

        _moveForward.set(0, 0, -1).applyAxisAngle(_yAxis, yaw);
        _moveRight.set(1, 0, 0).applyAxisAngle(_yAxis, yaw);

        playerPos.x += (_moveForward.x * inputY + _moveRight.x * inputX) * speed;
        playerPos.z += (_moveForward.z * inputY + _moveRight.z * inputX) * speed;

        playerPos.x = Math.max(-ARENA_BOUNDS, Math.min(ARENA_BOUNDS, playerPos.x));
        playerPos.z = Math.max(-ARENA_BOUNDS, Math.min(ARENA_BOUNDS, playerPos.z));
    }

        console.log('Gamepad connected:', e.gamepad.id);
