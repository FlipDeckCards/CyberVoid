<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEADZONE — Zombies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }

        #blocker {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #blocker h1 {
            font-size: 4rem; color: #39FF14;
            text-transform: uppercase; letter-spacing: 12px;
            text-shadow: 0 0 40px rgba(57,255,20,0.5);
            margin-bottom: 10px;
        }
        #blocker .mode {
            font-size: 1.4rem; color: #ff4444;
            letter-spacing: 6px; text-transform: uppercase;
            margin-bottom: 20px;
        }

        #login-fields {
            display: flex; flex-direction: column; align-items: center;
            gap: 10px; margin-bottom: 20px; width: 280px;
        }
        #login-fields input {
            width: 100%; padding: 10px 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid #333; border-radius: 4px;
            color: #39FF14; font-family: 'Courier New', monospace;
            font-size: 0.85rem; letter-spacing: 2px;
            outline: none; text-align: center;
        }
        #login-fields input::placeholder {
            color: #555; letter-spacing: 2px;
        }
        #login-fields input:focus {
            border-color: #39FF14;
            background: rgba(57,255,20,0.05);
        }
        #login-status {
            color: #666; font-size: 0.7rem; letter-spacing: 2px;
            min-height: 16px; text-align: center;
        }

        #menu-leaderboard {
            width: 300px; max-height: 240px; margin-bottom: 20px;
            overflow-y: auto;
        }
        #menu-leaderboard h3 {
            color: #ff4444; font-size: 0.75rem;
            letter-spacing: 4px; text-transform: uppercase;
            text-align: center; margin-bottom: 8px;
        }
        .lb-row {
            display: flex; justify-content: space-between;
            padding: 4px 8px; font-size: 0.7rem;
            letter-spacing: 1px; border-bottom: 1px solid #1a1a1a;
        }
        .lb-row .lb-rank { color: #555; width: 30px; }
        .lb-row .lb-name { color: #39FF14; flex: 1; }
        .lb-row .lb-score { color: #888; }
        .lb-row .lb-wave { color: #39FF14; font-size: 0.65rem; width: 50px; text-align: center; }
        .lb-row.lb-you .lb-name { color: #ffdd00; }
        #menu-leaderboard::-webkit-scrollbar { width: 4px; }
        #menu-leaderboard::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        #blocker .start-text {
            font-size: 1rem; color: #888;
            letter-spacing: 4px; text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }
        #loading-bar {
            width: 200px; height: 4px; background: #222;
            border-radius: 2px; margin-top: 20px; overflow: hidden;
        }
        #loading-fill {
            width: 0%; height: 100%; background: #39FF14;
            transition: width 0.3s;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
            font-family: 'Courier New', monospace;
            display: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
            transition: transform 0.1s, opacity 0.1s;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.85);
        }
        #crosshair::before {
            top: 50%; left: 0; width: 100%; height: 2px;
            transform: translateY(-50%);
        }
        #crosshair::after {
            top: 0; left: 50%; width: 2px; height: 100%;
            transform: translateX(-50%);
        }

        .hud-top {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 20px; color: #39FF14; font-size: 0.85rem;
            letter-spacing: 2px;
        }
        #health-bar-bg {
            position: absolute; bottom: 60px; left: 20px;
            width: 200px; height: 8px; background: #333;
            border-radius: 4px; overflow: hidden;
        }
        #health-bar {
            width: 100%; height: 100%; background: #39FF14;
            transition: width 0.3s;
        }
        #health-label {
            position: absolute; bottom: 72px; left: 20px;
            color: #39FF14; font-size: 0.7rem; letter-spacing: 2px;
        }
        #ammo-display {
            position: absolute; bottom: 60px; left: 240px;
            color: #39FF14; font-size: 1.4rem;
        }
        #ammo-label {
            position: absolute; bottom: 72px; left: 240px;
            color: #666; font-size: 0.6rem; letter-spacing: 2px;
        }

        #weapon-bar {
            position: absolute; bottom: 15px; right: 20px;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: auto;
        }
        .weapon-slot {
            padding: 6px 12px; background: rgba(0,0,0,0.6);
            border: 1px solid #333; border-radius: 4px;
            color: #888; font-size: 0.65rem; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; text-align: right;
        }
        .weapon-slot.active {
            border-color: #39FF14; color: #39FF14;
            background: rgba(57,255,20,0.1);
        }

        #wave-announce {
            position: fixed; top: 20%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 3rem; color: #ff4444;
            letter-spacing: 8px; text-transform: uppercase;
            text-shadow: 0 0 40px rgba(255,68,68,0.5);
            z-index: 60; display: none; pointer-events: none;
        }

        #boss-bar {
            position: absolute; top: 45px; left: 50%;
            transform: translateX(-50%); width: 300px;
            display: none; pointer-events: none;
        }
        #boss-name {
            color: #ff4444; font-size: 0.7rem; text-align: center;
            letter-spacing: 3px; margin-bottom: 4px;
        }
        #boss-bar-bg {
            width: 100%; height: 8px; background: #333;
            border-radius: 4px; overflow: hidden;
        }
        #boss-health-fill {
            width: 100%; height: 100%; background: #ff4444;
            transition: width 0.3s;
        }

        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100;
            font-family: 'Courier New', monospace;
        }
        #game-over h1 {
            font-size: 3rem; color: #ff4444;
            letter-spacing: 8px; margin-bottom: 20px;
        }
        #game-over .stats {
            color: #888; font-size: 1rem;
            letter-spacing: 3px; margin-bottom: 30px;
            text-align: center; line-height: 2;
        }
        #game-over-buttons {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
        }
        .go-btn {
            padding: 12px 32px; border: 1px solid #39FF14;
            background: rgba(57,255,20,0.08); border-radius: 4px;
            color: #39FF14; font-family: 'Courier New', monospace;
            font-size: 0.9rem; letter-spacing: 4px; text-transform: uppercase;
            cursor: pointer; transition: background 0.2s;
        }
        .go-btn:hover { background: rgba(57,255,20,0.15); }
        .go-btn.secondary {
            border-color: #555; color: #888;
            background: rgba(255,255,255,0.03);
        }
        .go-btn.secondary:hover { background: rgba(255,255,255,0.08); }

        .threat-edge {
            position: absolute; background: #ff4444; opacity: 0;
            transition: opacity 0.1s; pointer-events: none;
            box-shadow: 0 0 20px rgba(255,68,68,0.7);
            border-radius: 2px;
        }
        #threat-left   { top: 25%; left: 0; width: 3px; height: 50%; }
        #threat-right  { top: 25%; right: 0; width: 3px; height: 50%; }
        #threat-top    { top: 0; left: 25%; width: 50%; height: 3px; }
        #threat-bottom { bottom: 70px; left: 25%; width: 50%; height: 3px; }

        /* ── MOBILE MOVE JOYSTICK ── */
        #move-joystick-zone {
            position: fixed;
            bottom: 0; left: 0;
            width: 45%; height: 55%;
            z-index: 55;
            pointer-events: auto;
            display: none;
        }
        #move-joystick-base {
            position: absolute;
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 2px solid rgba(57, 255, 20, 0.25);
            background: rgba(57, 255, 20, 0.04);
            display: none;
            pointer-events: none;
        }
        #move-joystick-thumb {
            position: absolute;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(57, 255, 20, 0.35);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            #blocker h1 { font-size: 2.5rem; letter-spacing: 8px; }
            #blocker .mode { font-size: 1rem; }
            #login-fields { width: 240px; }
            #menu-leaderboard { width: 260px; }
            #health-bar-bg { width: 120px; }
            #ammo-display { left: 160px; }
            #ammo-label { left: 160px; }
            #wave-announce { font-size: 3rem; }
            #boss-bar { width: 200px; }
        }
    </style>
</head>
<body>
    <div id="blocker">
        <h1>DEADZONE</h1>
        <div class="mode">Zombies</div>
<a href="/" id="back-to-deadzone" style="color:#FF4444; font-size:0.7rem; text-decoration:none; letter-spacing:3px; text-transform:uppercase; margin-top:5px; margin-bottom:10px;">← ALL ARENAS</a>
        <div id="login-fields" style="display:none;">
            <input type="text" id="callsign-input" placeholder="CALLSIGN" maxlength="20" autocomplete="off" />
            <input type="email" id="email-input" placeholder="EMAIL (SYNC ACROSS DEVICES)" autocomplete="email" />
            <div id="login-status"></div>
        </div>

        <div id="menu-leaderboard" style="display:none;">
            <h3>⚡ TOP SCORES ⚡</h3>
            <div id="lb-rows"></div>
        </div>

        <div class="start-text" id="start-text">Loading...</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div class="hud-top">
            <div id="wave-display">WAVE 1</div>
            <div id="score-display">0</div>
            <div id="kills-display">KILLS: 0</div>
        </div>
        <div id="boss-bar">
            <div id="boss-name">TITAN</div>
            <div id="boss-bar-bg"><div id="boss-health-fill"></div></div>
        </div>
        <div id="health-label">HEALTH</div>
        <div id="health-bar-bg"><div id="health-bar"></div></div>
        <div id="ammo-display">∞</div>
        <div id="ammo-label">AMMO</div>
        <div id="weapon-bar">
            <div class="weapon-slot active" data-weapon="0">1 PISTOL</div>
            <div class="weapon-slot" data-weapon="1">2 SHOTGUN</div>
            <div class="weapon-slot" data-weapon="2">3 RIFLE</div>
        </div>
        <div class="threat-edge" id="threat-left"></div>
        <div class="threat-edge" id="threat-right"></div>
        <div class="threat-edge" id="threat-top"></div>
        <div class="threat-edge" id="threat-bottom"></div>
    </div>

    <!-- MOBILE MOVE JOYSTICK -->
    <div id="move-joystick-zone">
        <div id="move-joystick-base">
            <div id="move-joystick-thumb"></div>
        </div>
    </div>

    <div id="wave-announce"></div>

    <div id="game-over">
        <h1>DEAD</h1>
        <div class="stats" id="final-stats"></div>
        <div id="game-over-buttons">
            <div class="go-btn" id="btn-redeploy">REDEPLOY</div>
            <div class="go-btn secondary" id="btn-main-menu">MAIN MENU</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

    // ═══════════════════════════════════════
    // CALLSIGN / EMAIL / LEADERBOARD API
    // ═══════════════════════════════════════
    let playerCallsign = localStorage.getItem('dz_callsign') || '';
    let playerEmail = localStorage.getItem('dz_email') || '';

    async function fetchLeaderboard() {
        try {
            const r = await fetch('/api/leaderboard');
            const rows = await r.json();
            const container = document.getElementById('lb-rows');
            container.innerHTML = '';
            rows.forEach((row, i) => {
                const isYou = row.callsign === playerCallsign;
                const div = document.createElement('div');
                div.className = 'lb-row' + (isYou ? ' lb-you' : '');
                div.innerHTML = `<span class="lb-rank">${i + 1}.</span><span class="lb-name">${row.callsign}</span><span class="lb-wave">R${row.wave || 0}</span><span class="lb-score">${row.score}</span>`;
                container.appendChild(div);
            });
            document.getElementById('menu-leaderboard').style.display = 'block';
        } catch (e) {
            console.warn('Leaderboard fetch failed:', e);
        }
    }

    async function registerPlayer(callsign, email) {
        try {
            const body = { callsign };
            if (email) body.email = email;
            const r = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await r.json();
            if (data.error) {
                document.getElementById('login-status').textContent = data.error;
                return false;
            }
            localStorage.setItem('dz_callsign', callsign);
            if (email) localStorage.setItem('dz_email', email);
            playerCallsign = callsign;
            playerEmail = email || '';
            document.getElementById('login-status').textContent = data.linked ? 'LINKED ✓' : 'READY';
            return true;
        } catch (e) {
            document.getElementById('login-status').textContent = 'OFFLINE — PLAYING LOCAL';
            localStorage.setItem('dz_callsign', callsign);
            playerCallsign = callsign;
            return true;
        }
    }

    async function lookupCallsign(email) {
        try {
            const r = await fetch(`/api/callsign?email=${encodeURIComponent(email)}`);
            const data = await r.json();
            return data.callsign || null;
        } catch (e) { return null; }
    }

    async function submitScore(scoreVal, waveVal, killsVal) {
        if (!playerCallsign) return;
        try {
            await fetch('/api/score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    callsign: playerCallsign,
                    score: scoreVal, wave: waveVal, kills: killsVal
                })
            });
        } catch (e) { console.warn('Score submit failed'); }
    }

    const callsignInput = document.getElementById('callsign-input');
    const emailInput = document.getElementById('email-input');
    callsignInput.value = playerCallsign;
    emailInput.value = playerEmail;

    if (playerEmail && !playerCallsign) {
        lookupCallsign(playerEmail).then(cs => {
            if (cs) {
                playerCallsign = cs;
                callsignInput.value = cs;
                localStorage.setItem('dz_callsign', cs);
                document.getElementById('login-status').textContent = 'CALLSIGN RECOVERED ✓';
            }
        });
    }

    callsignInput.addEventListener('click', e => e.stopPropagation());
    callsignInput.addEventListener('touchend', e => e.stopPropagation());
    emailInput.addEventListener('click', e => e.stopPropagation());
    emailInput.addEventListener('touchend', e => e.stopPropagation());
        // ═══════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════
    const CONFIG = {
        player: { height: 1.6, health: 100 },
        weapons: [
            { name: 'Pistol',  damage: 25, rate: 0.3,  ammo: Infinity, spread: 0,    pellets: 1, auto: false },
            { name: 'Shotgun', damage: 15, rate: 0.8,  ammo: 20,        spread: 0.08, pellets: 6, auto: false },
            { name: 'Rifle',   damage: 35, rate: 0.12, ammo: 60,       spread: 0.02, pellets: 1, auto: true  }
        ],
        enemies: {
            shambler: { speed: 1.8, health: 100, damage: 10, points: 10,  scale: 1.2 },
            runner:   { speed: 3.2, health: 60,  damage: 8,  points: 25,  scale: 1.0 },
            brute:    { speed: 1.3, health: 180, damage: 25, points: 50,  scale: 1.5 },
            tank:     { speed: 1.5, health: 250, damage: 20, points: 40,  scale: 1.4 },
            boss:     { speed: 1.0, health: 800, damage: 30, points: 500, scale: 2.5 }
        },
        spawnRadius: 60,
        meleeRange: 2.0,
        despawnTime: 3,
        dropChance: 0.3
    };

    // ═══════════════════════════════════════
    // GAME STATE
    // ═══════════════════════════════════════
    let state = 'loading';
    let score = 0, kills = 0, wave = 0;
    let hp = CONFIG.player.health;
    let curWeapon = 0;
    let ammo = [Infinity, 20, 60];
    let maxAmmo = [Infinity, 20, 60];
    let lastShotTime = 0;
    let waveEnemiesLeft = 0;
    let waveTimer = 0;
    let betweenWaves = false;
    let fireHeld = false;
    let fireTouchId = null;
    let pendingFire = false;
    let hasFiredThisClick = false;
    let activeBoss = null;
    let screenShake = 0;
    let speedBoostTimer = 0;

    // ── Sprint + ADS state ──
    let isSprinting = false;
    let isADS = false;
    let adsAmount = 0;
    const BASE_FOV = 70;
    const ADS_FOV = 45;
    const SPRINT_FOV = 78;
    const ADS_LERP_SPEED = 12;
    const SPRINT_MULT = 1.7;
    const ADS_MOVE_MULT = 0.5;
    const ADS_SPREAD_MULT = 0.35;

    // ── Player movement state ──
    const playerPos = new THREE.Vector3(0, 0, 0);
    const MOVE_SPEED = 5.0;
    const ARENA_BOUNDS = 39.0;
    const keys = {};
    let isMoving = false;

    // ── Mobile joystick state ──
    let moveJoyTouchId = null;
    let moveJoyOriginX = 0, moveJoyOriginY = 0;
    let moveJoyDeltaX = 0, moveJoyDeltaY = 0;
    const JOYSTICK_MAX_DIST = 45;

    // ── Gamepad state ──
    let gamepadIndex = null;
    let gpFireHeld = false;
    let gpLBPrev = false, gpRBPrev = false;

    // ── Reusable temp objects (zero GC) ──
    const ANIM_REFERENCE_SPEED = 2.0;
    const _currentQuat = new THREE.Quaternion();
    const _targetQuat = new THREE.Quaternion();

    const activeEnemies = [];
    const activePowerups = [];
    const activeDamageNumbers = [];
    const activeShockwaves = [];
    const clock = new THREE.Clock();

    // ═══════════════════════════════════════
    // PROCEDURAL AUDIO SYSTEM (zero files)
    // ═══════════════════════════════════════
    let audioCtx = null;
    let lastStepTime = 0;
    let stepToggle = false;
    let heartbeatActive = false;
    let heartbeatInterval = null;
    let activeGrowlCount = 0;
    const MAX_CONCURRENT_GROWLS = 3;
    const GROWL_COOLDOWN = 2.5;
    const GROWL_RANGE = 12;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            console.log('AUDIO CREATED', audioCtx.state);
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
    }
    ['click', 'touchstart', 'keydown', 'gamepadconnected'].forEach(evt => {
        document.addEventListener(evt, () => {
            if (!audioCtx) initAudio();
            else if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        });
    });

    // ── 1. Footsteps ──
    function playFootstep() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        stepToggle = !stepToggle;
        const basePitch = stepToggle ? 65 : 55;
        const pitch = basePitch + Math.random() * 15;

        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);
        const gain = audioCtx.createGain();
        const vol = isSprinting ? 0.18 : 0.10;
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.12);

        const bufSize = audioCtx.sampleRate * 0.04;
        const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuf;
        const noiseGain = audioCtx.createGain();
        const noiseVol = isSprinting ? 0.06 : 0.03;
        noiseGain.gain.setValueAtTime(noiseVol, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 800;
        noise.connect(filter).connect(noiseGain).connect(audioCtx.destination);
        noise.start(now); noise.stop(now + 0.06);
    }

    // ── 2. Gunshots ──
    function playGunshot(weaponIndex) {
        console.log('GUNSHOT CALLED', audioCtx ? audioCtx.state : 'NULL');
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const profiles = [
            { freq: 220, freqEnd: 60, decay: 0.12, vol: 0.25, noiseVol: 0.12, noiseDur: 0.06, filterFreq: 3000 },
            { freq: 90, freqEnd: 25, decay: 0.22, vol: 0.35, noiseVol: 0.20, noiseDur: 0.10, filterFreq: 1500 },
            { freq: 300, freqEnd: 80, decay: 0.08, vol: 0.22, noiseVol: 0.15, noiseDur: 0.04, filterFreq: 4500 },
        ];
        const p = profiles[weaponIndex] || profiles[0];

        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(p.freq + Math.random() * 30, now);
        osc.frequency.exponentialRampToValueAtTime(p.freqEnd, now + p.decay);
        const oscGain = audioCtx.createGain();
        oscGain.gain.setValueAtTime(p.vol, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + p.decay);
        const waveshaper = audioCtx.createWaveShaper();
        const curve = new Float32Array(256);
        for (let i = 0; i < 256; i++) { const x = (i / 128) - 1; curve[i] = (Math.PI + 3) * x / (Math.PI + 3 * Math.abs(x)); }
        waveshaper.curve = curve;
        osc.connect(waveshaper).connect(oscGain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + p.decay + 0.01);

        const bufSize = Math.floor(audioCtx.sampleRate * p.noiseDur);
        const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const nd = noiseBuf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) nd[i] = (Math.random() * 2 - 1);
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuf;
        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = p.filterFreq; noiseFilter.Q.value = 0.8;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(p.noiseVol, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + p.noiseDur);
        noise.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
        noise.start(now); noise.stop(now + p.noiseDur + 0.01);

        const sub = audioCtx.createOscillator();
        sub.type = 'sine';
        const subFreq = weaponIndex === 1 ? 35 : 50;
        sub.frequency.setValueAtTime(subFreq, now);
        sub.frequency.exponentialRampToValueAtTime(20, now + 0.1);
        const subGain = audioCtx.createGain();
        const subVol = weaponIndex === 1 ? 0.30 : 0.15;
        subGain.gain.setValueAtTime(subVol, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        sub.connect(subGain).connect(audioCtx.destination);
        sub.start(now); sub.stop(now + 0.11);
    }
       // ── 3. Zombie Growls ──
    const GROWL_PROFILES = {
        shambler: { freq: 75, freqEnd: 55, modRate: 3, modDepth: 20, dur: 0.6, vol: 0.08, type: 'sawtooth' },
        runner:   { freq: 140, freqEnd: 100, modRate: 12, modDepth: 40, dur: 0.3, vol: 0.07, type: 'square' },
        brute:    { freq: 55, freqEnd: 35, modRate: 2, modDepth: 15, dur: 0.8, vol: 0.10, type: 'sawtooth' },
        tank:     { freq: 50, freqEnd: 30, modRate: 1.5, modDepth: 10, dur: 0.9, vol: 0.10, type: 'sawtooth' },
        boss:     { freq: 40, freqEnd: 25, modRate: 2, modDepth: 25, dur: 1.2, vol: 0.14, type: 'sawtooth' },
    };

    function playGrowl(enemyType, distance) {
        if (!audioCtx) return;
        if (activeGrowlCount >= MAX_CONCURRENT_GROWLS) return;
        const p = GROWL_PROFILES[enemyType] || GROWL_PROFILES.shambler;
        const now = audioCtx.currentTime;
        const distFactor = 1 - Math.min(distance / GROWL_RANGE, 1);
        const vol = p.vol * distFactor;
        if (vol < 0.01) return;
        activeGrowlCount++;
        const freqRand = (Math.random() - 0.5) * 20;

        const osc = audioCtx.createOscillator();
        osc.type = p.type;
        osc.frequency.setValueAtTime(p.freq + freqRand, now);
        osc.frequency.linearRampToValueAtTime(p.freqEnd + freqRand * 0.5, now + p.dur);
        const lfo = audioCtx.createOscillator();
        lfo.type = 'sine'; lfo.frequency.value = p.modRate + Math.random() * 2;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = p.modDepth;
        lfo.connect(lfoGain).connect(osc.frequency);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + p.dur * 0.15);
        gain.gain.setValueAtTime(vol, now + p.dur * 0.6);
        gain.gain.exponentialRampToValueAtTime(0.001, now + p.dur);
        const formant = audioCtx.createBiquadFilter();
        formant.type = 'bandpass';
        formant.frequency.setValueAtTime(300 + Math.random() * 200, now);
        formant.frequency.linearRampToValueAtTime(150 + Math.random() * 100, now + p.dur);
        formant.Q.value = 2 + Math.random() * 3;
        const formant2 = audioCtx.createBiquadFilter();
        formant2.type = 'peaking'; formant2.frequency.value = 600 + Math.random() * 400;
        formant2.gain.value = 6; formant2.Q.value = 1.5;
        osc.connect(formant).connect(formant2).connect(gain).connect(audioCtx.destination);

        const noiseDur = p.dur * 0.8;
        const bufSize = Math.floor(audioCtx.sampleRate * noiseDur);
        const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const nd = noiseBuf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) nd[i] = (Math.random() * 2 - 1);
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuf;
        const raspFilter = audioCtx.createBiquadFilter();
        raspFilter.type = 'bandpass'; raspFilter.frequency.value = 400 + Math.random() * 300; raspFilter.Q.value = 3;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.001, now);
        noiseGain.gain.linearRampToValueAtTime(vol * 0.3, now + noiseDur * 0.2);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + noiseDur);
        noise.connect(raspFilter).connect(noiseGain).connect(audioCtx.destination);

        if (enemyType === 'boss') {
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime((p.freq + freqRand) * 1.5, now);
            osc2.frequency.linearRampToValueAtTime((p.freqEnd + freqRand * 0.5) * 1.5, now + p.dur);
            const gain2 = audioCtx.createGain();
            gain2.gain.setValueAtTime(0.001, now);
            gain2.gain.linearRampToValueAtTime(vol * 0.6, now + p.dur * 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + p.dur);
            osc2.connect(formant);
            osc2.start(now); osc2.stop(now + p.dur + 0.01);
        }

        lfo.start(now); osc.start(now); noise.start(now);
        lfo.stop(now + p.dur + 0.01); osc.stop(now + p.dur + 0.01); noise.stop(now + noiseDur + 0.01);
        setTimeout(() => { activeGrowlCount = Math.max(0, activeGrowlCount - 1); }, p.dur * 1000 + 50);
    }

    // ── 4. Hit Impacts ──
    function playHitImpact(distance, isCritical) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const distFactor = 1 - Math.min(distance / 50, 0.85);

        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        const baseFreq = isCritical ? 180 : 120;
        osc.frequency.setValueAtTime(baseFreq + Math.random() * 30, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
        const oscGain = audioCtx.createGain();
        const baseVol = isCritical ? 0.20 : 0.12;
        oscGain.gain.setValueAtTime(baseVol * distFactor, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
        osc.connect(oscGain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.11);

        const slapDur = isCritical ? 0.06 : 0.035;
        const bufSize = Math.floor(audioCtx.sampleRate * slapDur);
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) { const env = 1 - (i / bufSize); data[i] = (Math.random() * 2 - 1) * env * env; }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;
        const nf = audioCtx.createBiquadFilter();
        nf.type = 'bandpass'; nf.frequency.value = isCritical ? 2500 : 1500; nf.Q.value = 1.2;
        const nGain = audioCtx.createGain();
        const noiseVol = isCritical ? 0.14 : 0.07;
        nGain.gain.setValueAtTime(noiseVol * distFactor, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + slapDur);
        noise.connect(nf).connect(nGain).connect(audioCtx.destination);
        noise.start(now); noise.stop(now + slapDur + 0.01);

        if (isCritical) {
            const ping = audioCtx.createOscillator();
            ping.type = 'sine';
            ping.frequency.setValueAtTime(1800 + Math.random() * 400, now);
            ping.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
            const pingGain = audioCtx.createGain();
            pingGain.gain.setValueAtTime(0.06 * distFactor, now);
            pingGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            ping.connect(pingGain).connect(audioCtx.destination);
            ping.start(now); ping.stop(now + 0.09);
        }
    }

    // ── 5. Death Groans ──
    function playDeathSound(enemyType, position) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const dist = camera.position.distanceTo(position);
        const distFactor = 1 - Math.min(dist / 40, 0.8);
        if (distFactor < 0.05) return;
        const profiles = {
            shambler: { freq: 90, freqEnd: 30, dur: 0.5, vol: 0.12, raspVol: 0.06 },
            runner:   { freq: 160, freqEnd: 50, dur: 0.35, vol: 0.10, raspVol: 0.08 },
            brute:    { freq: 65, freqEnd: 20, dur: 0.7, vol: 0.16, raspVol: 0.07 },
            tank:     { freq: 55, freqEnd: 18, dur: 0.8, vol: 0.16, raspVol: 0.06 },
            boss:     { freq: 45, freqEnd: 15, dur: 1.2, vol: 0.22, raspVol: 0.10 },
        };
        const p = profiles[enemyType] || profiles.shambler;
        const freqRand = (Math.random() - 0.5) * 20;

        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(p.freq + freqRand, now);
        osc.frequency.exponentialRampToValueAtTime(p.freqEnd, now + p.dur);
        const lfo = audioCtx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(6 + Math.random() * 4, now);
        lfo.frequency.linearRampToValueAtTime(1, now + p.dur);
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.setValueAtTime(25, now);
        lfoGain.gain.linearRampToValueAtTime(5, now + p.dur);
        lfo.connect(lfoGain).connect(osc.frequency);
        const gain = audioCtx.createGain();
        const vol = p.vol * distFactor;
        gain.gain.setValueAtTime(vol, now);
        gain.gain.setValueAtTime(vol * 0.9, now + p.dur * 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + p.dur);
        const formant = audioCtx.createBiquadFilter();
        formant.type = 'bandpass';
        formant.frequency.setValueAtTime(350 + Math.random() * 150, now);
        formant.frequency.linearRampToValueAtTime(120, now + p.dur);
        formant.Q.value = 3 + Math.random() * 2;
        osc.connect(formant).connect(gain).connect(audioCtx.destination);

        const raspDur = p.dur * 0.7;
        const bufSize = Math.floor(audioCtx.sampleRate * raspDur);
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) { const t = i / audioCtx.sampleRate; data[i] = (Math.random() * 2 - 1) * (Math.sin(t * 25) * 0.5 + 0.5); }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;
        const raspFilter = audioCtx.createBiquadFilter();
        raspFilter.type = 'bandpass';
        raspFilter.frequency.setValueAtTime(500, now);
        raspFilter.frequency.linearRampToValueAtTime(200, now + raspDur);
        raspFilter.Q.value = 4;
        const raspGain = audioCtx.createGain();
        raspGain.gain.setValueAtTime(p.raspVol * distFactor, now);
        raspGain.gain.exponentialRampToValueAtTime(0.001, now + raspDur);
        noise.connect(raspFilter).connect(raspGain).connect(audioCtx.destination);

        const thud = audioCtx.createOscillator();
        thud.type = 'sine';
        const thudDelay = p.dur * 0.6;
        thud.frequency.setValueAtTime(50, now + thudDelay);
        thud.frequency.exponentialRampToValueAtTime(25, now + thudDelay + 0.1);
        const thudGain = audioCtx.createGain();
        thudGain.gain.setValueAtTime(0.001, now);
        thudGain.gain.setValueAtTime(0.001, now + thudDelay);
        thudGain.gain.linearRampToValueAtTime(0.14 * distFactor, now + thudDelay + 0.01);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + thudDelay + 0.12);
        thud.connect(thudGain).connect(audioCtx.destination);

        if (enemyType === 'boss') {
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime((p.freq + freqRand) * 0.5, now);
            osc2.frequency.exponentialRampToValueAtTime(p.freqEnd * 0.5, now + p.dur);
            const gain2 = audioCtx.createGain();
            gain2.gain.setValueAtTime(vol * 0.5, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + p.dur);
            osc2.connect(formant).connect(gain2).connect(audioCtx.destination);
            osc2.start(now); osc2.stop(now + p.dur + 0.01);
        }

        lfo.start(now); osc.start(now); noise.start(now); thud.start(now);
        lfo.stop(now + p.dur + 0.01); osc.stop(now + p.dur + 0.01);
        noise.stop(now + raspDur + 0.01); thud.stop(now + thudDelay + 0.13);
    }

    // ── 6. Wave Klaxon ──
    function playWaveKlaxon(isBossWave) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const honks = isBossWave ? 3 : 2;
        const gap = 0.18;
        for (let i = 0; i < honks; i++) {
            const t = now + i * gap;
            const osc = audioCtx.createOscillator();
            osc.type = 'square';
            const freq = isBossWave ? 280 : 220;
            osc.frequency.setValueAtTime(freq, t);
            osc.frequency.setValueAtTime(freq * 0.95, t + 0.06);
            const gain = audioCtx.createGain();
            const vol = isBossWave ? 0.10 : 0.07;
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.015);
            gain.gain.setValueAtTime(vol, t + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.value = isBossWave ? 1200 : 900;
            osc.connect(filter).connect(gain).connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.14);
        }
        if (isBossWave) {
            const dropTime = now + honks * gap + 0.05;
            const sub = audioCtx.createOscillator();
            sub.type = 'sine';
            sub.frequency.setValueAtTime(120, dropTime);
            sub.frequency.exponentialRampToValueAtTime(30, dropTime + 0.3);
            const subGain = audioCtx.createGain();
            subGain.gain.setValueAtTime(0.15, dropTime);
            subGain.gain.exponentialRampToValueAtTime(0.001, dropTime + 0.3);
            sub.connect(subGain).connect(audioCtx.destination);
            sub.start(dropTime); sub.stop(dropTime + 0.31);
        }
    }

    // ── 7. Heartbeat ──
    function startHeartbeat() {
        if (heartbeatActive) return;
        heartbeatActive = true;
        function beat() {
            if (!audioCtx || !heartbeatActive) return;
            const now = audioCtx.currentTime;
            const hpPct = hp / CONFIG.player.health;
            const urgency = 1 - (hpPct / 0.3);
            const vol = 0.08 + urgency * 0.10;
            for (let i = 0; i < 2; i++) {
                const t = now + i * 0.12;
                const freq = i === 0 ? 45 : 35;
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, t);
                osc.frequency.exponentialRampToValueAtTime(20, t + 0.1);
                const gain = audioCtx.createGain();
                const beatVol = i === 0 ? vol : vol * 0.7;
                gain.gain.setValueAtTime(0.001, t);
                gain.gain.linearRampToValueAtTime(beatVol, t + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.11);
            }
        }
        beat();
        heartbeatInterval = setInterval(() => {
            if (!heartbeatActive) return;
            const hpPct = hp / CONFIG.player.health;
            const rate = hpPct < 0.15 ? 500 : 750;
            clearInterval(heartbeatInterval);
            beat();
            heartbeatInterval = setInterval(() => {
                if (!heartbeatActive) { clearInterval(heartbeatInterval); return; }
                beat();
            }, rate);
        }, 750);
    }
    function stopHeartbeat() {
        if (!heartbeatActive) return;
        heartbeatActive = false;
        if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
    }

    // ── 8. Pickup Chimes ──
    function playPickupChime(pickupType) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const profiles = {
            health:       { notes: [523, 659, 784],     dur: 0.08, gap: 0.06, vol: 0.09, type: 'sine',     ff: 4000 },
            pistol_ammo:  { notes: [440, 554],           dur: 0.06, gap: 0.05, vol: 0.07, type: 'triangle', ff: 3000 },
            shotgun_ammo: { notes: [392, 494],           dur: 0.06, gap: 0.05, vol: 0.07, type: 'triangle', ff: 2800 },
            rifle_ammo:   { notes: [494, 622],           dur: 0.06, gap: 0.05, vol: 0.07, type: 'triangle', ff: 3200 },
            max_ammo:     { notes: [330, 440, 554, 659], dur: 0.07, gap: 0.05, vol: 0.08, type: 'triangle', ff: 3500 },
            speed:        { notes: [587, 784, 988],      dur: 0.05, gap: 0.04, vol: 0.08, type: 'square',   ff: 2000 },
            nuke:         { notes: [262, 330, 392, 523], dur: 0.10, gap: 0.07, vol: 0.12, type: 'sawtooth', ff: 2500 },
        };
        const p = profiles[pickupType] || profiles.health;
        for (let i = 0; i < p.notes.length; i++) {
            const t = now + i * p.gap;
            const osc = audioCtx.createOscillator();
            osc.type = p.type; osc.frequency.setValueAtTime(p.notes[i], t);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(p.vol, t + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.001, t + p.dur);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.value = p.ff;
            osc.connect(filter).connect(gain).connect(audioCtx.destination);
            osc.start(t); osc.stop(t + p.dur + 0.01);
        }
        if (pickupType === 'nuke') {
            const sub = audioCtx.createOscillator();
            sub.type = 'sine';
            sub.frequency.setValueAtTime(60, now);
            sub.frequency.exponentialRampToValueAtTime(200, now + 0.4);
            const subGain = audioCtx.createGain();
            subGain.gain.setValueAtTime(0.12, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            sub.connect(subGain).connect(audioCtx.destination);
            sub.start(now); sub.stop(now + 0.41);
        }
    }

    // ── 10. Weapon Swap ──

    function playWeaponUp(weaponIndex) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const rack1 = audioCtx.createOscillator();
        rack1.type = 'sawtooth';
        rack1.frequency.setValueAtTime(600 + Math.random() * 100, now);
        rack1.frequency.exponentialRampToValueAtTime(250, now + 0.03);
        const rack1Gain = audioCtx.createGain();
        rack1Gain.gain.setValueAtTime(0.05, now);
        rack1Gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        const rack1Filter = audioCtx.createBiquadFilter();
        rack1Filter.type = 'bandpass'; rack1Filter.frequency.value = 2000; rack1Filter.Q.value = 2;
        rack1.connect(rack1Filter).connect(rack1Gain).connect(audioCtx.destination);
        rack1.start(now); rack1.stop(now + 0.05);

        const rack2 = audioCtx.createOscillator();
        rack2.type = 'square';
        const lockFreq = weaponIndex === 1 ? 500 : weaponIndex === 2 ? 900 : 700;
        rack2.frequency.setValueAtTime(lockFreq, now + 0.05);
        rack2.frequency.exponentialRampToValueAtTime(300, now + 0.07);
        const rack2Gain = audioCtx.createGain();
        rack2Gain.gain.setValueAtTime(0.001, now);
        rack2Gain.gain.setValueAtTime(0.07, now + 0.05);
        rack2Gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        const rack2Filter = audioCtx.createBiquadFilter();
        rack2Filter.type = 'highpass'; rack2Filter.frequency.value = 600;
        rack2.connect(rack2Filter).connect(rack2Gain).connect(audioCtx.destination);
        rack2.start(now); rack2.stop(now + 0.09);

        const ring = audioCtx.createOscillator();
        ring.type = 'sine';
        const ringFreq = weaponIndex === 1 ? 1400 : weaponIndex === 2 ? 2200 : 1800;
        ring.frequency.setValueAtTime(ringFreq, now + 0.05);
        const ringGain = audioCtx.createGain();
        ringGain.gain.setValueAtTime(0.001, now);
        ringGain.gain.setValueAtTime(0.03, now + 0.05);
        ringGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        ring.connect(ringGain).connect(audioCtx.destination);
        ring.start(now); ring.stop(now + 0.16);

        const bufSize = Math.floor(audioCtx.sampleRate * 0.06);
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize) * 0.4;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;
        const nFilter = audioCtx.createBiquadFilter();
        nFilter.type = 'lowpass'; nFilter.frequency.value = 1200;
        const nGain = audioCtx.createGain();
        nGain.gain.setValueAtTime(0.04, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        noise.connect(nFilter).connect(nGain).connect(audioCtx.destination);
        noise.start(now); noise.stop(now + 0.07);
    }

    // ── 11. Death Sting ──
    function playDeathSting() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = [220, 165, 110];
        const endNotes = [80, 55, 35];
        for (let i = 0; i < notes.length; i++) {
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(notes[i], now);
            osc.frequency.exponentialRampToValueAtTime(endNotes[i], now + 1.5);
            const gain = audioCtx.createGain();
            const vol = 0.08 - i * 0.015;
            gain.gain.setValueAtTime(vol, now);
            gain.gain.setValueAtTime(vol * 0.8, now + 0.8);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2000, now);
            filter.frequency.exponentialRampToValueAtTime(200, now + 1.5);
            osc.connect(filter).connect(gain).connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 1.81);
        }
        const sub = audioCtx.createOscillator();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(80, now);
        sub.frequency.exponentialRampToValueAtTime(15, now + 1.2);
        const subGain = audioCtx.createGain();
        subGain.gain.setValueAtTime(0.20, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        sub.connect(subGain).connect(audioCtx.destination);
        sub.start(now); sub.stop(now + 1.21);

        const hit = audioCtx.createOscillator();
        hit.type = 'square';
        hit.frequency.setValueAtTime(150, now);
        hit.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        const hitGain = audioCtx.createGain();
        hitGain.gain.setValueAtTime(0.18, now);
        hitGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        const distortion = audioCtx.createWaveShaper();
        const dcurve = new Float32Array(256);
        for (let i = 0; i < 256; i++) { const x = (i / 128) - 1; dcurve[i] = (Math.PI + 4) * x / (Math.PI + 4 * Math.abs(x)); }
        distortion.curve = dcurve;
        hit.connect(distortion).connect(hitGain).connect(audioCtx.destination);
        hit.start(now); hit.stop(now + 0.21);

        const tailDur = 2.0;
        const bufSize = Math.floor(audioCtx.sampleRate * tailDur);
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) { const env = Math.pow(1 - i / bufSize, 2); data[i] = (Math.random() * 2 - 1) * env; }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;
        const nFilter = audioCtx.createBiquadFilter();
        nFilter.type = 'bandpass';
        nFilter.frequency.setValueAtTime(3000, now);
        nFilter.frequency.exponentialRampToValueAtTime(800, now + tailDur);
        nFilter.Q.value = 2;
        const nGain = audioCtx.createGain();
        nGain.gain.setValueAtTime(0.06, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + tailDur);
        noise.connect(nFilter).connect(nGain).connect(audioCtx.destination);
        noise.start(now); noise.stop(now + tailDur + 0.01);

        const flatline = audioCtx.createOscillator();
        flatline.type = 'sine'; flatline.frequency.value = 1000;
        const flatGain = audioCtx.createGain();
        flatGain.gain.setValueAtTime(0.001, now + 0.5);
        flatGain.gain.linearRampToValueAtTime(0.05, now + 0.7);
        flatGain.gain.setValueAtTime(0.05, now + 1.5);
        flatGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        flatline.connect(flatGain).connect(audioCtx.destination);
        flatline.start(now + 0.5); flatline.stop(now + 2.51);
    }
    // ═══════════════════════════════════════

    // ═══════════════════════════════════════
    // ASSET LOADING
    // ═══════════════════════════════════════
    const gltfLoader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    const models = {};
    const anims = {};

    function updateLoadBar() {
        loaded++;
        document.getElementById('loading-fill').style.width =
            (loaded / TOTAL_ASSETS * 100) + '%';
    }

    function loadZombie(name) {
        return new Promise(resolve => {
            gltfLoader.load(`Zombies/${name}.glb`, gltf => {
                gltf.scene.traverse(c => {
                    if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
                });
                models[name] = gltf.scene;
                const box = new THREE.Box3().setFromObject(gltf.scene);
                const center = box.getCenter(new THREE.Vector3());
                gltf.scene.position.set(-center.x, 0, -center.z);
                anims[name] = gltf.animations;
                updateLoadBar();
                resolve();
            }, undefined, () => {
                console.warn(`Missing: ${name}.glb`);
                updateLoadBar();
                resolve();
            });
        });
    }

    function loadWeapon(name) {
        return new Promise(resolve => {
            gltfLoader.load(`${name}.glb`, gltf => {
                const model = gltf.scene;
                model.traverse(c => {
                    if (c.isMesh) {
                        c.castShadow = false;
                        c.receiveShadow = false;
                        c.material = c.material.clone();
                        c.material.fog = false;
                    }
                });
                weaponGLBs[name] = model;
                updateLoadBar();
                resolve();
            }, undefined, () => {
                console.warn(`Missing weapon: ${name}.glb`);
                updateLoadBar();
                resolve();
            });
        });
    }

                console.log(`${name}: ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`);
            }
        }

        equipWeapon(0);
        state = 'menu';
        document.getElementById('start-text').textContent = 'TAP TO START';

        fetchLeaderboard();

    init();

    // ═══════════════════════════════════════
    // FIRST-PERSON WEAPON SYSTEM
    // ═══════════════════════════════════════
    const weaponHolder = new THREE.Group();
    camera.add(weaponHolder);

    const WEAPON_NAMES = ['pistol', 'shotgun', 'rifle'];

    const FP = {
        pistol:  { scale: 0.18, rotY: -Math.PI / 2 },
        shotgun: { scale: 0.60, rotY: -Math.PI / 2 },
        rifle:   { scale: 0.55, rotY: -Math.PI / 2 },
    };

    const REST_POS = new THREE.Vector3(0.2, -0.25, -0.45);
    const REST_ROT_BASE = new THREE.Vector3(-0.08, -0.08, 0.03);
    const AIM_POS  = new THREE.Vector3(0.0, -0.18, -0.38);
    const AIM_ROT_BASE  = new THREE.Vector3(0, 0, 0);

    let wpnLerp = 0;
    let wpnState = 'rest';
    let lastFiredAt = 0;
    let recoilKick = 0;
    let wpnBobTime = 0;
    let pendingSwap = -1;

    const RAISE_SPD    = 10;
    const LOWER_SPD    = 5;
    const RECOIL_AMT   = 0.035;
    const RECOIL_RECOVER = 8;
    const HOLD_TIME    = 0.45;

    const activeCasings = [];
    const casingGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.03, 6);
    const casingMat = new THREE.MeshStandardMaterial({
        color: 0xccaa44, metalness: 0.8, roughness: 0.3
    });
    const CASING_Y_OFFSET = { pistol: 0.07, shotgun: 0, rifle: 0 };

    const mFlashCanvas = document.createElement('canvas');
    mFlashCanvas.width = 64;
    mFlashCanvas.height = 64;
    const mfCtx = mFlashCanvas.getContext('2d');
    const grad = mfCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,200,1)');
    grad.addColorStop(0.3, 'rgba(255,180,50,0.8)');
    grad.addColorStop(0.7, 'rgba(255,100,0,0.3)');
    grad.addColorStop(1, 'rgba(255,60,0,0)');
    mfCtx.fillStyle = grad;
    mfCtx.fillRect(0, 0, 64, 64);

    const mFlashTex = new THREE.CanvasTexture(mFlashCanvas);
    const mFlashSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: mFlashTex, transparent: true,
        blending: THREE.AdditiveBlending, opacity: 0.9
    }));
    mFlashSprite.scale.set(0.08, 0.08, 0.08);
    mFlashSprite.visible = false;
    const MUZZLE_OFFSETS = [
        { x: 0, y: 0.06, z: -0.30 },
        { x: 0, y: 0.04, z: -0.95 },
        { x: 0, y: 0.07, z: -0.90 }
    ];
    mFlashSprite.position.set(0, 0.02, -0.35);
    weaponHolder.add(mFlashSprite);
    let mFlashVis = 0;

    function equipWeapon(index) {
        const name = WEAPON_NAMES[index];
        const model = weaponGLBs[name];
        if (!model) return;

        while (weaponHolder.children.length > 1) {
            const child = weaponHolder.children[0];
            if (child === mFlashSprite) {
                if (weaponHolder.children.length > 1)
                    weaponHolder.remove(weaponHolder.children[1]);
                else break;
            } else {
                weaponHolder.remove(child);
            }
        }

        const wpn = model.clone();
        const cfg = FP[name];
        wpn.scale.setScalar(cfg.scale);
        wpn.rotation.y = cfg.rotY;

        const box = new THREE.Box3().setFromObject(wpn);
        const center = box.getCenter(new THREE.Vector3());
        wpn.position.sub(center);

        weaponHolder.add(wpn);
        weaponHolder.position.copy(REST_POS);
        weaponHolder.rotation.set(REST_ROT_BASE.x, REST_ROT_BASE.y, REST_ROT_BASE.z);
    }

    function swapWeapon(newIndex) {
        if (newIndex === curWeapon) return;
        if (wpnState === 'swapDown' || wpnState === 'swapUp') return;
        pendingFire = false;
        pendingSwap = newIndex;
        wpnState = 'swapDown';
        playWeaponDown();
    }

    function triggerFire() {
        if (pendingFire) return;
        pendingFire = true;
        if (wpnState === 'rest' || wpnState === 'lowering') {
            wpnState = 'raising';
        }
    }

    function executeShot() {
        playGunshot(curWeapon);
        lastFiredAt = performance.now() / 1000;
        recoilKick = RECOIL_AMT;

        const mPos = MUZZLE_OFFSETS[curWeapon];
        mFlashSprite.position.set(mPos.x, mPos.y, mPos.z);
        mFlashSprite.visible = true;
        mFlashSprite.material.rotation = Math.random() * Math.PI * 2;
        const FLASH_SIZES = [0.20, 0.32, 0.22];
        const flashSize = FLASH_SIZES[curWeapon] + Math.random() * 0.08;
        mFlashSprite.scale.set(flashSize, flashSize, flashSize);
        mFlashVis = 0.06;

        spawnCasing();
    }

    function spawnCasing() {
        const casing = new THREE.Mesh(casingGeo, casingMat);
        const worldPos = new THREE.Vector3();
        weaponHolder.getWorldPosition(worldPos);
        casing.position.copy(worldPos);
        casing.position.y += CASING_Y_OFFSET[WEAPON_NAMES[curWeapon]] || 0;

        scene.add(casing);

        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const up = new THREE.Vector3(0, 1, 0);
        const vel = new THREE.Vector3();
        vel.addScaledVector(right, 1.5 + Math.random());
        vel.addScaledVector(up, 1.5 + Math.random() * 1.5);
        vel.z += (Math.random() - 0.5) * 0.3;

        activeCasings.push({
            mesh: casing, velocity: vel,
            spin: new THREE.Vector3(
                Math.random() * 12, Math.random() * 12, Math.random() * 12
            ),
            age: 0
        });
    }

    function updateCrosshairADS(t) {
        const ch = document.getElementById('crosshair');
        const size = 30 - (t * 16);
        ch.style.width = size + 'px';
        ch.style.height = size + 'px';
    }

    function updateWeaponSystem(dt) {
        const now = performance.now() / 1000;
        const timeSinceShot = now - lastFiredAt;

        const raiseSpeed = pendingFire ? RAISE_SPD * 3 : RAISE_SPD;

        switch (wpnState) {
            case 'rest':
                wpnLerp = Math.max(0, wpnLerp - LOWER_SPD * dt);
                break;
            case 'raising':
                wpnLerp = Math.min(1, wpnLerp + raiseSpeed * dt);
                if (wpnLerp >= 1) wpnState = 'aimed';
                break;
            case 'aimed':
                if (timeSinceShot > HOLD_TIME && !fireHeld) wpnState = 'lowering';
                break;
            case 'lowering':
                wpnLerp = Math.max(0, wpnLerp - LOWER_SPD * dt);
                if (wpnLerp <= 0) wpnState = 'rest';
                break;
            case 'swapDown':
                wpnLerp = Math.max(-0.5, wpnLerp - RAISE_SPD * dt);
                if (wpnLerp <= -0.5) {
                    curWeapon = pendingSwap;
                    pendingSwap = -1;
                    equipWeapon(curWeapon);
                    updateWeaponHUD();
                    wpnState = 'swapUp';
                    playWeaponUp(curWeapon);
                }
                break;
            case 'swapUp':
                wpnLerp = Math.min(0, wpnLerp + RAISE_SPD * dt);
                if (wpnLerp >= 0) {
                    wpnLerp = 0;
                    wpnState = 'rest';
                }
                break;
        }

        if (pendingFire && wpnLerp >= 0.95) {
            pendingFire = false;
            executeShot();
        }

        if (mFlashVis > 0) {
            mFlashVis -= dt;
            if (mFlashVis <= 0) {
                mFlashVis = 0;
                mFlashSprite.visible = false;
            }
        }

        recoilKick = Math.max(0, recoilKick - RECOIL_RECOVER * dt);

        const adsTarget = isADS ? 1 : 0;
        adsAmount += (adsTarget - adsAmount) * Math.min(1, ADS_LERP_SPEED * dt);

        const baseFov = isSprinting ? SPRINT_FOV : BASE_FOV;
        const targetFOV = baseFov + (ADS_FOV - baseFov) * adsAmount;
        camera.fov += (targetFOV - camera.fov) * Math.min(1, 10 * dt);
        camera.updateProjectionMatrix();

        const effectiveAim = Math.max(Math.max(0, Math.min(1, wpnLerp)), adsAmount);

        const bobMoveAmp = isMoving ? 0.004 : 0.001;
        const bobAmp = bobMoveAmp * (1 - adsAmount * 0.7);
        wpnBobTime += dt * (isMoving ? 3 : 1);
        const bobX = Math.sin(wpnBobTime * 1.5) * bobAmp;
        const bobY = Math.sin(wpnBobTime * 2.0) * bobAmp;

        const t = effectiveAim;
        const px = REST_POS.x + (AIM_POS.x - REST_POS.x) * t + bobX;
        const py = REST_POS.y + (AIM_POS.y - REST_POS.y) * t + bobY + recoilKick * 0.5;
        const pz = REST_POS.z + (AIM_POS.z - REST_POS.z) * t + recoilKick;

        weaponHolder.position.set(px, py, pz);

        const rx = REST_ROT_BASE.x + (AIM_ROT_BASE.x - REST_ROT_BASE.x) * t - recoilKick * 2;
        const ry = REST_ROT_BASE.y + (AIM_ROT_BASE.y - REST_ROT_BASE.y) * t;
        const rz = REST_ROT_BASE.z + (AIM_ROT_BASE.z - REST_ROT_BASE.z) * t;
        weaponHolder.rotation.set(rx, ry, rz);

        updateCrosshairADS(t);
    }

    function updateCasings(dt) {
        for (let i = activeCasings.length - 1; i >= 0; i--) {
            const c = activeCasings[i];
            c.age += dt;
            c.velocity.y -= 9.8 * dt;
            c.mesh.position.addScaledVector(c.velocity, dt);
            c.mesh.rotation.x += c.spin.x * dt;
            c.mesh.rotation.z += c.spin.z * dt;

            if (c.mesh.position.y < 0.02) {
                c.mesh.position.y = 0.02;
                c.velocity.y *= -0.3;
                c.velocity.x *= 0.5;
                c.velocity.z *= 0.5;
            }

            if (c.age >= 1.2) {
                scene.remove(c.mesh);
                activeCasings.splice(i, 1);
            }
        }
    }
     // ═══════════════════════════════════════

    function spawnDamageNumber(position, damage, isCritical) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.font = isCritical ? 'bold 90px Arial' : 'bold 64px Arial';
        ctx.fillStyle = isCritical ? '#ff2222' : '#ffdd00';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const text = Math.round(damage).toString();
        ctx.strokeText(text, 128, 64);
        ctx.fillText(text, 128, 64);

        const texture = new THREE.CanvasTexture(canvas);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: texture, transparent: true, depthTest: false
        }));
        sprite.position.copy(position);
        sprite.position.x += (Math.random() - 0.5) * 0.5;
        sprite.scale.set(isCritical ? 2.2 : 1.5, isCritical ? 1.1 : 0.75, 1);
        scene.add(sprite);
        activeDamageNumbers.push({ sprite, life: 1.0, age: 0 });
    }

    function updateDamageNumbers(dt) {
        for (let i = activeDamageNumbers.length - 1; i >= 0; i--) {
            const dn = activeDamageNumbers[i];
            dn.age += dt;
            dn.sprite.position.y += 2.5 * dt;
            dn.sprite.material.opacity = 1 - (dn.age / dn.life);
            if (dn.age >= dn.life) {
                scene.remove(dn.sprite);
                dn.sprite.material.map.dispose();
                dn.sprite.material.dispose();
                activeDamageNumbers.splice(i, 1);
            }
        }
    }

    // ═══════════════════════════════════════
    // AIM CONTROLS
    // ═══════════════════════════════════════
    let pitch = 0, yaw = 0;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let aimTouchId = null, aimX = 0, aimY = 0;

    if (!isMobile) {
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement !== renderer.domElement) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-1.2, Math.min(1.2, pitch));
        });
    }

    renderer.domElement.addEventListener('touchstart', e => {
        const t = e.changedTouches[0];
        if (aimTouchId === null) {
            aimTouchId = t.identifier;
            aimX = t.clientX; aimY = t.clientY;
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === aimTouchId) {
                yaw -= (t.clientX - aimX) * 0.004;
                pitch -= (t.clientY - aimY) * 0.004;
                pitch = Math.max(-1.2, Math.min(1.2, pitch));
                aimX = t.clientX; aimY = t.clientY;
            }
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === aimTouchId) aimTouchId = null;
        }
    }, { passive: true });

    // ═══════════════════════════════════════
    // SHOOTING — semi-auto gated, ADS spread
    // ═══════════════════════════════════════
    const raycaster = new THREE.Raycaster();
    raycaster.far = 80;

    function shoot() {
        if (state !== 'playing') return;
        const now = performance.now() / 1000;
        const w = CONFIG.weapons[curWeapon];
        if (now - lastShotTime < w.rate) return;
        if (ammo[curWeapon] <= 0) { playDryFire(); return; }
        lastShotTime = now;
        if (ammo[curWeapon] !== Infinity) ammo[curWeapon]--;
        updateAmmoHUD();

        triggerFire();

        const dir = new THREE.Vector3(0, 0, -1);
        dir.applyEuler(camera.rotation);

        for (let p = 0; p < w.pellets; p++) {
            const d = dir.clone();
            if (w.spread > 0) {
                const spreadMult = adsAmount > 0.5 ? ADS_SPREAD_MULT : 1.0;
                d.x += (Math.random() - 0.5) * w.spread * spreadMult;
                d.y += (Math.random() - 0.5) * w.spread * spreadMult;
                d.normalize();
            }
            raycaster.set(camera.position, d);

            const meshes = [];
            activeEnemies.forEach(e => {
                if (e.dead) return;
                e.group.traverse(c => { if (c.isMesh) meshes.push(c); });
            });

            const hits = raycaster.intersectObjects(meshes, false);
            if (hits.length > 0) {
                const hitObj = hits[0].object;
                for (const enemy of activeEnemies) {
                    if (enemy.dead) continue;
                    let found = false;
                    enemy.group.traverse(c => { if (c === hitObj) found = true; });
                    if (found) {
                        damageEnemy(enemy, w.damage, hits[0].point);
                        break;
                    }
                }
            }

            const puMeshes = [];
            activePowerups.forEach(pu => {
                pu.group.traverse(c => { if (c.isMesh) puMeshes.push(c); });
            });
            const puHits = raycaster.intersectObjects(puMeshes, false);
            if (puHits.length > 0) {
                const hitMesh = puHits[0].object;
                for (let pi = activePowerups.length - 1; pi >= 0; pi--) {
                    let found = false;
                    activePowerups[pi].group.traverse(c => { if (c === hitMesh) found = true; });
                    if (found) {
                        collectPowerup(activePowerups[pi], pi);
                        break;
                    }
                }
            }
        }
    }

    const POWERUP_TYPES = [
        { id: 'pistol_ammo', weight: 20, create: () => { const g = createBulletModel(0xffcc44, 0.2, 0.04); addGlow(g, 0xffcc44); return g; } },
        { id: 'rifle_ammo',  weight: 20, create: () => { const g = createBulletModel(0xff8833, 0.3, 0.05); addGlow(g, 0xff8833); return g; } },
        { id: 'shotgun_ammo',weight: 15, create: () => { const g = createShotgunShellModel(); addGlow(g, 0xff3333); return g; } },
        { id: 'health',      weight: 25, create: () => { const g = createMedkitModel(); addGlow(g, 0x39FF14); return g; } },
        { id: 'nuke',        weight: 5,  create: () => { const g = createNukeModel(); addGlow(g, 0x39FF14); return g; } },
        { id: 'speed',       weight: 8,  create: () => { const g = createSpeedModel(); addGlow(g, 0x4488ff); return g; } },
        { id: 'max_ammo',    weight: 7,  create: () => { const g = createMaxAmmoModel(); addGlow(g, 0xaa44ff); return g; } },
    ];

    const TOTAL_PU_WEIGHT = POWERUP_TYPES.reduce((s, p) => s + p.weight, 0);

    function pickPowerupType() {
        let r = Math.random() * TOTAL_PU_WEIGHT;
        for (const pu of POWERUP_TYPES) {
            r -= pu.weight;
            if (r <= 0) return pu;
        }
        return POWERUP_TYPES[0];
    }

    function collectPowerup(pu, index) {
        playPickupChime(pu.type);
        switch (pu.type) {
            case 'health':
                hp = Math.min(hp + 25, CONFIG.player.health);
                updateHealthHUD();
                break;
            case 'pistol_ammo':
                score += 50;
                updateHUD();
                break;
            case 'rifle_ammo':
                ammo[2] += 15;
                updateAmmoHUD();
                break;
            case 'shotgun_ammo':
                ammo[1] += 6;
                updateAmmoHUD();
                break;
            case 'nuke':
                for (const e of activeEnemies) {
                    if (!e.dead && e.type !== 'boss') {
                        killEnemy(e);
                    }
                }
                screenShake = 0.4;
                spawnShockwave(camera.position.clone());
                break;
            case 'speed':
                speedBoostTimer = 8;
                break;
            case 'max_ammo':
                ammo[1] = maxAmmo[1];
                ammo[2] = maxAmmo[2];
                updateAmmoHUD();
                break;
        }
        scene.remove(pu.group);
        activePowerups.splice(index, 1);
    }

    function spawnPowerup(pos) {
        const puType = pickPowerupType();
        const group = puType.create();
        group.position.copy(pos);
        group.position.y = 0.3;
        group.scale.setScalar(2.0);
        scene.add(group);
        activePowerups.push({ group, type: puType.id, life: 15 });
    }

    function updatePowerups(dt) {
        if (speedBoostTimer > 0) speedBoostTimer -= dt;

        for (let i = activePowerups.length - 1; i >= 0; i--) {
            const p = activePowerups[i];
            p.life -= dt;
            p.group.rotation.y += dt * 2;
            p.group.position.y = 0.3 + Math.sin(performance.now() / 1000 * 2 + i) * 0.08;

            const dist = camera.position.distanceTo(p.group.position);
            if (dist < 1.5) {
                collectPowerup(p, i);
                continue;
            }

            if (p.life <= 3) {
                p.group.visible = Math.sin(p.life * 10) > 0;
            }

            if (p.life <= 0) {
                scene.remove(p.group);
                activePowerups.splice(i, 1);
            }
        }
    }

            color: 0x39FF14, transparent: true, opacity: 0.8, side: THREE.DoubleSide
        });

        ring.rotation.x = -Math.PI / 2;
        scene.add(ring);
        activeShockwaves.push({ mesh: ring, age: 0 });
    }

    function updateShockwaves(dt) {
        for (let i = activeShockwaves.length - 1; i >= 0; i--) {
            const sw = activeShockwaves[i];
            sw.age += dt;
            const s = 1 + sw.age * 40;
            sw.mesh.scale.set(s, s, s);
            sw.mesh.material.opacity = Math.max(0, 0.8 - sw.age * 2);
            if (sw.age > 0.5) {
                scene.remove(sw.mesh);
                sw.mesh.geometry.dispose();
                sw.mesh.material.dispose();
                activeShockwaves.splice(i, 1);
            }
        }
    }

}
if (!walkAction && clips.length > 0) {
