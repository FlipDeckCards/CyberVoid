<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEADZONE — Zombies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }

        #blocker {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #blocker h1 {
            font-size: 4rem; color: #39FF14;
            text-transform: uppercase; letter-spacing: 12px;
            text-shadow: 0 0 40px rgba(57,255,20,0.5);
            margin-bottom: 10px;
        }
        #blocker .mode {
            font-size: 1.4rem; color: #ff4444;
            letter-spacing: 6px; text-transform: uppercase;
            margin-bottom: 40px;
        }
        #blocker .start-text {
            font-size: 1rem; color: #888;
            letter-spacing: 4px; text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }
        #loading-bar {
            width: 200px; height: 4px; background: #222;
            border-radius: 2px; margin-top: 20px; overflow: hidden;
        }
        #loading-fill {
            width: 0%; height: 100%; background: #39FF14;
            transition: width 0.3s;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
            font-family: 'Courier New', monospace;
            display: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
            transition: transform 0.1s, opacity 0.1s;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.85);
        }
        #crosshair::before {
            top: 50%; left: 0; width: 100%; height: 2px;
            transform: translateY(-50%);
        }
        #crosshair::after {
            top: 0; left: 50%; width: 2px; height: 100%;
            transform: translateX(-50%);
        }

        .hud-top {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 20px; color: #39FF14; font-size: 0.85rem;
            letter-spacing: 2px;
        }
        #health-bar-bg {
            position: absolute; bottom: 60px; left: 20px;
            width: 200px; height: 8px; background: #333;
            border-radius: 4px; overflow: hidden;
        }
        #health-bar {
            width: 100%; height: 100%; background: #39FF14;
            transition: width 0.3s;
        }
        #health-label {
            position: absolute; bottom: 72px; left: 20px;
            color: #39FF14; font-size: 0.7rem; letter-spacing: 2px;
        }
        #ammo-display {
            position: absolute; bottom: 60px; left: 240px;
            color: #39FF14; font-size: 1.4rem;
        }
        #ammo-label {
            position: absolute; bottom: 72px; left: 240px;
            color: #666; font-size: 0.6rem; letter-spacing: 2px;
        }

        #weapon-bar {
            position: absolute; bottom: 15px; right: 20px;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: auto;
        }
        .weapon-slot {
            padding: 6px 12px; background: rgba(0,0,0,0.6);
            border: 1px solid #333; border-radius: 4px;
            color: #888; font-size: 0.65rem; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; text-align: right;
        }
        .weapon-slot.active {
            border-color: #39FF14; color: #39FF14;
            background: rgba(57,255,20,0.1);
        }

        #wave-announce {
            position: fixed; top: 20%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 3rem; color: #ff4444;
            letter-spacing: 8px; text-transform: uppercase;
            text-shadow: 0 0 40px rgba(255,68,68,0.5);
            z-index: 60; display: none; pointer-events: none;
        }

        /* Boss health bar */
        #boss-bar {
            position: absolute; top: 45px; left: 50%;
            transform: translateX(-50%); width: 300px;
            display: none; pointer-events: none;
        }
        #boss-name {
            color: #ff4444; font-size: 0.7rem; text-align: center;
            letter-spacing: 3px; margin-bottom: 4px;
        }
        #boss-bar-bg {
            width: 100%; height: 8px; background: #333;
            border-radius: 4px; overflow: hidden;
        }
        #boss-health-fill {
            width: 100%; height: 100%; background: #ff4444;
            transition: width 0.3s;
        }

        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #game-over h1 {
            font-size: 3rem; color: #ff4444;
            letter-spacing: 8px; margin-bottom: 20px;
        }
        #game-over .stats {
            color: #888; font-size: 1rem;
            letter-spacing: 3px; margin-bottom: 30px;
            text-align: center; line-height: 2;
        }
        #game-over .restart {
            color: #39FF14; font-size: 0.9rem;
            letter-spacing: 4px; text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }

        .threat-edge {
            position: absolute; background: #ff4444; opacity: 0;
            transition: opacity 0.1s; pointer-events: none;
            box-shadow: 0 0 20px rgba(255,68,68,0.7);
            border-radius: 2px;
        }
        #threat-left   { top: 25%; left: 0; width: 3px; height: 50%; }
        #threat-right  { top: 25%; right: 0; width: 3px; height: 50%; }
        #threat-top    { top: 0; left: 25%; width: 50%; height: 3px; }
        #threat-bottom { bottom: 70px; left: 25%; width: 50%; height: 3px; }

        @media (max-width: 768px) {
            #blocker h1 { font-size: 2.5rem; letter-spacing: 8px; }
            #blocker .mode { font-size: 1rem; }
            #health-bar-bg { width: 120px; }
            #ammo-display { left: 160px; }
            #ammo-label { left: 160px; }
            #wave-announce { font-size: 3rem; }
            #boss-bar { width: 200px; }
        }
    </style>
</head>
<body>
    <div id="blocker">
        <h1>DEADZONE</h1>
        <div class="mode">Zombies</div>
        <div class="start-text" id="start-text">Loading...</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div class="hud-top">
            <div id="wave-display">WAVE 1</div>
            <div id="score-display">0</div>
            <div id="kills-display">KILLS: 0</div>
        </div>
        <div id="boss-bar">
            <div id="boss-name">TITAN</div>
            <div id="boss-bar-bg"><div id="boss-health-fill"></div></div>
        </div>
        <div id="health-label">HEALTH</div>
        <div id="health-bar-bg"><div id="health-bar"></div></div>
        <div id="ammo-display">∞</div>
        <div id="ammo-label">AMMO</div>
        <div id="weapon-bar">
            <div class="weapon-slot active" data-weapon="0">1 PISTOL</div>
            <div class="weapon-slot" data-weapon="1">2 SHOTGUN</div>
            <div class="weapon-slot" data-weapon="2">3 RIFLE</div>
        </div>
        <div class="threat-edge" id="threat-left"></div>
        <div class="threat-edge" id="threat-right"></div>
        <div class="threat-edge" id="threat-top"></div>
        <div class="threat-edge" id="threat-bottom"></div>
    </div>

    <div id="wave-announce"></div>

    <div id="game-over">
        <h1>DEAD</h1>
        <div class="stats" id="final-stats"></div>
        <div class="restart">TAP TO RESTART</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

    // ═══════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════
    const CONFIG = {
        player: { height: 1.6, health: 100 },
        weapons: [
            { name: 'Pistol',  damage: 25, rate: 0.3,  ammo: Infinity, spread: 0,    pellets: 1, auto: false },
            { name: 'Shotgun', damage: 15, rate: 0.8,  ammo: 8,        spread: 0.08, pellets: 6, auto: false },
            { name: 'Rifle',   damage: 35, rate: 0.12, ammo: 30,       spread: 0.02, pellets: 1, auto: true  }
        ],
        enemies: {
            shambler: { speed: 1.8, health: 100, damage: 10, points: 10,  scale: 1.2 },
            runner:   { speed: 4.5, health: 60,  damage: 8,  points: 25,  scale: 1.0 },
            brute:    { speed: 1.3, health: 180, damage: 25, points: 50,  scale: 1.5 },
            tank:     { speed: 1.5, health: 250, damage: 20, points: 40,  scale: 1.4 },
            boss:     { speed: 1.0, health: 800, damage: 30, points: 500, scale: 2.5 }
        },
        spawnRadius: 60,
        meleeRange: 2.0,
        despawnTime: 3,
        dropChance: 0.3
    };

    // ═══════════════════════════════════════
    // GAME STATE
    // ═══════════════════════════════════════
    let state = 'loading';
    let score = 0, kills = 0, wave = 0;
    let hp = CONFIG.player.health;
    let curWeapon = 0;
    let ammo = [Infinity, 8, 30];
    let maxAmmo = [Infinity, 8, 30];
    let lastShotTime = 0;
    let waveEnemiesLeft = 0;
    let waveTimer = 0;
    let betweenWaves = false;
    let fireHeld = false;
    let fireTouchId = null;
    let pendingFire = false;
    let hasFiredThisClick = false;
    let activeBoss = null;
    let screenShake = 0;
    let speedBoostTimer = 0;

    const activeEnemies = [];
    const activePowerups = [];
    const activeDamageNumbers = [];
    const activeShockwaves = [];
    const clock = new THREE.Clock();

    // ═══════════════════════════════════════
    // SCENE
    // ═══════════════════════════════════════
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    scene.fog = new THREE.FogExp2(0x0d1117, 0.006);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, CONFIG.player.height, 0);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // ═══════════════════════════════════════
    // LIGHTING — bright floodlit arena
    // ═══════════════════════════════════════
    scene.add(new THREE.AmbientLight(0xffffff, 2.0));

    const moon = new THREE.DirectionalLight(0x6699bb, 1.5);
    moon.position.set(-10, 20, -10);
    moon.castShadow = true;
    moon.shadow.mapSize.set(2048, 2048);
    const sc = moon.shadow.camera;
    sc.near = 0.5; sc.far = 60;
    sc.left = sc.bottom = -30;
    sc.right = sc.top = 30;
    scene.add(moon);

    const glow = new THREE.PointLight(0x99FF14, 1.5, 40);
    glow.position.set(0, 3, 0);
    scene.add(glow);

    const floodPositions = [
        [-35, 12, -35], [35, 12, -35], [-35, 12, 35], [35, 12, 35]
    ];
    for (const pos of floodPositions) {
        const fl = new THREE.SpotLight(0xffeedd, 3.0, 80, Math.PI / 4, 0.5, 1);
        fl.position.set(pos[0], pos[1], pos[2]);
        fl.target.position.set(0, 0, 0);
        scene.add(fl);
        scene.add(fl.target);

        const pole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.15, 0.15, 12, 6),
            new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.3 })
        );
        pole.position.set(pos[0], 6, pos[2]);
        scene.add(pole);
    }

    // ═══════════════════════════════════════
    // ARENA ENVIRONMENT
    // ═══════════════════════════════════════
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const gridHelper = new THREE.GridHelper(80, 40, 0x333333, 0x222222);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    const wallMat = new THREE.MeshStandardMaterial({
        color: 0x2a2a2a, roughness: 0.8, metalness: 0.2
    });
    const wallGeo = new THREE.BoxGeometry(80, 4, 0.5);
    const wallPositions = [
        { pos: [0, 2, -40], rot: 0 },
        { pos: [0, 2, 40], rot: 0 },
        { pos: [-40, 2, 0], rot: Math.PI / 2 },
        { pos: [40, 2, 0], rot: Math.PI / 2 }
    ];
    for (const w of wallPositions) {
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(w.pos[0], w.pos[1], w.pos[2]);
        wall.rotation.y = w.rot;
        wall.receiveShadow = true;
        scene.add(wall);
    }

    const skyGeo = new THREE.SphereGeometry(150, 32, 32);
    const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
            topColor: { value: new THREE.Color(0x0a0a15) },
            bottomColor: { value: new THREE.Color(0x1a1a2e) }
        },
        vertexShader: `
            varying vec3 vWorldPosition;
            void main() {
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPos.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform vec3 topColor;
            uniform vec3 bottomColor;
            varying vec3 vWorldPosition;
            void main() {
                float h = normalize(vWorldPosition).y;
                gl_FragColor = vec4(mix(bottomColor, topColor, max(h, 0.0)), 1.0);
            }
        `
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // ═══════════════════════════════════════
    // ASSET LOADING
    // ═══════════════════════════════════════
    const gltfLoader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
    gltfLoader.setDRACOLoader(dracoLoader);
    const models = {};
    const anims = {};
    const weaponGLBs = {};
    let loaded = 0;
    const TOTAL_ASSETS = 8;

    function updateLoadBar() {
        loaded++;
        document.getElementById('loading-fill').style.width =
            (loaded / TOTAL_ASSETS * 100) + '%';
    }

    function loadZombie(name) {
        return new Promise(resolve => {
            gltfLoader.load(`Zombies/${name}.glb`, gltf => {
                gltf.scene.traverse(c => {
                    if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
                });
                models[name] = gltf.scene;
                const box = new THREE.Box3().setFromObject(gltf.scene);
                const center = box.getCenter(new THREE.Vector3());
                gltf.scene.position.set(-center.x, 0, -center.z);
                anims[name] = gltf.animations;
                updateLoadBar();
                resolve();
            }, undefined, () => {
                console.warn(`Missing: ${name}.glb`);
                updateLoadBar();
                resolve();
            });
        });
    }

    function loadWeapon(name) {
        return new Promise(resolve => {
            gltfLoader.load(`${name}.glb`, gltf => {
                const model = gltf.scene;
                model.traverse(c => {
                    if (c.isMesh) {
                        c.castShadow = false;
                        c.receiveShadow = false;
                        c.material = c.material.clone();
                        c.material.fog = false;
                    }
                });
                weaponGLBs[name] = model;
                updateLoadBar();
                resolve();
            }, undefined, () => {
                console.warn(`Missing weapon: ${name}.glb`);
                updateLoadBar();
                resolve();
            });
        });
    }

    async function init() {
        await Promise.all([
            loadZombie('shambler'),
            loadZombie('runner'),
            loadZombie('brute'),
            loadZombie('tank'),
            loadZombie('boss'),
            loadWeapon('pistol'),
            loadWeapon('shotgun'),
            loadWeapon('rifle')
        ]);

        for (const [name, model] of Object.entries(models)) {
            if (model) {
                const box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3();
                box.getSize(size);
                console.log(`${name}: ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`);
            }
        }

        equipWeapon(0);
        state = 'menu';
        document.getElementById('start-text').textContent = 'TAP TO START';
        document.getElementById('loading-bar').style.display = 'none';
    }
    init();

    // ═══════════════════════════════════════
    // FIRST-PERSON WEAPON SYSTEM
    // ═══════════════════════════════════════
    const weaponHolder = new THREE.Group();
    camera.add(weaponHolder);

    const WEAPON_NAMES = ['pistol', 'shotgun', 'rifle'];

    const FP = {
        pistol:  { scale: 0.18, rotY: -Math.PI / 2 },
        shotgun: { scale: 0.60, rotY: -Math.PI / 2 },
        rifle:   { scale: 0.55, rotY: -Math.PI / 2 },
    };

    const REST_POS = new THREE.Vector3(0.2, -0.25, -0.45);
    const REST_ROT_BASE = new THREE.Vector3(-0.08, -0.08, 0.03);
    const AIM_POS  = new THREE.Vector3(0.0, -0.18, -0.38);
    const AIM_ROT_BASE  = new THREE.Vector3(0, 0, 0);

    let wpnLerp = 0;
    let wpnState = 'rest';
    let lastFiredAt = 0;
    let recoilKick = 0;
    let wpnBobTime = 0;
    let pendingSwap = -1;

    const RAISE_SPD    = 10;
    const LOWER_SPD    = 5;
    const RECOIL_AMT   = 0.035;
    const RECOIL_RECOVER = 8;
    const HOLD_TIME    = 0.45;

    // ── Casings ──
    const activeCasings = [];
    const casingGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.03, 6);
    const casingMat = new THREE.MeshStandardMaterial({
        color: 0xccaa44, metalness: 0.8, roughness: 0.3
    });
    const CASING_Y_OFFSET = { pistol: 0.07, shotgun: 0, rifle: 0 };

    // ── Muzzle flash ──
    const mFlashCanvas = document.createElement('canvas');
    mFlashCanvas.width = 64;
    mFlashCanvas.height = 64;
    const mfCtx = mFlashCanvas.getContext('2d');
    const grad = mfCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,200,1)');
    grad.addColorStop(0.3, 'rgba(255,180,50,0.8)');
    grad.addColorStop(0.7, 'rgba(255,100,0,0.3)');
    grad.addColorStop(1, 'rgba(255,60,0,0)');
    mfCtx.fillStyle = grad;
    mfCtx.fillRect(0, 0, 64, 64);

    const mFlashTex = new THREE.CanvasTexture(mFlashCanvas);
    const mFlashSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: mFlashTex, transparent: true,
        blending: THREE.AdditiveBlending, opacity: 0.9
    }));
    mFlashSprite.scale.set(0.08, 0.08, 0.08);
    mFlashSprite.visible = false;
    const MUZZLE_OFFSETS = [
        { x: 0, y: 0.06, z: -0.30 },
        { x: 0, y: 0.04, z: -0.95 },
        { x: 0, y: 0.07, z: -0.90 }
    ];
    mFlashSprite.position.set(0, 0.02, -0.35);
    weaponHolder.add(mFlashSprite);
    let mFlashVis = 0;

    function equipWeapon(index) {
        const name = WEAPON_NAMES[index];
        const model = weaponGLBs[name];
        if (!model) return;

        while (weaponHolder.children.length > 1) {
            const child = weaponHolder.children[0];
            if (child === mFlashSprite) {
                if (weaponHolder.children.length > 1)
                    weaponHolder.remove(weaponHolder.children[1]);
                else break;
            } else {
                weaponHolder.remove(child);
            }
        }

        const wpn = model.clone();
        const cfg = FP[name];
        wpn.scale.setScalar(cfg.scale);
        wpn.rotation.y = cfg.rotY;

        const box = new THREE.Box3().setFromObject(wpn);
        const center = box.getCenter(new THREE.Vector3());
        wpn.position.sub(center);

        weaponHolder.add(wpn);
        weaponHolder.position.copy(REST_POS);
        weaponHolder.rotation.set(REST_ROT_BASE.x, REST_ROT_BASE.y, REST_ROT_BASE.z);
    }

    function swapWeapon(newIndex) {
        if (newIndex === curWeapon) return;
        if (wpnState === 'swapDown' || wpnState === 'swapUp') return;
        pendingFire = false;
        pendingSwap = newIndex;
        wpnState = 'swapDown';
    }

    function triggerFire() {
        if (pendingFire) return;
        pendingFire = true;
        if (wpnState === 'rest' || wpnState === 'lowering') {
            wpnState = 'raising';
        }
    }

    function executeShot() {
        lastFiredAt = performance.now() / 1000;
        recoilKick = RECOIL_AMT;

        const mPos = MUZZLE_OFFSETS[curWeapon];
        mFlashSprite.position.set(mPos.x, mPos.y, mPos.z);
        mFlashSprite.visible = true;
        mFlashSprite.material.rotation = Math.random() * Math.PI * 2;
        const FLASH_SIZES = [0.20, 0.32, 0.22];
        const flashSize = FLASH_SIZES[curWeapon] + Math.random() * 0.08;
        mFlashSprite.scale.set(flashSize, flashSize, flashSize);
        mFlashVis = 0.06;

        spawnCasing();
    }

    function spawnCasing() {
        const casing = new THREE.Mesh(casingGeo, casingMat);
        const worldPos = new THREE.Vector3();
        weaponHolder.getWorldPosition(worldPos);
        casing.position.copy(worldPos);
        casing.position.y += CASING_Y_OFFSET[WEAPON_NAMES[curWeapon]] || 0;

        scene.add(casing);

        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const up = new THREE.Vector3(0, 1, 0);
        const vel = new THREE.Vector3();
        vel.addScaledVector(right, 1.5 + Math.random());
        vel.addScaledVector(up, 1.5 + Math.random() * 1.5);
        vel.z += (Math.random() - 0.5) * 0.3;

        activeCasings.push({
            mesh: casing, velocity: vel,
            spin: new THREE.Vector3(
                Math.random() * 12, Math.random() * 12, Math.random() * 12
            ),
            age: 0
        });
    }

    function updateCrosshairADS(t) {
        const ch = document.getElementById('crosshair');
        const size = 30 - (t * 16);
        ch.style.width = size + 'px';
        ch.style.height = size + 'px';
    }

    function updateWeaponSystem(dt) {
        const now = performance.now() / 1000;
        const timeSinceShot = now - lastFiredAt;

        const raiseSpeed = pendingFire ? RAISE_SPD * 3 : RAISE_SPD;

        switch (wpnState) {
            case 'rest':
                wpnLerp = Math.max(0, wpnLerp - LOWER_SPD * dt);
                break;
            case 'raising':
                wpnLerp = Math.min(1, wpnLerp + raiseSpeed * dt);
                if (wpnLerp >= 1) wpnState = 'aimed';
                break;
            case 'aimed':
                if (timeSinceShot > HOLD_TIME && !fireHeld) wpnState = 'lowering';
                break;
            case 'lowering':
                wpnLerp = Math.max(0, wpnLerp - LOWER_SPD * dt);
                if (wpnLerp <= 0) wpnState = 'rest';
                break;
            case 'swapDown':
                wpnLerp = Math.max(-0.5, wpnLerp - RAISE_SPD * dt);
                if (wpnLerp <= -0.5) {
                    curWeapon = pendingSwap;
                    pendingSwap = -1;
                    equipWeapon(curWeapon);
                    updateWeaponHUD();
                    wpnState = 'swapUp';
                }
                break;
            case 'swapUp':
                wpnLerp = Math.min(0, wpnLerp + RAISE_SPD * dt);
                if (wpnLerp >= 0) {
                    wpnLerp = 0;
                    wpnState = 'rest';
                }
                break;
        }

        if (pendingFire && wpnLerp >= 0.95) {
            pendingFire = false;
            executeShot();
        }

        if (mFlashVis > 0) {
            mFlashVis -= dt;
            if (mFlashVis <= 0) {
                mFlashVis = 0;
                mFlashSprite.visible = false;
            }
        }

        recoilKick = Math.max(0, recoilKick - RECOIL_RECOVER * dt);

        wpnBobTime += dt;
        const bobX = Math.sin(wpnBobTime * 1.5) * 0.002;
        const bobY = Math.sin(wpnBobTime * 2.0) * 0.002;

        const t = Math.max(0, Math.min(1, wpnLerp));
        const px = REST_POS.x + (AIM_POS.x - REST_POS.x) * t + bobX;
        const py = REST_POS.y + (AIM_POS.y - REST_POS.y) * t + bobY + recoilKick * 0.5;
        const pz = REST_POS.z + (AIM_POS.z - REST_POS.z) * t + recoilKick;

        weaponHolder.position.set(px, py, pz);

        const rx = REST_ROT_BASE.x + (AIM_ROT_BASE.x - REST_ROT_BASE.x) * t - recoilKick * 2;
        const ry = REST_ROT_BASE.y + (AIM_ROT_BASE.y - REST_ROT_BASE.y) * t;
        const rz = REST_ROT_BASE.z + (AIM_ROT_BASE.z - REST_ROT_BASE.z) * t;
        weaponHolder.rotation.set(rx, ry, rz);

        updateCrosshairADS(t);
    }

    function updateCasings(dt) {
        for (let i = activeCasings.length - 1; i >= 0; i--) {
            const c = activeCasings[i];
            c.age += dt;
            c.velocity.y -= 9.8 * dt;
            c.mesh.position.addScaledVector(c.velocity, dt);
            c.mesh.rotation.x += c.spin.x * dt;
            c.mesh.rotation.z += c.spin.z * dt;

            if (c.mesh.position.y < 0.02) {
                c.mesh.position.y = 0.02;
                c.velocity.y *= -0.3;
                c.velocity.x *= 0.5;
                c.velocity.z *= 0.5;
            }

            if (c.age >= 1.2) {
                scene.remove(c.mesh);
                activeCasings.splice(i, 1);
            }
        }
    }

    function spawnDamageNumber(position, damage, isCritical) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.font = isCritical ? 'bold 90px Arial' : 'bold 64px Arial';
        ctx.fillStyle = isCritical ? '#ff2222' : '#ffdd00';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const text = Math.round(damage).toString();
        ctx.strokeText(text, 128, 64);
        ctx.fillText(text, 128, 64);

        const texture = new THREE.CanvasTexture(canvas);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: texture, transparent: true, depthTest: false
        }));
        sprite.position.copy(position);
        sprite.position.x += (Math.random() - 0.5) * 0.5;
        sprite.scale.set(isCritical ? 2.2 : 1.5, isCritical ? 1.1 : 0.75, 1);
        scene.add(sprite);
        activeDamageNumbers.push({ sprite, life: 1.0, age: 0 });
    }

    function updateDamageNumbers(dt) {
        for (let i = activeDamageNumbers.length - 1; i >= 0; i--) {
            const dn = activeDamageNumbers[i];
            dn.age += dt;
            dn.sprite.position.y += 2.5 * dt;
            dn.sprite.material.opacity = 1 - (dn.age / dn.life);
            if (dn.age >= dn.life) {
                scene.remove(dn.sprite);
                dn.sprite.material.map.dispose();
                dn.sprite.material.dispose();
                activeDamageNumbers.splice(i, 1);
            }
        }
    }

    function updateHealthBar(enemy) {
        const hb = enemy.healthBar;
        if (!hb) return;
        const ctx = hb.canvas.getContext('2d');
        const pct = Math.max(0, enemy.health / enemy.maxHealth);
        ctx.clearRect(0, 0, 256, 64);

        ctx.font = 'bold 22px Courier New';
        ctx.fillStyle = '#ff4444';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.textAlign = 'center';
        ctx.strokeText(hb.typeName.toUpperCase(), 128, 20);
        ctx.fillText(hb.typeName.toUpperCase(), 128, 20);

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(28, 34, 200, 18);
        ctx.fillStyle = pct > 0.5 ? '#39FF14' : pct > 0.25 ? '#ffaa00' : '#ff2222';
        ctx.fillRect(30, 36, 196 * pct, 14);

        hb.texture.needsUpdate = true;

        const box = new THREE.Box3().setFromObject(enemy.group);
        hb.sprite.position.set(
            enemy.group.position.x,
            box.max.y + 0.5,
            enemy.group.position.z
        );

    // ═══════════════════════════════════════
    // AIM CONTROLS
    // ═══════════════════════════════════════
    let pitch = 0, yaw = 0;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let aimTouchId = null, aimX = 0, aimY = 0;

    if (!isMobile) {
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement !== renderer.domElement) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-1.2, Math.min(1.2, pitch));
        });
    }

    renderer.domElement.addEventListener('touchstart', e => {
        const t = e.changedTouches[0];
        if (aimTouchId === null) {
            aimTouchId = t.identifier;
            aimX = t.clientX; aimY = t.clientY;
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === aimTouchId) {
                yaw -= (t.clientX - aimX) * 0.004;
                pitch -= (t.clientY - aimY) * 0.004;
                pitch = Math.max(-1.2, Math.min(1.2, pitch));
                aimX = t.clientX; aimY = t.clientY;
            }
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === aimTouchId) aimTouchId = null;
        }
    }, { passive: true });

    // ═══════════════════════════════════════
    // SHOOTING — semi-auto gated
    // ═══════════════════════════════════════
    const raycaster = new THREE.Raycaster();
    raycaster.far = 80;

    function shoot() {
        if (state !== 'playing') return;
        const now = performance.now() / 1000;
        const w = CONFIG.weapons[curWeapon];
        if (now - lastShotTime < w.rate) return;
        if (ammo[curWeapon] <= 0) return;

        lastShotTime = now;
        if (ammo[curWeapon] !== Infinity) ammo[curWeapon]--;
        updateAmmoHUD();

        triggerFire();

        const dir = new THREE.Vector3(0, 0, -1);
        dir.applyEuler(camera.rotation);

        for (let p = 0; p < w.pellets; p++) {
            const d = dir.clone();
            if (w.spread > 0) {
                d.x += (Math.random() - 0.5) * w.spread;
                d.y += (Math.random() - 0.5) * w.spread;
                d.normalize();
            }
            raycaster.set(camera.position, d);

            const meshes = [];
            activeEnemies.forEach(e => {
                if (e.dead) return;
                e.group.traverse(c => { if (c.isMesh) meshes.push(c); });
            });

            const hits = raycaster.intersectObjects(meshes, false);
            if (hits.length > 0) {
                const hitObj = hits[0].object;
                for (const enemy of activeEnemies) {
                    if (enemy.dead) continue;
                    let found = false;
                    enemy.group.traverse(c => { if (c === hitObj) found = true; });
                    if (found) {
                        damageEnemy(enemy, w.damage, hits[0].point);
                        break;
                    }
                }
            }

            // Shoot power-ups too
            const puMeshes = [];
            activePowerups.forEach(pu => {
                pu.mesh.traverse(c => { if (c.isMesh) puMeshes.push(c); });
            });
            const puHits = raycaster.intersectObjects(puMeshes, false);
            if (puHits.length > 0) {
                const hitMesh = puHits[0].object;
                for (let pi = activePowerups.length - 1; pi >= 0; pi--) {
                    let found = false;
                    activePowerups[pi].mesh.traverse(c => { if (c === hitMesh) found = true; });
                    if (found) {
                        collectPowerup(activePowerups[pi], pi);
                        break;
                    }
                }
            }
        }
    }

    const POWERUP_TYPES = [
        { id: 'pistol_ammo', weight: 20, create: () => { const g = createBulletModel(0xffcc44, 0.2, 0.04); addGlow(g, 0xffcc44); return g; } },
        { id: 'rifle_ammo',  weight: 20, create: () => { const g = createBulletModel(0xff8833, 0.3, 0.05); addGlow(g, 0xff8833); return g; } },
        { id: 'shotgun_ammo',weight: 15, create: () => { const g = createShotgunShellModel(); addGlow(g, 0xff3333); return g; } },
        { id: 'health',      weight: 25, create: () => { const g = createMedkitModel(); addGlow(g, 0x39FF14); return g; } },
        { id: 'nuke',        weight: 5,  create: () => { const g = createNukeModel(); addGlow(g, 0x39FF14); return g; } },
        { id: 'speed',       weight: 8,  create: () => { const g = createSpeedModel(); addGlow(g, 0x4488ff); return g; } },
        { id: 'max_ammo',    weight: 7,  create: () => { const g = createMaxAmmoModel(); addGlow(g, 0xaa44ff); return g; } },
    ];

    const TOTAL_PU_WEIGHT = POWERUP_TYPES.reduce((s, p) => s + p.weight, 0);

    function pickPowerupType() {
        let r = Math.random() * TOTAL_PU_WEIGHT;
        for (const pu of POWERUP_TYPES) {
            r -= pu.weight;
            if (r <= 0) return pu;
        }
        return POWERUP_TYPES[0];
    }

    function collectPowerup(pu, index) {
        switch (pu.type) {
            case 'health':
                hp = Math.min(hp + 25, CONFIG.player.health);
                updateHealthHUD();
                break;
            case 'pistol_ammo':
                // Pistol is infinite — give bonus score instead
                score += 50;
                updateHUD();
                break;
            case 'rifle_ammo':
                ammo[2] = Math.min(ammo[2] + 15, maxAmmo[2]);
                updateAmmoHUD();
                break;
            case 'shotgun_ammo':
                ammo[1] = Math.min(ammo[1] + 6, maxAmmo[1]);
                updateAmmoHUD();
                break;
            case 'nuke':
                // Kill all non-boss enemies
                for (const e of activeEnemies) {
                    if (!e.dead && e.type !== 'boss') {
                        killEnemy(e);
                    }
                }
                screenShake = 0.4;
                spawnShockwave(camera.position.clone());
                break;
            case 'speed':
                speedBoostTimer = 8; // 8 seconds of faster fire rate
                break;
            case 'max_ammo':
                ammo[1] = maxAmmo[1];
                ammo[2] = maxAmmo[2];
                updateAmmoHUD();
                break;
        }
        scene.remove(pu.group);
        activePowerups.splice(index, 1);
    }

    function spawnPowerup(pos) {
        const puType = pickPowerupType();
        const group = puType.create();
        group.position.copy(pos);
        group.position.y = 0.3;
        scene.add(group);
        activePowerups.push({ group, type: puType.id, life: 15 });
    }

    function updatePowerups(dt) {
        if (speedBoostTimer > 0) speedBoostTimer -= dt;

        for (let i = activePowerups.length - 1; i >= 0; i--) {
            const p = activePowerups[i];
            p.life -= dt;
            p.group.rotation.y += dt * 2;
            // Gentle float
            p.group.position.y = 0.3 + Math.sin(performance.now() / 1000 * 2 + i) * 0.08;

            // Walk-over pickup
            const dist = camera.position.distanceTo(p.group.position);
            if (dist < 1.5) {
                collectPowerup(p, i);
                continue;
            }

            // Blink when about to expire
            if (p.life <= 3) {
                p.group.visible = Math.sin(p.life * 10) > 0;
            }

            if (p.life <= 0) {
                scene.remove(p.group);
                activePowerups.splice(i, 1);
            }
        }
    }

        });

    function updateShockwaves(dt) {
        for (let i = activeShockwaves.length - 1; i >= 0; i--) {
            const sw = activeShockwaves[i];
            sw.age += dt;
            const s = 1 + sw.age * 40;
            sw.mesh.scale.set(s, s, s);
            sw.mesh.material.opacity = Math.max(0, 0.8 - sw.age * 2);
            if (sw.age > 0.5) {

                sw.mesh.geometry.dispose();
                sw.mesh.material.dispose();
                activeShockwaves.splice(i, 1);
            }
        }

    // ═══════════════════════════════════════
    // ENEMIES
    // ═══════════════════════════════════════
    function spawnEnemy(type) {
        const modelKey = type === 'boss' ? 'boss' : type;
        if (!models[modelKey]) {
            // Fallback: if boss model missing, use brute scaled up
            if (type === 'boss' && models['brute']) {
                // Continue with brute as fallback
            } else return;
        }

        const cfg = CONFIG.enemies[type];
        const sourceModel = models[modelKey] || models['brute'];
        const group = skeletonClone(sourceModel);
        group.traverse((child) => {
            if (child.isMesh) {
                child.material = child.material.clone();
            }
        });
        group.scale.setScalar(cfg.scale);

        const angle = Math.random() * Math.PI * 2;
        group.position.set(
            Math.cos(angle) * CONFIG.spawnRadius,
            0,
            Math.sin(angle) * CONFIG.spawnRadius
        );

        const mixer = new THREE.AnimationMixer(group);
        const clips = anims[modelKey] || anims['brute'] || [];
        let walkAction = null, deadAction = null;

        for (const clip of clips) {
            const n = clip.name.toLowerCase();
            if (n.includes('walk') || n.includes('run')) {
                walkAction = mixer.clipAction(clip);
                walkAction.play();
            } else if (n.includes('dead') || n.includes('death')) {
                deadAction = mixer.clipAction(clip);
                deadAction.loop = THREE.LoopOnce;
                deadAction.clampWhenFinished = true;
            }
        }

        const hitBox = new THREE.Mesh(
            new THREE.CylinderGeometry(0.5, 0.5, 2, 8),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        hitBox.position.y = 1;
        group.add(hitBox);
        scene.add(group);

        // Health bar (not for boss — boss uses HUD bar)
        let hb = null;
        if (type !== 'boss') {
            hb = createHealthBar(type);
            scene.add(hb.sprite);
        }

        // Scale health by wave
        const waveScale = 1 + (wave - 1) * 0.15;
        const scaledHealth = Math.round(cfg.health * waveScale);

        const bossWaveNum = Math.floor(wave / 10);

        const enemy = {
            type, group, mixer,
            walkAction, deadAction,
            health: scaledHealth,
            maxHealth: scaledHealth,
            speed: cfg.speed,
            damage: cfg.damage,
            points: cfg.points,
            dead: false,
            despawnTimer: 0,
            hitFlashTimer: 0,
            healthBar: hb,
            isBoss: type === 'boss',
            bossWaveNum: type === 'boss' ? bossWaveNum : 0,
            enraged: false,
            slamCooldown: 0,
            redPulseTimer: 0
        };

        activeEnemies.push(enemy);

        if (type === 'boss') {
            activeBoss = enemy;
            showWaveAnnounce('⚠ TITAN ⚠');
            const bossBar = document.getElementById('boss-bar');
            bossBar.style.display = 'block';
            updateBossHUD();

            const entourageCount = 2 + bossWaveNum * 2;
            for (let ei = 0; ei < entourageCount; ei++) {
                setTimeout(() => {
                    if (state === 'playing') spawnEnemy('brute');
                }, 800 + ei * 400);
            }
            waveEnemiesLeft += entourageCount;
        }
    }

    function updateBossHUD() {
        if (!activeBoss || activeBoss.dead) {
            document.getElementById('boss-bar').style.display = 'none';
            return;
        }
        const pct = Math.max(0, activeBoss.health / activeBoss.maxHealth * 100);
        document.getElementById('boss-health-fill').style.width = pct + '%';
    }
function damageEnemy(enemy, baseDmg, hitPoint) {
        const isCritical = hitPoint.y > (enemy.group.position.y + 1.2);
        const dmg = isCritical ? baseDmg * 2 : baseDmg;

        enemy.health -= dmg;
        enemy.hitFlashTimer = 0.1;
        spawnDamageNumber(hitPoint, dmg, isCritical);

        if (enemy.isBoss) {
            updateBossHUD();

            if (enemy.bossWaveNum >= 4 && !enemy.enraged &&
                enemy.health < enemy.maxHealth * 0.25) {
                enemy.enraged = true;
                enemy.speed *= 2.5;
                enemy.slamCooldown = 0;
                showWaveAnnounce('⚠ ENRAGED ⚠');
            }
            else if (enemy.bossWaveNum < 4 && !enemy.enraged &&
                enemy.health < enemy.maxHealth * 0.3) {
                enemy.enraged = true;
                enemy.speed *= 2;
                showWaveAnnounce('⚠ ENRAGED ⚠');
            }
        } else {
            updateHealthBar(enemy);
        }

        if (enemy.health <= 0 && !enemy.dead) {
            killEnemy(enemy);
        }
    }

    function killEnemy(enemy) {
        enemy.dead = true;
        kills++;
        score += enemy.points;
        waveEnemiesLeft--;
        updateHUD();

        if (enemy.isBoss) {
            activeBoss = null;
            document.getElementById('boss-bar').style.display = 'none';
            screenShake = 0.5;
            spawnShockwave(enemy.group.position.clone());

            for (let i = 0; i < 3; i++) {
                const dropPos = enemy.group.position.clone();
                dropPos.x += (Math.random() - 0.5) * 3;
                dropPos.z += (Math.random() - 0.5) * 3;
                spawnPowerup(dropPos);
            }

            if (enemy.bossWaveNum >= 3) {
                const boomRadius = 12;
                const boomDamage = 100;
                for (const e of activeEnemies) {
                    if (e.dead || e === enemy) continue;
                    const dist = e.group.position.distanceTo(enemy.group.position);
                    if (dist < boomRadius) {
                        const falloff = 1 - (dist / boomRadius);
                        const chainDmg = boomDamage * falloff;
                        e.health -= chainDmg;
                        e.hitFlashTimer = 0.2;
                        spawnDamageNumber(e.group.position.clone().setY(1.5), chainDmg, false);
                        if (e.health <= 0 && !e.dead) killEnemy(e);
                    }
                }
                spawnShockwave(enemy.group.position.clone());
                screenShake = 0.8;
            }
        } else {
            if (enemy.healthBar) scene.remove(enemy.healthBar.sprite);
        }

        if (enemy.walkAction) enemy.walkAction.stop();
        if (enemy.deadAction) {
            enemy.deadAction.reset();
            enemy.deadAction.play();
        }

        if (!enemy.isBoss && Math.random() < CONFIG.dropChance) {
            spawnPowerup(enemy.group.position.clone());
        }
    }

    function updateEnemies(dt) {
        for (let i = activeEnemies.length - 1; i >= 0; i--) {
            const e = activeEnemies[i];
            e.mixer.update(dt);

            if (e.hitFlashTimer > 0) {
                e.hitFlashTimer -= dt;
                e.group.traverse(c => {
                    if (c.isMesh) {
                        if (!c.userData.originalEmissive) {
                            c.userData.originalEmissive = c.material.emissive.getHex();
                        }
                        c.material.emissive.set(
                            e.hitFlashTimer > 0 ? 0xff0000 : c.userData.originalEmissive
                        );
                    }
                });
            }

            if (e.dead) {
                e.despawnTimer += dt;
                if (e.despawnTimer > CONFIG.despawnTime) {
                    scene.remove(e.group);
                    if (e.healthBar) scene.remove(e.healthBar.sprite);
                    activeEnemies.splice(i, 1);
                }
                continue;
            }

            if (!e.isBoss) updateHealthBar(e);

            const dir = new THREE.Vector3(
                camera.position.x - e.group.position.x,
                0,
                camera.position.z - e.group.position.z
            );
            const dist = dir.length();
            dir.normalize();

            e.group.lookAt(
                camera.position.x,
                e.group.position.y,
                camera.position.z
            );

            if (dist > CONFIG.meleeRange) {
                e.group.position.addScaledVector(dir, e.speed * dt);
            } else {
                hp -= e.damage * dt;
                updateHealthHUD();

                if (e.isBoss && e.bossWaveNum >= 2) {
                    e.slamCooldown -= dt;
                    if (e.slamCooldown <= 0) {
                        const slamDmg = e.enraged ? 20 : 12;
                        hp -= slamDmg;
                        updateHealthHUD();
                        screenShake = 0.3;
                        spawnShockwave(e.group.position.clone());
                        e.slamCooldown = e.enraged ? 1.5 : 3.0;
                    }
                }

                if (e.isBoss && e.enraged && e.bossWaveNum >= 4) {
                    e.redPulseTimer += dt;
                    const pulse = Math.sin(e.redPulseTimer * 8) * 0.5 + 0.5;
                    e.group.traverse(c => {
                        if (c.isMesh) {
                            c.material.emissive.setRGB(pulse * 0.8, 0, 0);
                        }
                    });
                }

                if (e.isBoss) screenShake = Math.max(screenShake, 0.05);
                if (hp <= 0) {
                    hp = 0;
                    gameOver();
                }
            }
        }
    }

    // ═══════════════════════════════════════
    // WAVE SYSTEM
    // ═══════════════════════════════════════
    function startWave() {
        wave++;
        betweenWaves = false;

        const totalEnemies = 4 + wave * 3;
        const isBossWave = (wave % 5 === 0);
        waveEnemiesLeft = totalEnemies + (isBossWave ? 1 : 0);

        updateHUD();
        showWaveAnnounce(`WAVE ${wave}`);

        let spawned = 0;
        const spawnInterval = setInterval(() => {
            if (spawned >= totalEnemies || state !== 'playing') {
                clearInterval(spawnInterval);
                // Spawn boss after regular enemies
                if (isBossWave && state === 'playing') {
                    setTimeout(() => spawnEnemy('boss'), 1500);
                }
                return;
            }
            const type = pickEnemyType();
            spawnEnemy(type);
            spawned++;
        }, 600);
    }

    function pickEnemyType() {
        const r = Math.random();
        if (wave <= 2) {
            return r < 0.7 ? 'shambler' : 'runner';
        } else if (wave <= 5) {
            if (r < 0.30) return 'shambler';
            if (r < 0.55) return 'runner';
            if (r < 0.80) return 'tank';
            return 'brute';
        } else {
            if (r < 0.15) return 'shambler';
            if (r < 0.40) return 'runner';
            if (r < 0.65) return 'tank';
            return 'brute';
        }
    }

    function checkWaveComplete() {
        if (waveEnemiesLeft <= 0 && !betweenWaves && state === 'playing') {
            betweenWaves = true;
            waveTimer = 4;

            ammo[1] = Math.min(ammo[1] + 4, maxAmmo[1]);
            ammo[2] = Math.min(ammo[2] + 15, maxAmmo[2]);
            updateAmmoHUD();
        }
    }

    // ═══════════════════════════════════════
    // ZOMBIE PROXIMITY INDICATOR
    // ═══════════════════════════════════════
    const threatEls = {
        left:   document.getElementById('threat-left'),
        right:  document.getElementById('threat-right'),
        top:    document.getElementById('threat-top'),
        bottom: document.getElementById('threat-bottom')
    };

    function updateThreatIndicators() {
        let maxL = 0, maxR = 0, maxT = 0, maxB = 0;
        const THREAT_DIST = 15;

        for (const e of activeEnemies) {
            if (e.dead) continue;
            const dir = new THREE.Vector3();
            dir.subVectors(e.group.position, camera.position);
            const dist = dir.length();
            if (dist > THREAT_DIST) continue;

            const intensity = 1 - (dist / THREAT_DIST);

            const forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
            const right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
            const flatDir = new THREE.Vector3(dir.x, 0, dir.z).normalize();

            const dot = forward.dot(flatDir);
            const cross = right.dot(flatDir);

            if (cross < -0.3) maxL = Math.max(maxL, intensity);
            if (cross > 0.3)  maxR = Math.max(maxR, intensity);
            if (dot < -0.2) maxB = Math.max(maxB, intensity);
        }

        threatEls.left.style.opacity = maxL;
        threatEls.right.style.opacity = maxR;
        threatEls.top.style.opacity = maxT;
        threatEls.bottom.style.opacity = maxB;
    }

    // ═══════════════════════════════════════
    // HUD UPDATES
    // ═══════════════════════════════════════
    function updateHUD() {
        document.getElementById('wave-display').textContent = `WAVE ${wave}`;
        document.getElementById('score-display').textContent = score;
        document.getElementById('kills-display').textContent = `KILLS: ${kills}`;
    }

    function updateHealthHUD() {
        const pct = Math.max(0, hp / CONFIG.player.health * 100);
        const bar = document.getElementById('health-bar');
        bar.style.width = pct + '%';
        if (pct < 30) bar.style.background = '#ff4444';
        else if (pct < 60) bar.style.background = '#ffaa00';
        else bar.style.background = '#39FF14';
    }

    function updateAmmoHUD() {
        const a = ammo[curWeapon];
        document.getElementById('ammo-display').textContent =
            a === Infinity ? '∞' : a;
    }

    function updateWeaponHUD() {
        document.querySelectorAll('.weapon-slot').forEach((el, i) => {
            el.classList.toggle('active', i === curWeapon);
        });
        updateAmmoHUD();
    }

    function showWaveAnnounce(text) {
        const el = document.getElementById('wave-announce');
        el.textContent = text;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    // ═══════════════════════════════════════
    // SCREEN SHAKE
    // ═══════════════════════════════════════
    function updateScreenShake(dt) {
        if (screenShake > 0) {
            screenShake -= dt;
            const intensity = Math.min(screenShake, 0.3) * 0.15;
            camera.position.x = (Math.random() - 0.5) * intensity;
            camera.position.z = (Math.random() - 0.5) * intensity;
        } else {
            camera.position.x = 0;
            camera.position.z = 0;
        }
        camera.position.y = CONFIG.player.height;
    }

    // ═══════════════════════════════════════
    // START / RESTART / GAME OVER
    // ═══════════════════════════════════════
    function startGame() {
        state = 'playing';
        score = 0; kills = 0; wave = 0;
        hp = CONFIG.player.health;
        curWeapon = 0;
        ammo = [Infinity, 8, 30];
        pitch = 0; yaw = 0;
        fireHeld = false;
        fireTouchId = null;
        pendingFire = false;
        hasFiredThisClick = false;
        activeBoss = null;
        screenShake = 0;
        speedBoostTimer = 0;

        for (const e of activeEnemies) {
            scene.remove(e.group);
            if (e.healthBar) scene.remove(e.healthBar.sprite);
        }
        activeEnemies.length = 0;

        for (const p of activePowerups) scene.remove(p.group);
        activePowerups.length = 0;

        for (const dn of activeDamageNumbers) {
            scene.remove(dn.sprite);
            dn.sprite.material.map.dispose();
            dn.sprite.material.dispose();
        }
        activeDamageNumbers.length = 0;

        for (const c of activeCasings) scene.remove(c.mesh);
        activeCasings.length = 0;

        for (const sw of activeShockwaves) {
            scene.remove(sw.mesh);
            sw.mesh.geometry.dispose();
            sw.mesh.material.dispose();
        }
        activeShockwaves.length = 0;

        document.getElementById('boss-bar').style.display = 'none';

        wpnLerp = 0;
        wpnState = 'rest';
        recoilKick = 0;
        lastFiredAt = 0;
        pendingSwap = -1;
        equipWeapon(0);

        document.getElementById('blocker').style.display = 'none';
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('hud').style.display = 'block';

        updateHUD();
        updateHealthHUD();
        updateWeaponHUD();

        if (!isMobile) {
            renderer.domElement.requestPointerLock();
        }

        startWave();
    }

    function gameOver() {
        state = 'gameover';
        fireHeld = false;
        fireTouchId = null;
        pendingFire = false;
        hasFiredThisClick = false;
        activeBoss = null;
        document.getElementById('boss-bar').style.display = 'none';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-stats').innerHTML =
            `WAVE ${wave}<br>SCORE: ${score}<br>KILLS: ${kills}`;

        if (document.pointerLockElement) document.exitPointerLock();
    }

    // ═══════════════════════════════════════
    // INPUT EVENTS — semi-auto + full-auto
    // ═══════════════════════════════════════
    document.getElementById('blocker').addEventListener('click', () => {
        if (state === 'menu') startGame();
    });
    document.getElementById('blocker').addEventListener('touchend', e => {
        e.preventDefault();
        if (state === 'menu') startGame();
    });

    document.getElementById('game-over').addEventListener('click', () => {
        if (state === 'gameover') startGame();
    });
    document.getElementById('game-over').addEventListener('touchend', e => {
        e.preventDefault();
        if (state === 'gameover') startGame();
    });

    // Desktop: mousedown = fire, mouseup = release
    renderer.domElement.addEventListener('mousedown', e => {
        if (e.button === 0) {
            fireHeld = true;
            hasFiredThisClick = false;
            shoot();
        }
    });
    renderer.domElement.addEventListener('mouseup', e => {
        if (e.button === 0) {
            fireHeld = false;
            hasFiredThisClick = false;
        }
    });

    // Mobile: track fire touch separately from aim touch
    renderer.domElement.addEventListener('touchstart', e => {
        if (state !== 'playing') return;
        for (const t of e.changedTouches) {
            if (t.identifier !== aimTouchId) {
                fireTouchId = t.identifier;
                fireHeld = true;
                hasFiredThisClick = false;
                shoot();
            }
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === fireTouchId) {
                fireHeld = false;
                fireTouchId = null;
                hasFiredThisClick = false;
            }
        }
    }, { passive: true });

    document.addEventListener('keydown', e => {
        if (state !== 'playing') return;
        if (e.key === '1') swapWeapon(0);
        if (e.key === '2') swapWeapon(1);
        if (e.key === '3') swapWeapon(2);
        if (e.key === 'q' || e.key === 'Q') {
            swapWeapon((curWeapon + 1) % CONFIG.weapons.length);
        }
    });

    document.querySelectorAll('.weapon-slot').forEach(el => {
        el.addEventListener('click', () => {
            if (state !== 'playing') return;
            swapWeapon(parseInt(el.dataset.weapon));
        });
        el.addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation();
            if (state !== 'playing') return;
            swapWeapon(parseInt(el.dataset.weapon));
        });
    });

    // ═══════════════════════════════════════
    // GAME LOOP
    // ═══════════════════════════════════════
    function gameLoop() {
        requestAnimationFrame(gameLoop);

        const dt = Math.min(clock.getDelta(), 0.1);

        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        if (state === 'playing') {
            // Hold-to-fire: only auto weapons fire continuously
            if (fireHeld && CONFIG.weapons[curWeapon].auto) shoot();

            updateEnemies(dt);
            updatePowerups(dt);
            updateDamageNumbers(dt);
            updateWeaponSystem(dt);
            updateCasings(dt);
            updateShockwaves(dt);
            updateThreatIndicators();
            updateScreenShake(dt);
            checkWaveComplete();

            if (betweenWaves) {
                waveTimer -= dt;
                if (waveTimer <= 0) startWave();
            }
        }

        renderer.render(scene, camera);
    }
    gameLoop();

    // ═══════════════════════════════════════
    // RESIZE
    // ═══════════════════════════════════════
    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    </script>
</body>
