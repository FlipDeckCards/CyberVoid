<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEADZONE — Zombies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }

        #blocker {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #blocker h1 {
            font-size: 4rem; color: #39FF14;
            text-transform: uppercase; letter-spacing: 12px;
            text-shadow: 0 0 40px rgba(57,255,20,0.5);
            margin-bottom: 10px;
        }
        #blocker .mode {
            font-size: 1.4rem; color: #ff4444;
            letter-spacing: 6px; text-transform: uppercase;
            margin-bottom: 40px;
        }
        #blocker .start-text {
            font-size: 1rem; color: #888;
            letter-spacing: 4px; text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }
        #loading-bar {
            width: 200px; height: 4px; background: #222;
            border-radius: 2px; margin-top: 20px; overflow: hidden;
        }
        #loading-fill {
            width: 0%; height: 100%; background: #39FF14;
            transition: width 0.3s;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
            font-family: 'Courier New', monospace;
            display: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(57,255,20,0.8);
        }
        #crosshair::before {
            top: 50%; left: 0; width: 100%; height: 2px;
            transform: translateY(-50%);
        }
        #crosshair::after {
            top: 0; left: 50%; width: 2px; height: 100%;
            transform: translateX(-50%);
        }

        .hud-top {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 20px; color: #39FF14; font-size: 0.85rem;
            letter-spacing: 2px;
        }
        #health-bar-bg {
            position: absolute; bottom: 60px; left: 20px;
            width: 200px; height: 8px; background: #333;
            border-radius: 4px; overflow: hidden;
        }
        #health-bar {
            width: 100%; height: 100%; background: #39FF14;
            transition: width 0.3s;
        }
        #health-label {
            position: absolute; bottom: 72px; left: 20px;
            color: #39FF14; font-size: 0.7rem; letter-spacing: 2px;
        }
        #ammo-display {
            position: absolute; bottom: 60px; left: 240px;
            color: #39FF14; font-size: 1.4rem;
        }
        #ammo-label {
            position: absolute; bottom: 72px; left: 240px;
            color: #666; font-size: 0.6rem; letter-spacing: 2px;
        }

        #weapon-bar {
            position: absolute; bottom: 15px; right: 20px;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: auto;
        }
        .weapon-slot {
            padding: 6px 12px; background: rgba(0,0,0,0.6);
            border: 1px solid #333; border-radius: 4px;
            color: #888; font-size: 0.65rem; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; text-align: right;
        }
        .weapon-slot.active {
            border-color: #39FF14; color: #39FF14;
            background: rgba(57,255,20,0.1);
        }

        #wave-announce {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 3rem; color: #ff4444;
            letter-spacing: 8px; text-transform: uppercase;
            text-shadow: 0 0 40px rgba(255,68,68,0.5);
            z-index: 60; display: none; pointer-events: none;
        }

        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #game-over h1 {
            font-size: 3rem; color: #ff4444;
            letter-spacing: 8px; margin-bottom: 20px;
        }
        #game-over .stats {
            color: #888; font-size: 1rem;
            letter-spacing: 3px; margin-bottom: 30px;
            text-align: center; line-height: 2;
        }
        #game-over .restart {
            color: #39FF14; font-size: 0.9rem;
            letter-spacing: 4px; text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            #blocker h1 { font-size: 2.5rem; letter-spacing: 8px; }
            #blocker .mode { font-size: 1rem; }
            #health-bar-bg { width: 120px; }
            #ammo-display { left: 160px; }
            #ammo-label { left: 160px; }
            #wave-announce { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div id="blocker">
        <h1>DEADZONE</h1>
        <div class="mode">Zombies</div>
        <div class="start-text" id="start-text">Loading...</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div class="hud-top">
            <div id="wave-display">WAVE 1</div>
            <div id="score-display">0</div>
            <div id="kills-display">KILLS: 0</div>
        </div>
        <div id="health-label">HEALTH</div>
        <div id="health-bar-bg"><div id="health-bar"></div></div>
        <div id="ammo-display">∞</div>
        <div id="ammo-label">AMMO</div>
        <div id="weapon-bar">
            <div class="weapon-slot active" data-weapon="0">1 PISTOL</div>
            <div class="weapon-slot" data-weapon="1">2 SHOTGUN</div>
            <div class="weapon-slot" data-weapon="2">3 RIFLE</div>
        </div>
    </div>

    <div id="wave-announce"></div>

    <div id="game-over">
        <h1>DEAD</h1>
        <div class="stats" id="final-stats"></div>
        <div class="restart">TAP TO RESTART</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

    // ═══════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════
    const CONFIG = {
        player: { height: 1.6, health: 100 },
        weapons: [
            { name: 'Pistol',  damage: 25, rate: 0.3,  ammo: Infinity, spread: 0,    pellets: 1 },
            { name: 'Shotgun', damage: 15, rate: 0.8,  ammo: 8,        spread: 0.08, pellets: 6 },
            { name: 'Rifle',   damage: 35, rate: 0.12, ammo: 30,       spread: 0.02, pellets: 1 }
        ],
       enemies: {
            shambler: { speed: 1.8, health: 100, damage: 10, points: 10, scale: 1.2 },
            runner:   { speed: 4.5, health: 60, damage: 8, points: 25, scale: 1.0 },
            brute:    { speed: 1.3, health: 180, damage: 25, points: 50, scale: 1.5 },
            crawler:  { speed: 3.0, health: 40, damage: 5, points: 15, scale: 0.6 },
        },
        spawnRadius: 60,
        meleeRange: 2.0,
        despawnTime: 3,
        dropChance: 0.3
    };

    // ═══════════════════════════════════════
    // GAME STATE
    // ═══════════════════════════════════════
    let state = 'loading';
    let score = 0, kills = 0, wave = 0;
    let hp = CONFIG.player.health;
    let curWeapon = 0;
    let ammo = [Infinity, 8, 30];
    let maxAmmo = [Infinity, 8, 30];
    let lastShotTime = 0;
    let waveEnemiesLeft = 0;
    let waveTimer = 0;
    let betweenWaves = false;

    const activeEnemies = [];
    const activePowerups = [];
    const clock = new THREE.Clock();

    // ═══════════════════════════════════════
    // SCENE
    // ═══════════════════════════════════════
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060a06);
    scene.fog = new THREE.FogExp2(0x0a1a0a, 0.012);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, CONFIG.player.height, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // ═══════════════════════════════════════
    // LIGHTING
    // ═══════════════════════════════════════
    scene.add(new THREE.AmbientLight(0x334433, 1.2));

    const moon = new THREE.DirectionalLight(0x6699bb, 1.5);
    moon.position.set(-10, 20, -10);
    moon.castShadow = true;
    moon.shadow.mapSize.set(2048, 2048);
    const sc = moon.shadow.camera;
    sc.near = 0.5; sc.far = 60;
    sc.left = sc.bottom = -30;
    sc.right = sc.top = 30;
    scene.add(moon);

    const glow = new THREE.PointLight(0x39FF14, 0.3, 15);
    glow.position.set(0, 3, 0);
    scene.add(glow);

    // ═══════════════════════════════════════
    // GROUND
    // ═══════════════════════════════════════
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ═══════════════════════════════════════
    // LOAD ZOMBIE GLBS
    // ═══════════════════════════════════════
    const gltfLoader = new GLTFLoader();
    const models = {};
    const anims = {};
    let loaded = 0;

    function loadZombie(name) {
        return new Promise(resolve => {
            gltfLoader.load(`assets/${name}.glb`, gltf => {
                gltf.scene.traverse(c => {
                    if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
                });
                models[name] = gltf.scene;
                const box = new THREE.Box3().setFromObject(gltf.scene);
                const center = box.getCenter(new THREE.Vector3());
                gltf.scene.position.set(-center.x, 0, -center.z);
                anims[name] = gltf.animations;
                loaded++;
                document.getElementById('loading-fill').style.width =
                    (loaded / 4 * 100) + '%';
                resolve();
            }, undefined, () => {
                console.warn(`Missing: ${name}.glb`);
                loaded++;
                document.getElementById('loading-fill').style.width =
                    (loaded / 4 * 100) + '%';
                resolve();
            });
        });
    }

    async function init() {
        await Promise.all([
            loadZombie('shambler'),
            loadZombie('runner'),
            loadZombie('brute'),
            loadZombie('crawler')
        ]);
        // DEBUG: log model sizes
        for (const [name, model] of Object.entries(models)) {
            if (model) {
                const box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3();
                box.getSize(size);
                console.log(`${name}: ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`);
            }
        }
        state = 'menu';
        document.getElementById('start-text').textContent = 'TAP TO START';
        document.getElementById('loading-bar').style.display = 'none';
    }
    init();

    // ═══════════════════════════════════════
    // AIM CONTROLS
    // ═══════════════════════════════════════
    let pitch = 0, yaw = 0;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let aimTouchId = null, aimX = 0, aimY = 0;

    if (!isMobile) {
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement !== renderer.domElement) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-1.2, Math.min(1.2, pitch));
        });
    }

    renderer.domElement.addEventListener('touchstart', e => {
        const t = e.changedTouches[0];
        if (aimTouchId === null) {
            aimTouchId = t.identifier;
            aimX = t.clientX; aimY = t.clientY;
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === aimTouchId) {
                yaw -= (t.clientX - aimX) * 0.004;
                pitch -= (t.clientY - aimY) * 0.004;
                pitch = Math.max(-1.2, Math.min(1.2, pitch));
                aimX = t.clientX; aimY = t.clientY;
            }
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', e => {
        for (const t of e.changedTouches) {
            if (t.identifier === aimTouchId) aimTouchId = null;
        }
    }, { passive: true });

    // ═══════════════════════════════════════
    // — END PART 1 — paste Part 2 below ——
    // ═══════════════════════════════════════
          // ═══════════════════════════════════════
    // SHOOTING
    // ═══════════════════════════════════════
    const raycaster = new THREE.Raycaster();
    raycaster.far = 80;

    const muzzleFlash = new THREE.PointLight(0xffaa00, 0, 8);
    muzzleFlash.position.set(0, CONFIG.player.height, 0);
    scene.add(muzzleFlash);
    let muzzleTimer = 0;

    function shoot() {
        if (state !== 'playing') return;
        const now = performance.now() / 1000;
        const w = CONFIG.weapons[curWeapon];
        if (now - lastShotTime < w.rate) return;
        if (ammo[curWeapon] <= 0) return;

        lastShotTime = now;
        if (ammo[curWeapon] !== Infinity) ammo[curWeapon]--;
        updateAmmoHUD();

        muzzleFlash.intensity = 3;
        muzzleTimer = 0.06;

        const dir = new THREE.Vector3(0, 0, -1);
        dir.applyEuler(camera.rotation);

        for (let p = 0; p < w.pellets; p++) {
            const d = dir.clone();
            if (w.spread > 0) {
                d.x += (Math.random() - 0.5) * w.spread;
                d.y += (Math.random() - 0.5) * w.spread;
                d.normalize();
            }
            raycaster.set(camera.position, d);

            const meshes = [];
            activeEnemies.forEach(e => {
                if (e.dead) return;
                e.group.traverse(c => { if (c.isMesh) meshes.push(c); });
            });

            const hits = raycaster.intersectObjects(meshes, false);
            if (hits.length > 0) {
                const hitObj = hits[0].object;
                for (const enemy of activeEnemies) {
                    if (enemy.dead) continue;
                    let found = false;
                    enemy.group.traverse(c => { if (c === hitObj) found = true; });
                    if (found) {
                        damageEnemy(enemy, w.damage, hits[0].point);
                        break;
                    }
                }
            }
        }
    }

    // Hit particles
    function spawnHitParticles(pos) {
        const count = 6;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
            positions[i * 3]     = pos.x + (Math.random() - 0.5) * 0.3;
            positions[i * 3 + 1] = pos.y + (Math.random() - 0.5) * 0.3;
            positions[i * 3 + 2] = pos.z + (Math.random() - 0.5) * 0.3;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({ color: 0xff2222, size: 0.15, transparent: true });
        const pts = new THREE.Points(geo, mat);
        pts.userData.life = 0.4;
        scene.add(pts);
        particles.push(pts);
    }
    const particles = [];

    // ═══════════════════════════════════════
    // ENEMIES
    // ═══════════════════════════════════════
    function spawnEnemy(type) {
        if (!models[type]) return;

        const cfg = CONFIG.enemies[type];
        const group = skeletonClone(models[type]);
        group.scale.setScalar(cfg.scale);

        // Spawn at random position on circle
        const angle = Math.random() * Math.PI * 2;
        group.position.set(
            Math.cos(angle) * CONFIG.spawnRadius,
            0,
            Math.sin(angle) * CONFIG.spawnRadius
        );

        const mixer = new THREE.AnimationMixer(group);
        const clips = anims[type];
        let walkAction = null, deadAction = null;

        if (clips) {
            for (const clip of clips) {
                const n = clip.name.toLowerCase();
                if (n.includes('walk') || n.includes('run')) {
                    walkAction = mixer.clipAction(clip);
                    walkAction.play();
                } else if (n.includes('dead') || n.includes('death')) {
                    deadAction = mixer.clipAction(clip);
                    deadAction.loop = THREE.LoopOnce;
                    deadAction.clampWhenFinished = true;
                }
            }
        }
const hitBox = new THREE.Mesh(
            new THREE.CylinderGeometry(0.5, 0.5, 2, 8),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        hitBox.position.y = 1;
        group.add(hitBox);
        scene.add(group);

        activeEnemies.push({
            type, group, mixer,
            walkAction, deadAction,
            health: cfg.health,
            speed: cfg.speed,
            damage: cfg.damage,
            points: cfg.points,
            dead: false,
            despawnTimer: 0,
            hitFlashTimer: 0
        });
    }

    function damageEnemy(enemy, dmg, hitPoint) {
        enemy.health -= dmg;
        enemy.hitFlashTimer = 0.1;
        spawnHitParticles(hitPoint);

        if (enemy.health <= 0 && !enemy.dead) {
            killEnemy(enemy);
        }
    }

    function killEnemy(enemy) {
        enemy.dead = true;
        kills++;
        score += enemy.points;
        waveEnemiesLeft--;
        updateHUD();

        // Play death animation
        if (enemy.walkAction) enemy.walkAction.stop();
        if (enemy.deadAction) {
            enemy.deadAction.reset();
            enemy.deadAction.play();
        }

        // Random power-up drop
        if (Math.random() < CONFIG.dropChance) {
            spawnPowerup(enemy.group.position.clone());
        }
    }

    function updateEnemies(dt) {
        for (let i = activeEnemies.length - 1; i >= 0; i--) {
            const e = activeEnemies[i];
            e.mixer.update(dt);

            // Hit flash
            if (e.hitFlashTimer > 0) {
                e.hitFlashTimer -= dt;
                e.group.traverse(c => {
                    if (c.isMesh) c.material.emissive?.setHex(
                        e.hitFlashTimer > 0 ? 0xff0000 : 0x000000
                    );
                });
            }

            if (e.dead) {
                e.despawnTimer += dt;
                if (e.despawnTimer > CONFIG.despawnTime) {
                    scene.remove(e.group);
                    activeEnemies.splice(i, 1);
                }
                continue;
            }

            // Move toward player
            const dir = new THREE.Vector3(
                camera.position.x - e.group.position.x,
                0,
                camera.position.z - e.group.position.z
            );
            const dist = dir.length();
            dir.normalize();

            // Face player
            e.group.lookAt(
                camera.position.x,
                e.group.position.y,
                camera.position.z
            );

            if (dist > CONFIG.meleeRange) {
                e.group.position.addScaledVector(dir, e.speed * dt);
            } else {
                // Melee attack — damage player
                hp -= e.damage * dt;
                updateHealthHUD();
                if (hp <= 0) {
                    hp = 0;
                    gameOver();
                }
            }
        }
    }

    // ═══════════════════════════════════════
    // WAVE SYSTEM
    // ═══════════════════════════════════════
    function startWave() {
        wave++;
        betweenWaves = false;

        const totalEnemies = 4 + wave * 3;
        waveEnemiesLeft = totalEnemies;

        updateHUD();
        showWaveAnnounce(`WAVE ${wave}`);

        // Stagger spawns
        let spawned = 0;
        const spawnInterval = setInterval(() => {
            if (spawned >= totalEnemies || state !== 'playing') {
                clearInterval(spawnInterval);
                return;
            }
            const type = pickEnemyType();
            spawnEnemy(type);
            spawned++;
        }, 600);
    }

    function pickEnemyType() {
        // Early waves: mostly shamblers. Later: mix in harder types
        const r = Math.random();
        if (wave <= 2) {
            return r < 0.7 ? 'shambler' : 'runner';
        } else if (wave <= 5) {
            if (r < 0.35) return 'shambler';
            if (r < 0.6) return 'runner';
            if (r < 0.85) return 'crawler';
            return 'brute';
        } else {
            if (r < 0.2) return 'shambler';
            if (r < 0.45) return 'runner';
            if (r < 0.7) return 'crawler';
            return 'brute';
        }
    }

    function checkWaveComplete() {
        if (waveEnemiesLeft <= 0 && !betweenWaves && state === 'playing') {
            betweenWaves = true;
            waveTimer = 4; // seconds between waves

            // Refill some ammo between waves
            ammo[1] = Math.min(ammo[1] + 4, maxAmmo[1]);
            ammo[2] = Math.min(ammo[2] + 15, maxAmmo[2]);
            updateAmmoHUD();
        }
    }

    // ═══════════════════════════════════════
    // POWER-UPS
    // ═══════════════════════════════════════
    function spawnPowerup(pos) {
        const isHealth = Math.random() < 0.5;
        const color = isHealth ? 0x39FF14 : 0xffaa00;
        const geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
        const mat = new THREE.MeshStandardMaterial({
            color, emissive: color, emissiveIntensity: 0.5
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.position.y = 0.3;
        scene.add(mesh);
        activePowerups.push({ mesh, isHealth, life: 15 });
    }

    function updatePowerups(dt) {
        for (let i = activePowerups.length - 1; i >= 0; i--) {
            const p = activePowerups[i];
            p.life -= dt;
            p.mesh.rotation.y += dt * 2;

            // Pickup range
            const dist = camera.position.distanceTo(p.mesh.position);
            if (dist < 1.5) {
                if (p.isHealth) {
                    hp = Math.min(hp + 25, CONFIG.player.health);
                    updateHealthHUD();
                } else {
                    ammo[1] = Math.min(ammo[1] + 4, maxAmmo[1]);
                    ammo[2] = Math.min(ammo[2] + 10, maxAmmo[2]);
                    updateAmmoHUD();
                }
                scene.remove(p.mesh);
                activePowerups.splice(i, 1);
                continue;
            }

            if (p.life <= 0) {
                scene.remove(p.mesh);
                activePowerups.splice(i, 1);
            }
        }
    }

    // ═══════════════════════════════════════
    // — END PART 2 — paste Part 3 below ——
    // ═══════════════════════════════════════
          // ═══════════════════════════════════════
    // HUD UPDATES
    // ═══════════════════════════════════════
    function updateHUD() {
        document.getElementById('wave-display').textContent = `WAVE ${wave}`;
        document.getElementById('score-display').textContent = score;
        document.getElementById('kills-display').textContent = `KILLS: ${kills}`;
    }

    function updateHealthHUD() {
        const pct = Math.max(0, hp / CONFIG.player.health * 100);
        const bar = document.getElementById('health-bar');
        bar.style.width = pct + '%';
        if (pct < 30) bar.style.background = '#ff4444';
        else if (pct < 60) bar.style.background = '#ffaa00';
        else bar.style.background = '#39FF14';
    }

    function updateAmmoHUD() {
        const a = ammo[curWeapon];
        document.getElementById('ammo-display').textContent =
            a === Infinity ? '∞' : a;
    }

    function updateWeaponHUD() {
        document.querySelectorAll('.weapon-slot').forEach((el, i) => {
            el.classList.toggle('active', i === curWeapon);
        });
        updateAmmoHUD();
    }

    function showWaveAnnounce(text) {
        const el = document.getElementById('wave-announce');
        el.textContent = text;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    // ═══════════════════════════════════════
    // START / RESTART / GAME OVER
    // ═══════════════════════════════════════
    function startGame() {
        state = 'playing';
        score = 0; kills = 0; wave = 0;
        hp = CONFIG.player.health;
        curWeapon = 0;
        ammo = [Infinity, 8, 30];
        pitch = 0; yaw = 0;

        // Clear leftovers
        for (const e of activeEnemies) scene.remove(e.group);
        activeEnemies.length = 0;
        for (const p of activePowerups) scene.remove(p.mesh);
        activePowerups.length = 0;
        for (const pt of particles) scene.remove(pt);
        particles.length = 0;

        document.getElementById('blocker').style.display = 'none';
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('hud').style.display = 'block';

        updateHUD();
        updateHealthHUD();
        updateWeaponHUD();

        if (!isMobile) {
            renderer.domElement.requestPointerLock();
        }

        startWave();
    }

    function gameOver() {
        state = 'gameover';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-stats').innerHTML =
            `WAVE ${wave}<br>SCORE: ${score}<br>KILLS: ${kills}`;

        if (document.pointerLockElement) document.exitPointerLock();
    }

    // ═══════════════════════════════════════
    // INPUT EVENTS
    // ═══════════════════════════════════════

    // Click/tap to start or shoot
    document.getElementById('blocker').addEventListener('click', () => {
        if (state === 'menu') startGame();
    });
    document.getElementById('blocker').addEventListener('touchend', e => {
        e.preventDefault();
        if (state === 'menu') startGame();
    });

    document.getElementById('game-over').addEventListener('click', () => {
        if (state === 'gameover') startGame();
    });
    document.getElementById('game-over').addEventListener('touchend', e => {
        e.preventDefault();
        if (state === 'gameover') startGame();
    });

    // Desktop: click to shoot
    renderer.domElement.addEventListener('mousedown', e => {
        if (e.button === 0) shoot();
    });

    // Mobile: tap to shoot (only if not aim touch)
    renderer.domElement.addEventListener('touchstart', e => {
        if (state !== 'playing') return;
        // Shoot on any new touch that isn't the aim drag
        for (const t of e.changedTouches) {
            if (t.identifier !== aimTouchId) {
                shoot();
            }
        }
    }, { passive: true });

    // Keyboard: weapon switch + number keys
    document.addEventListener('keydown', e => {
        if (state !== 'playing') return;
        if (e.key === '1') { curWeapon = 0; updateWeaponHUD(); }
        if (e.key === '2') { curWeapon = 1; updateWeaponHUD(); }
        if (e.key === '3') { curWeapon = 2; updateWeaponHUD(); }
        if (e.key === 'q' || e.key === 'Q') {
            curWeapon = (curWeapon + 1) % CONFIG.weapons.length;
            updateWeaponHUD();
        }
    });

    // Weapon bar tap (mobile)
    document.querySelectorAll('.weapon-slot').forEach(el => {
        el.addEventListener('click', () => {
            if (state !== 'playing') return;
            curWeapon = parseInt(el.dataset.weapon);
            updateWeaponHUD();
        });
        el.addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation();
            if (state !== 'playing') return;
            curWeapon = parseInt(el.dataset.weapon);
            updateWeaponHUD();
        });
    });

    // ═══════════════════════════════════════
    // GAME LOOP
    // ═══════════════════════════════════════
    function gameLoop() {
        requestAnimationFrame(gameLoop);

        const dt = Math.min(clock.getDelta(), 0.1);

        // Camera rotation
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        if (state === 'playing') {
            updateEnemies(dt);
            updatePowerups(dt);
            checkWaveComplete();

            // Muzzle flash decay
            if (muzzleTimer > 0) {
                muzzleTimer -= dt;
                if (muzzleTimer <= 0) muzzleFlash.intensity = 0;
            }

            // Particles decay
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].userData.life -= dt;
                particles[i].material.opacity = Math.max(0, particles[i].userData.life / 0.4);
                if (particles[i].userData.life <= 0) {
                    scene.remove(particles[i]);
                    particles.splice(i, 1);
                }
            }

            // Between waves countdown
            if (betweenWaves) {
                waveTimer -= dt;
                if (waveTimer <= 0) startWave();
            }
        }

        renderer.render(scene, camera);
    }
    gameLoop();

    // ═══════════════════════════════════════
    // RESIZE
    // ═══════════════════════════════════════
    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    </script>
</body>
